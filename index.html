  S.push({
    id: 'z01', track: 'az', tier: 'z-f', title: 'Cloud concepts the Microsoft way', code: 'AZ01-CONSUMPTION-MODEL',
    goal: 'Shared responsibility, cloud models, consumption-based pricing, serverless, and the benefits Microsoft tests by name.',
    lesson: [
      { h: 'Cloud computing in AZ-900 language', html: '<p>Cloud computing is the delivery of computing services over the internet. Microsoft tests these words: <b>consumption-based model</b> (pay for what you use, no upfront cost), <b>OpEx vs CapEx</b>, <b>serverless</b> (you don\'t manage servers; event-driven, billed per execution).</p>' },
      { h: 'Shared responsibility', html: '<p>In <b>every</b> model the customer is responsible for: <b>information and data</b>, <b>devices</b> (mobile/PCs), and <b>accounts and identities</b>. The cloud provider is always responsible for the <b>physical hosts, network and datacenter</b>. In between, responsibility shifts: on-prem (all you) → IaaS (OS, network controls, apps are yours) → PaaS (shared: apps, identity infrastructure, network controls) → SaaS (mostly Microsoft).</p>' },
      { h: 'Cloud models', html: '<ul><li><b>Public</b> — provider owns hardware; available to anyone; no CapEx.</li><li><b>Private</b> — used by one organization (on-prem or hosted); full control; you buy hardware.</li><li><b>Hybrid</b> — public + private connected; flexibility.</li><li><b>Multi-cloud</b> — more than one public cloud provider. <b>Azure Arc</b> manages hybrid and multi-cloud resources from Azure; <b>Azure VMware Solution</b> runs VMware workloads in Azure.</li></ul>' },
      { h: 'Benefits Microsoft names', html: '<table><tr><th>Benefit</th><th>Meaning</th></tr><tr><td><b>High availability</b></td><td>Uptime guaranteed by <b>SLAs</b> (e.g., 99.9%, 99.95%, 99.99%)</td></tr><tr><td><b>Scalability</b></td><td><b>Vertical</b> (scale up: bigger VM) vs <b>horizontal</b> (scale out: more VMs)</td></tr><tr><td><b>Elasticity</b></td><td>Automatically scale with demand</td></tr><tr><td><b>Reliability</b></td><td>Recover from failures; global distribution</td></tr><tr><td><b>Predictability</b></td><td>Performance and <b>cost</b> predictability (pricing calculator, TCO)</td></tr><tr><td><b>Security & governance</b></td><td>Templates, policies, patches handled for PaaS/SaaS</td></tr><tr><td><b>Manageability</b></td><td>Management <i>of</i> the cloud (autoscale, monitoring) and <i>in</i> the cloud (portal, CLI, APIs)</td></tr></table><p>SLA math: 99.9% ≈ 43.8 min downtime/month; 99.99% ≈ 4.4 min/month. Combined SLA of dependent services = product of their SLAs (lower than each).</p>' },
      { h: 'Service types', html: '<p><b>IaaS</b> (VMs — most control), <b>PaaS</b> (App Service, Azure SQL — no OS management), <b>SaaS</b> (Microsoft 365). Use-case words: IaaS for lift-and-shift, test/dev; PaaS for development frameworks, analytics; SaaS for email, CRM.</p>' }
    ],
    cards: [['Consumption-based model', 'Pay only for resources used; no upfront costs.'], ['CapEx', 'Up-front spending on physical infrastructure.'], ['OpEx', 'Spending on services as you consume them.'], ['Serverless', 'Provider manages servers; event-driven, billed per execution (Azure Functions).'],
      ['Customer always responsible', 'Information and data, devices, accounts and identities.'], ['Provider always responsible', 'Physical hosts, physical network, physical datacenter.'], ['Public cloud', 'Provider-owned, shared infrastructure, no CapEx.'], ['Private cloud', 'Dedicated to one organization; you own/control it.'], ['Hybrid cloud', 'Public and private clouds connected.'], ['Multi-cloud', 'Using multiple public cloud providers.'], ['Azure Arc', 'Manage hybrid/multi-cloud servers, Kubernetes and data from Azure.'],
      ['SLA', 'Service Level Agreement: guaranteed uptime %, with credits if missed.'], ['Vertical scaling', 'Scale up/down: change VM size.'], ['Horizontal scaling', 'Scale out/in: add/remove instances.'], ['Elasticity', 'Automatically adjust resources to demand.'], ['Composite SLA', 'Multiply SLAs of dependent services; result is lower than each.'], ['99.99% monthly downtime', '≈ 4.4 minutes.'], ['99.9% monthly downtime', '≈ 43.8 minutes.']],

    lesson: [
      { h: 'Physical architecture', html: '<ul><li><b>Region</b> — one or more datacenters in a geography. <b>Availability zones</b> — physically separate datacenters within a region (minimum 3 in zone-enabled regions). <b>Zonal</b> services pin to a zone (VMs, disks); <b>zone-redundant</b> services replicate across zones (ZRS storage, SQL).</li><li><b>Region pairs</b> — most regions pair with another ≥300 miles away in the same geography (East US ↔ West US); sequential updates, prioritized recovery, data residency kept.</li><li><b>Sovereign regions</b> — Azure Government (US government) and Azure operated by 21Vianet (China).</li></ul>' },
      { h: 'Management hierarchy', html: '<pre>Management groups  (up to 6 levels)\n  └─ Subscriptions  (billing + access boundary)\n       └─ Resource groups  (lifecycle container)\n            └─ Resources  (VM, VNet, storage account…)</pre><ul><li>Every resource is in exactly <b>one</b> resource group. RGs can hold resources from different regions. Deleting an RG deletes everything in it. RGs cannot be nested.</li><li>Policies and RBAC <b>inherit downward</b>.</li><li>Multiple subscriptions for separate billing, environments, or limits.</li></ul>' },
      { h: 'Compute', html: '<p><b>Virtual Machines</b> (IaaS), <b>VM Scale Sets</b> (autoscale identical VMs), <b>Availability sets</b> (fault domains + update domains within a datacenter), <b>Azure Virtual Desktop</b>, <b>Containers</b> (ACI, AKS, Container Apps), <b>Azure Functions</b> (serverless), <b>App Service</b> (PaaS web apps, API apps, WebJobs).</p>' },
      { h: 'Networking', html: '<p><b>VNets</b> + subnets, <b>peering</b> (private, across regions too), <b>NSGs</b>, <b>VPN Gateway</b> (site-to-site, point-to-site, VNet-to-VNet over the internet, encrypted), <b>ExpressRoute</b> (private connection, does not traverse the internet), <b>Azure DNS</b> (host zones; public and private). Public endpoints vs <b>private endpoints</b>.</p>' },
      { h: 'Storage', html: '<ul><li>Storage account (globally unique name, 3–24 lowercase/numbers). Services: <b>Blob</b> (objects), <b>Files</b> (SMB/NFS shares), <b>Queues</b>, <b>Tables</b>, plus managed <b>Disks</b>.</li><li>Blob access tiers: <b>Hot</b>, <b>Cool</b> (30-day min), <b>Cold</b> (90-day), <b>Archive</b> (180-day, offline, rehydrate hours).</li><li>Redundancy: LRS, ZRS, GRS, GZRS, RA-GRS, RA-GZRS.</li><li>Migration: <b>Azure Migrate</b>, <b>Data Box</b>; file movement: <b>AzCopy</b>, <b>Storage Explorer</b>, <b>Azure File Sync</b>.</li></ul>' },

      ['Availability zone', 'Physically separate datacenter(s) within a region; min 3 in zone-enabled regions.'], ['Region pair', 'Two regions in the same geography ≥300 miles apart for DR and sequential updates.'], ['Sovereign region', 'Isolated instances: Azure Government, Azure China (21Vianet).'], ['Hierarchy', 'Management groups → subscriptions → resource groups → resources.'], ['Resource group', 'Lifecycle container; one RG per resource; not nestable.'], ['Subscription', 'Billing and access-management boundary.'],

  S.push({
    id: 'z08', track: 'az', tier: 'z-c', title: 'Virtual networking', code: 'AZ08-NSG-PRIORITY',
    goal: 'VNets, subnets, peering, NSGs and ASGs, routing, DNS, load balancers, VPN and ExpressRoute.',
    lesson: [
      { h: 'VNets and subnets', html: '<p>A VNet has one or more address spaces; subnets carve it up. Azure reserves <b>5 IPs per subnet</b> (.0 network, .1 gateway, .2 and .3 Azure DNS, last = broadcast). Special subnets: <code>GatewaySubnet</code>, <code>AzureBastionSubnet</code> (/26+), <code>AzureFirewallSubnet</code>. Public IPs: Standard SKU (zone-redundant, secure by default) vs Basic (retired).</p>' },
      { h: 'NSGs — how evaluation really works', html: '<ul><li>Rules have <b>priority 100–4096</b>; <b>lowest number is evaluated first</b>; first match wins and processing stops.</li><li>Default inbound rules (cannot delete, can override with lower numbers): <b>65000 AllowVnetInBound</b>, <b>65001 AllowAzureLoadBalancerInBound</b>, <b>65500 DenyAllInBound</b>.</li><li>NSGs can be associated with a <b>subnet</b> and/or a <b>NIC</b>. Inbound traffic must be allowed by <b>both</b> (subnet NSG first, then NIC NSG). Outbound: NIC then subnet.</li><li><b>Application security groups</b> group VMs by role ("web", "db") so rules reference roles, not IPs.</li><li>Service tags: Internet, VirtualNetwork, AzureLoadBalancer, Storage, Sql…</li><li><b>Effective security rules</b> and <b>IP flow verify</b> (Network Watcher) show exactly which rule allows/denies.</li></ul>' },
      { h: 'Routing & connectivity', html: '<ul><li>System routes + <b>user-defined routes (UDR)</b> in route tables (e.g., 0.0.0.0/0 → Azure Firewall private IP, next hop type Virtual appliance).</li><li><b>VNet peering</b> (regional/global), non-transitive; "use remote gateway" for gateway transit.</li><li><b>VPN Gateway</b> (route-based, SKUs), <b>ExpressRoute</b> (private, SLA), <b>Virtual WAN</b>.</li><li><b>Azure DNS</b> public zones, <b>private DNS zones</b> linked to VNets (auto-registration).</li><li>Load balancing: <b>Load Balancer</b> (L4, public/internal, health probes), <b>Application Gateway</b> (L7, path routing, WAF), <b>Front Door</b> (global L7), <b>Traffic Manager</b> (DNS).</li></ul>' },
      { h: 'Lab', html: '<p>Ticket: the web VM is unreachable even though "we allowed port 80". Find out which NSG rule is winning, fix it without deleting the deny-internet rule, and keep SSH closed.</p>' }
    ],
    cards: [['NSG priority range', '100–4096; lower number = evaluated first; first match wins.'], ['Default NSG inbound rules', '65000 AllowVnetInBound, 65001 AllowAzureLoadBalancerInBound, 65500 DenyAllInBound.'], ['Subnet + NIC NSG (inbound)', 'Traffic must be allowed by both; subnet evaluated first.'], ['Application security group', 'Logical group of NICs used as source/destination in NSG rules.'], ['Service tag', 'Named group of Azure IP prefixes (Internet, VirtualNetwork, Storage...).'],
      ['Azure reserved IPs', '5 per subnet: network, gateway, 2 DNS, broadcast.'], ['GatewaySubnet', 'Required name for VPN/ExpressRoute gateway subnet.'], ['AzureBastionSubnet', 'Required subnet name for Bastion (/26 or larger).'], ['UDR', 'User-defined route overriding system routes (e.g., to a firewall).'], ['VNet peering transitivity', 'Not transitive; use hub with gateway transit or Virtual WAN.'],
      ['Private DNS zone', 'Name resolution within linked VNets; supports auto-registration.'], ['IP flow verify', 'Network Watcher tool that tells which NSG rule allows/denies a flow.'], ['Effective security rules', 'Combined NSG rules applied to a NIC.'], ['Azure Load Balancer', 'Layer 4 TCP/UDP with health probes.'], ['Application Gateway', 'Layer 7 regional LB with WAF option.']],
    qs: [
      { gen: 'cloudSubnet', d: 'y4' },
      Q('An NSG has "Deny Internet any" at priority 200 and "Allow 80 from Internet" at priority 300. Is HTTP allowed?', 'No — priority 200 is evaluated first and denies', ['Yes — allow beats deny', 'Yes — the highest number wins', 'Only for HTTPS'], 'Lowest number first, first match wins.', 'y4'),
      Q('Subnet NSG allows port 80 but the NIC NSG has only an SSH rule. Is HTTP from the internet allowed?', 'No — the NIC NSG\'s DenyAllInBound blocks it; both must allow', ['Yes — subnet NSG wins', 'Yes — NIC NSGs only filter outbound', 'Only if the VM has two NICs'], 'Both NSGs evaluate inbound.', 'y4'),
      Q('Which default rule allows VMs in the same VNet to talk to each other?', 'AllowVnetInBound (65000)', ['DenyAllInBound (65500)', 'AllowInternetOutBound', 'AllowAzureLoadBalancerInBound'], 'Default VNet rule.', 'y4'),
      Q('Write NSG rules by application role instead of IP addresses.', 'Application security groups', ['Service tags', 'UDRs', 'Private DNS'], 'ASGs.', 'y4'),
      Q('Determine exactly which NSG rule is blocking traffic to a VM.', 'Network Watcher IP flow verify (or effective security rules)', ['Azure Advisor', 'Activity log', 'Cost analysis'], 'IP flow verify.', 'y4'),
      Q('Force all outbound internet traffic from a subnet through Azure Firewall.', 'Route table with 0.0.0.0/0 next hop Virtual appliance (firewall private IP) associated to the subnet', ['NSG deny rule', 'VNet peering', 'Service endpoint'], 'UDR.', 'y4'),
      Q('VNet A peers with hub, hub peers with VNet B. Can A reach B by default?', 'No — peering is not transitive', ['Yes, automatically', 'Only for DNS', 'Only with public IPs'], 'Non-transitive.', 'y4'),
      Q('Which subnet name is required for a VPN gateway?', 'GatewaySubnet', ['VPNSubnet', 'AzureGatewaySubnet', 'default'], 'Exact name required.', 'y4'),
      Q('VMs should resolve each other by name inside two VNets without a custom DNS server.', 'Azure Private DNS zone linked to both VNets with auto-registration', ['Public DNS zone', 'Hosts file', 'Traffic Manager'], 'Private DNS.', 'y4'),
      Q('Route /images/* and /api/* to different backend pools with WAF protection.', 'Application Gateway', ['Azure Load Balancer', 'Traffic Manager', 'VPN Gateway'], 'L7 path routing.', 'y4'),
      Q('Internal TCP load balancing for SQL VMs on port 1433 with health probes.', 'Internal Azure Load Balancer (Standard)', ['Front Door', 'Application Gateway public', 'Traffic Manager'], 'Internal LB.', 'y4'),
      Q('Valid NSG priority values range from:', '100 to 4096', ['1 to 65500', '0 to 1000', '1000 to 65000'], 'Custom rules.', 'y4'),
      T('Type the az command used to change an existing NSG rule (four words after az).', ['az network nsg rule update'], 'az network nsg rule update -g ... --nsg-name ... -n ... --priority ...', 'y4', 'az network ...')
    ],
    labs: ['c-az-nsg']
  });

  S.push({
    id: 'z09', track: 'az', tier: 'z-c', title: 'Monitor, back up & recover', code: 'AZ09-ALERT-AND-RESTORE',
    goal: 'Azure Monitor metrics/logs/alerts, action groups, KQL basics, Network Watcher, Backup and Site Recovery.',

      { h: 'Azure Monitor', html: '<ul><li><b>Metrics</b> (numeric, near real-time, 93-day retention) vs <b>logs</b> (Log Analytics workspace, KQL).</li><li><b>Alert rule</b> = scope + condition (signal + logic) + <b>action group</b> (email/SMS/push/voice, webhook, Logic App, Function, ITSM, runbook). <b>Alert processing rules</b> suppress alerts during maintenance.</li><li><b>VM Insights</b>, <b>Container Insights</b>, <b>Application Insights</b>; Data collection rules + Azure Monitor Agent.</li><li><b>Activity log</b> — control-plane events (who stopped the VM).</li></ul><pre>Heartbeat\n| where TimeGenerated > ago(15m)\n| summarize LastBeat = max(TimeGenerated) by Computer</pre><pre>az monitor metrics alert create -n cpu-high -g rg-web \\\n  --scopes &lt;vm-id&gt; --condition "avg Percentage CPU > 80" \\\n  --action ops-ag</pre>' },
      { h: 'Network Watcher', html: '<p>IP flow verify, next hop, connection troubleshoot, NSG/VNet flow logs, packet capture, topology.</p>' },
      { h: 'Backup & DR', html: '<ul><li><b>Recovery Services vault</b> / <b>Backup vault</b>; backup policies (schedule, retention), soft delete, cross-region restore.</li><li>Back up VMs (application-consistent), Azure Files, SQL in VMs, blobs (operational/vaulted).</li><li><b>Azure Site Recovery</b> replicates VMs to another region; recovery plans; test failover without impact. RPO/RTO concepts.</li></ul>' },

    qs: [
      Q('Email the on-call team and call a webhook when an alert fires. Configure:', 'An action group', ['A diagnostic setting', 'A budget', 'A resource lock'], 'Action groups.', 'y5'),
      Q('Who deallocated the production VM at 2 AM?', 'Activity log', ['VM metrics', 'Log Analytics heartbeat only', 'Azure Advisor'], 'Control-plane events.', 'y5'),
      Q('Suppress alert notifications during a Saturday maintenance window.', 'Alert processing rule', ['Delete the alert', 'Disable the VM', 'Resource lock'], 'Alert processing rules.', 'y5'),
      Q('Query which VMs stopped sending heartbeats in the last 15 minutes.', 'KQL query on the Heartbeat table in Log Analytics', ['Activity log filter', 'Cost analysis', 'Azure Policy'], 'Logs + KQL.', 'y5'),
      Q('Collect guest OS performance counters and event logs from VMs.', 'Azure Monitor Agent with a data collection rule', ['Activity log', 'NSG flow logs', 'Advisor'], 'AMA + DCR.', 'y5'),
      Q('Determine where traffic from a VM to 10.20.1.5 is routed.', 'Network Watcher next hop', ['IP flow verify', 'Topology only', 'Service Health'], 'Next hop.', 'y5'),
      Q('Back up Azure VMs daily and keep them for 30 days.', 'Recovery Services vault with a backup policy', ['Snapshots by hand', 'Site Recovery', 'Lifecycle management'], 'Azure Backup.', 'y5'),
      Q('Replicate VMs to another region and fail over during a disaster.', 'Azure Site Recovery', ['Azure Backup', 'GRS storage', 'Availability set'], 'ASR.', 'y5'),
      Q('Validate DR without affecting production.', 'Run a test failover into an isolated VNet', ['Shut down production', 'Delete the vault', 'Disable replication'], 'Test failover.', 'y5'),
      Q('A backup was deleted by an attacker yesterday. What feature lets you recover it?', 'Soft delete for backups', ['Lifecycle rules', 'NSG', 'ReadOnly lock'], 'Soft delete.', 'y5'),
      Q('Which KQL operator aggregates rows (like GROUP BY)?', 'summarize', ['where', 'project', 'take'], 'summarize ... by ...', 'y5'),

  L['c-aws-vpc'] = {
    kind: 'cloud', cloud: 'aws', title: 'Build a public web tier from zero', sum: 'VPC, subnet, IGW, routes, SG, EC2',
    brief: 'Empty account. Build: VPC <b>10.0.0.0/16</b> → subnet <b>10.0.1.0/24</b> → internet gateway (attached) → route table with <code>0.0.0.0/0</code> to the IGW, associated to the subnet → security group allowing <b>80 and 443</b> from anywhere → instance tagged <b>Name=web1</b> with a public IP.<br>Security requirement: SSH (22) must <b>not</b> be open to the internet. Test with <code>curl http://&lt;public-ip&gt;</code>.<br>Tag syntax: <code>--tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=web1}]"</code>',
    tasks: [
      { t: 'A VPC with CIDR 10.0.0.0/16 exists', c: function (H) { return Object.keys(H.aws.vpcs).some(function (v) { return H.aws.vpcs[v].cidr === '10.0.0.0/16'; }); } },
      { t: 'web1 runs in a PUBLIC subnet (route to an attached IGW)', c: function (H) { var i = H.inst('web1'); return !!i && H.c.subnetIsPublic(i.subnet); } },
      { t: 'web1 answers on port 80 from the internet', c: function (H) { return H.web('web1', 80); } },
      { t: 'web1 answers on port 443 from the internet', c: function (H) { return H.web('web1', 443); } },
      { t: 'SSH (22) is NOT open to the internet', c: function (H) { return !!H.inst('web1') && !sgOpenToWorld(H, 'web1', 22); } }
    ],
    hints: ['Each create command prints an ID (vpc-…, subnet-…). Tab completes IDs after you type the prefix.', 'A new route table only has the local route. Add <code>aws ec2 create-route --route-table-id rtb-… --destination-cidr-block 0.0.0.0/0 --gateway-id igw-…</code> and associate it with the subnet.', 'Launch with <code>--associate-public-ip-address</code> or later allocate and associate an Elastic IP.'],
    solution: [['aws ec2 create-vpc --cidr-block 10.0.0.0/16', 'VPC'], ['aws ec2 create-subnet --vpc-id ${VPC} --cidr-block 10.0.1.0/24', 'SUBNET'], ['aws ec2 create-internet-gateway', 'IGW'], 'aws ec2 attach-internet-gateway --internet-gateway-id ${IGW} --vpc-id ${VPC}', ['aws ec2 create-route-table --vpc-id ${VPC}', 'RTB'], 'aws ec2 create-route --route-table-id ${RTB} --destination-cidr-block 0.0.0.0/0 --gateway-id ${IGW}', 'aws ec2 associate-route-table --route-table-id ${RTB} --subnet-id ${SUBNET}', ['aws ec2 create-security-group --group-name web --description "web tier" --vpc-id ${VPC}', 'SG'], 'aws ec2 authorize-security-group-ingress --group-id ${SG} --protocol tcp --port 80 --cidr 0.0.0.0/0', 'aws ec2 authorize-security-group-ingress --group-id ${SG} --protocol tcp --port 443 --cidr 0.0.0.0/0', 'aws ec2 run-instances --image-id ami-0abc --instance-type t3.micro --subnet-id ${SUBNET} --security-group-ids ${SG} --associate-public-ip-address --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=web1}]"'],
    debrief: 'Four things had to line up for the internet to reach web1: IGW attached, route to it, public IP, and a security group rule. Missing any one = timeout. That checklist solves most "my EC2 isn\'t reachable" tickets.'
  };

  L['c-aws-3tier'] = {
    kind: 'cloud', cloud: 'aws', title: 'Three-tier VPC with NAT', sum: 'Private app & DB tiers, SG-to-SG rules, NAT gateway',
    brief: 'VPC <b>prod</b> (10.0.0.0/16) already has a public subnet with <b>web1</b> behind security group <b>web</b>. Add:<br>• Private subnets <b>10.0.2.0/24</b> (app) and <b>10.0.3.0/24</b> (db).<br>• A NAT gateway in the public subnet; private subnets route <code>0.0.0.0/0</code> to it.<br>• SG <b>app</b>: TCP 8080 only from SG <b>web</b>. SG <b>db</b>: TCP 3306 only from SG <b>app</b>.<br>• Instances <b>app1</b> and <b>db1</b> in their private subnets, <b>no public IPs</b>.<br>Start with <code>aws ec2 describe-subnets</code> and <code>aws ec2 describe-security-groups</code>.',
    pre: VPC_PRE,
    tasks: [
      { t: 'app1 and db1 run in private subnets with no public IP', c: function (H) { var a = H.inst('app1'), d = H.inst('db1'); return !!a && !!d && !a.publicIp && !d.publicIp && !H.c.subnetIsPublic(a.subnet) && !H.c.subnetIsPublic(d.subnet) && a.subnet !== d.subnet; } },
      { t: 'web1 → app1 on 8080 is allowed', c: function (H) { return H.between('web1', 'app1', 8080); } },
      { t: 'app1 → db1 on 3306 is allowed', c: function (H) { return H.between('app1', 'db1', 3306); } },
      { t: 'web1 → db1 on 3306 is BLOCKED (no tier skipping)', c: function (H) { return !!H.inst('db1') && !!H.inst('web1') && !H.between('web1', 'db1', 3306); } },
      { t: 'app1 and db1 reach the internet outbound through the NAT', c: function (H) { var a = H.c.awsOutbound('app1'), d = H.c.awsOutbound('db1'); return a.ok && a.via === 'nat' && d.ok && d.via === 'nat'; } }
    ],
    hints: ['NAT needs an Elastic IP: <code>aws ec2 allocate-address</code>, then <code>aws ec2 create-nat-gateway --subnet-id &lt;PUBLIC subnet&gt; --allocation-id eipalloc-…</code>.', 'Create one private route table: <code>0.0.0.0/0 → --nat-gateway-id nat-…</code>, associate it with BOTH private subnets.', 'SG-to-SG rule: <code>aws ec2 authorize-security-group-ingress --group-id &lt;app sg&gt; --protocol tcp --port 8080 --source-group &lt;web sg&gt;</code>'],
    solution: [['aws ec2 create-subnet --vpc-id vpc-101 --cidr-block 10.0.2.0/24', 'APPSUB'], ['aws ec2 create-subnet --vpc-id vpc-101 --cidr-block 10.0.3.0/24', 'DBSUB'], ['aws ec2 allocate-address', 'EIP'], ['aws ec2 create-nat-gateway --subnet-id subnet-104 --allocation-id ${EIP}', 'NAT'], ['aws ec2 create-route-table --vpc-id vpc-101', 'PRT'], 'aws ec2 create-route --route-table-id ${PRT} --destination-cidr-block 0.0.0.0/0 --nat-gateway-id ${NAT}', 'aws ec2 associate-route-table --route-table-id ${PRT} --subnet-id ${APPSUB}', 'aws ec2 associate-route-table --route-table-id ${PRT} --subnet-id ${DBSUB}', ['aws ec2 create-security-group --group-name app --description "app tier" --vpc-id vpc-101', 'APPSG'], ['aws ec2 create-security-group --group-name db --description "db tier" --vpc-id vpc-101', 'DBSG'], 'aws ec2 authorize-security-group-ingress --group-id ${APPSG} --protocol tcp --port 8080 --source-group sg-108', 'aws ec2 authorize-security-group-ingress --group-id ${DBSG} --protocol tcp --port 3306 --source-group ${APPSG}', 'aws ec2 run-instances --image-id ami-0app --instance-type t3.small --subnet-id ${APPSUB} --security-group-ids ${APPSG} --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=app1}]"', 'aws ec2 run-instances --image-id ami-0db --instance-type r6g.large --subnet-id ${DBSUB} --security-group-ids ${DBSG} --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=db1}]"'],
    debrief: 'This is the textbook SAA architecture. SG references mean Auto Scaling can replace app servers and the database rule still works — no IPs to maintain. In production you\'d add a second AZ and a NAT per AZ.'
  };

  L['c-aws-alarm'] = {
    kind: 'cloud', cloud: 'aws', title: 'CPU alarm with email paging', sum: 'SNS topic, subscription, CloudWatch alarm',
    brief: 'web1 is running (find its instance ID with <code>aws ec2 describe-instances</code>). Create an SNS topic <b>ops-alerts</b>, subscribe <b>oncall@example.com</b> by email, then create a CloudWatch alarm named <b>web1-cpu-high</b> on <code>CPUUtilization</code> (namespace <code>AWS/EC2</code>, Average, period 300) that fires when CPU is <b>GreaterThanThreshold 80</b> for <b>2</b> evaluation periods, for web1\'s instance ID, notifying the topic.',
    pre: VPC_PRE,
    tasks: [
      { t: 'Topic ops-alerts has an email subscription', c: function (H) { var t = Object.keys(H.aws.topics).filter(function (a) { return /:ops-alerts$/.test(a); })[0]; return !!t && H.aws.topics[t].subs.some(function (s) { return s.proto === 'email' && /@/.test(s.ep); }); } },
      { t: 'Alarm web1-cpu-high watches AWS/EC2 CPUUtilization for web1', c: function (H) { var a = H.aws.alarms['web1-cpu-high'], i = H.inst('web1'); return !!a && a.metric === 'CPUUtilization' && a.ns === 'AWS/EC2' && a.dims.some(function (d) { return d.Name === 'InstanceId' && d.Value === i.id; }); } },
      { t: 'Threshold: > 80 for 2 periods of 300 s (Average)', c: function (H) { var a = H.aws.alarms['web1-cpu-high']; return !!a && a.threshold === 80 && a.cmp === 'GreaterThanThreshold' && a.periods === 2 && a.period === 300 && /^average$/i.test(a.stat); } },
      { t: 'Alarm action notifies ops-alerts', c: function (H) { var a = H.aws.alarms['web1-cpu-high']; return !!a && a.actions.some(function (x) { return /:ops-alerts$/.test(x); }); } }
    ],
    hints: ['<code>aws sns create-topic --name ops-alerts</code> prints the TopicArn — you need it twice.', '<code>aws sns subscribe --topic-arn &lt;arn&gt; --protocol email --notification-endpoint oncall@example.com</code>', '<code>aws cloudwatch put-metric-alarm --alarm-name web1-cpu-high --metric-name CPUUtilization --namespace AWS/EC2 --statistic Average --period 300 --threshold 80 --comparison-operator GreaterThanThreshold --evaluation-periods 2 --dimensions Name=InstanceId,Value=&lt;id&gt; --alarm-actions &lt;topic arn&gt;</code>'],
    solution: [['aws ec2 describe-instances', 'WEB1_ID'], 'aws sns create-topic --name ops-alerts', 'aws sns subscribe --topic-arn arn:aws:sns:us-east-1:123456789012:ops-alerts --protocol email --notification-endpoint oncall@example.com', 'aws cloudwatch put-metric-alarm --alarm-name web1-cpu-high --metric-name CPUUtilization --namespace AWS/EC2 --statistic Average --period 300 --threshold 80 --comparison-operator GreaterThanThreshold --evaluation-periods 2 --dimensions Name=InstanceId,Value=${WEB1_ID} --alarm-actions arn:aws:sns:us-east-1:123456789012:ops-alerts'],
    debrief: '2 periods × 5 minutes means a 10-minute sustained spike — that avoids paging people for a 30-second blip. Tuning evaluation periods is half of good alerting.'
  };

  L['c-aws-ts'] = {

    brief: 'Ticket: <i>"Our site on web1 stopped responding after someone rebuilt the network. Also security says port 22 is open to the world."</i><br>Make web1 serve HTTP (80) to the internet and close SSH to the world. Use the describe commands and the [sim hint] from <code>curl</code>. Don\'t rebuild the VPC — fix it.',
    pre: ['aws ec2 create-vpc --cidr-block 10.20.0.0/16', 'aws ec2 create-subnet --vpc-id vpc-101 --cidr-block 10.20.1.0/24', 'aws ec2 create-internet-gateway', 'aws ec2 attach-internet-gateway --internet-gateway-id igw-105 --vpc-id vpc-101', 'aws ec2 create-route-table --vpc-id vpc-101', 'aws ec2 associate-route-table --route-table-id rtb-106 --subnet-id subnet-104', 'aws ec2 create-security-group --group-name web --description "web tier" --vpc-id vpc-101', 'aws ec2 authorize-security-group-ingress --group-id sg-108 --protocol tcp --port 22 --cidr 0.0.0.0/0', 'aws ec2 run-instances --image-id ami-0web --instance-type t3.micro --subnet-id subnet-104 --security-group-ids sg-108 --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=web1}]"'],

    hints: ['Three separate things are wrong. Check <code>aws ec2 describe-route-tables</code>, <code>describe-security-groups</code> and <code>describe-instances</code> (PublicIpAddress).', 'No public IP? <code>aws ec2 allocate-address</code> then <code>aws ec2 associate-address --instance-id &lt;id&gt; --allocation-id &lt;eipalloc&gt;</code>.', 'Remove the SSH rule: <code>aws ec2 revoke-security-group-ingress --group-id sg-108 --protocol tcp --port 22 --cidr 0.0.0.0/0</code>'],

    why: 'Missing default route to the IGW, no HTTP rule (only SSH from anywhere), and no public IP.',

  L['c-az-rg'] = {

      { t: 'Tags env=prod and owner=phil', c: function (H) { var r = H.az.rgs['rg-prod-eus']; return !!r && /^prod$/i.test(r.tags.env || '') && /^phil$/i.test(r.tags.owner || ''); } },
      { t: 'CanNotDelete lock keep-prod is applied', c: function (H) { var r = H.az.rgs['rg-prod-eus']; return !!r && r.locks.some(function (l) { return l.name === 'keep-prod' && l.level === 'CanNotDelete'; }); } },

  L['c-az-rbac'] = {

  L['c-az-storage'] = {

      { t: 'web1 is in the web subnet with a public IP', c: function (H) { var m = H.az.vms.web1; return !!m && m.vnet === 'vnet-web' && m.subnet === 'web' && !!m.publicIp; } },
      { t: 'Port 80 reachable from the internet', c: function (H) { return H.azWeb('web1', 80); } },

    var cap = s.capstone, n = cap ? cap.n : Math.min(s.gateN || 15, s.qs.length);
    p.innerHTML = '<div class="panel"><h2>' + (cap ? 'Capstone exam' : 'Gate test') + '</h2>' +
      '<p>' + n + ' questions' + (cap ? ', weighted to the official domain percentages, ' + cap.minutes + '-minute timer' : '') + '. No hints or explanations until the end. You need <b>over ' + PASS + '%</b> (' + Math.floor(n * PASS / 100 + 1) + '/' + n + ' or better).</p>' +
      (x.passed ? '<p class="chip ok">Already passed — best ' + x.best + '%. Retakes keep your best.</p>' : '') +
      '<p class="muted small">Attempts: ' + x.attempts + (x.best ? ' · best ' + x.best + '%' : '') + '</p>' +
      '<button class="btn pri" id="go">Start ' + (cap ? 'exam' : 'gate test') + '</button></div>' +
      (x.passed ? '<div class="panel" style="margin-top:12px"><div class="tag">Checkpoint phrase for this step</div><div class="code" style="margin-top:8px">' + esc(s.code) + '</div></div>' : '');
    $('#go', p).onclick = function () { runTest(p, s, buildSet(s, n), cap); };
  }
  function buildSet(s, n) {
    if (s.capstone) {
      var pool = [];
      STAGES.forEach(function (o) {
        var inPool = s.capstone.pool ? s.capstone.pool.indexOf(o.id) >= 0 : (o.idx <= s.idx && o.tier !== 'pro' && o.track === s.track);
        if (inPool) o.qs.forEach(function (q) { if (q.d) pool.push(q); });
      });
      var W = s.capstone.weights || C.weights, out = [];
      var counts = {}, tot = 0;
      Object.keys(W).forEach(function (d) { counts[d] = Math.round(n * W[d] / 100); tot += counts[d]; });
      var dk = Object.keys(W).sort(function (a, b) { return W[b] - W[a]; }), k = 0;
      while (tot !== n) { counts[dk[k % dk.length]] += tot < n ? 1 : -1; tot += tot < n ? 1 : -1; k++; }
      Object.keys(counts).forEach(function (d) {
        var dp = shuffle(pool.filter(function (q) { return String(q.d) === d; }));
        out = out.concat(dp.slice(0, counts[d]));
      });
      if (out.length < n) out = out.concat(shuffle(pool.filter(function (q) { return out.indexOf(q) < 0; })).slice(0, n - out.length));
      return shuffle(out).map(prep);
    }
    return shuffle(s.qs).slice(0, n).map(prep);
  }
  function runTest(p, s, set, cap) {
    var i = 0, answers = [], t0 = Date.now(), timerId = null, limit = cap ? cap.minutes * 60 : 0;
    function tick() {
      var el = $('#tm', p); if (!el) return;
      var left = limit - Math.floor((Date.now() - t0) / 1000);
      if (left <= 0) { finish(); return; }
      el.textContent = Math.floor(left / 60) + ':' + ('0' + left % 60).slice(-2);
    }
    if (cap) { timerId = setInterval(tick, 1000); cleanup = function () { clearInterval(timerId); }; }
    function show() {
      if (i >= set.length) return finish();
      var q = set[i];
      p.innerHTML = '<div class="qmeta"><span>' + (cap ? 'CAPSTONE' : 'GATE') + ' · Q' + (i + 1) + '/' + set.length + (q.d && (cap && cap.domains || C.domains) ? ' · D' + q.d : '') + '</span>' + (cap ? '<span class="timer" id="tm"></span>' : '') + '</div>' +
        '<div class="bar" style="margin-bottom:12px"><i style="width:' + (100 * i / set.length) + '%"></i></div><div class="panel" id="qp">' + renderQ(q) + '</div>' +
        '<div class="row" style="margin-top:10px"><button class="btn sm ghost" id="quit">Abandon test</button></div>';
      if (cap) tick();
      $('#quit', p).onclick = function () { if (confirm('Abandon this attempt? It counts as an attempt but not a score.')) { st(s.id).attempts++; persist(); if (timerId) clearInterval(timerId); route(); } };
      wire($('#qp', p), q, function (ok, picked) {
        answers.push({ ok: ok, picked: picked });
        if (!q.input) { var b = $('#qp', p).querySelector('[data-c="' + picked + '"]'); if (b) b.classList.add('sel'); }
        setTimeout(function () { i++; show(); }, q.input ? 150 : 220);
      }, false);
    }
    function finish() {
      if (timerId) clearInterval(timerId);
      while (answers.length < set.length) answers.push({ ok: false, picked: null, timeout: true });
      var right = answers.filter(function (a) { return a.ok; }).length, pct = Math.round(1000 * right / set.length) / 10;
      var x = st(s.id), passed = pct > PASS, first = passed && !x.passed;
      x.attempts++; x.best = Math.max(x.best || 0, pct);
      if (passed) x.passed = true;
      S.history.push({ stage: s.id, pct: pct, at: Date.now() });
      if (cap) {
        var byD = {}; set.forEach(function (q, k) { var d = q.d || 0; byD[d] = byD[d] || [0, 0]; byD[d][1]++; if (answers[k].ok) byD[d][0]++; });
      }
      persist(); topbar();
      var next = STAGES.filter(function (o) { return o.prev === s; })[0];
      var h = '<div class="panel center"><div class="tag">' + (passed ? 'PASSED' : 'NOT YET') + '</div><div class="big" style="color:' + (passed ? 'var(--ok)' : 'var(--bad)') + '">' + pct + '%</div>' +
        '<p>' + right + '/' + set.length + ' correct · needed over ' + PASS + '%</p>';
      if (passed) h += '<p class="muted">Write down your checkpoint phrase. Typing it into <b>Save → Restore</b> on any device puts you right back here.</p><div class="code" id="cp">' + esc(s.code) + '</div>' +
        '<div class="row" style="justify-content:center;margin-top:10px"><button class="btn" id="cpy">Copy phrase</button>' + (next ? '<button class="btn pri" data-go="#stage/' + next.id + '">Unlocked: ' + esc(next.title) + ' →</button>' : '') + '</div>';
      else h += '<p class="muted">Review every miss below, drill the cards, and use Practice → Missed only. Then retake — the questions reshuffle.</p>';
      h += '</div>';
      if (cap && byD) h += '<div class="panel" style="margin-top:12px"><h3>By domain</h3>' + Object.keys(byD).map(function (d) { var v = byD[d], pc = Math.round(100 * v[0] / v[1]); return '<div class="row small" style="margin:6px 0"><span style="flex:0 0 52%">' + esc(((cap && cap.domains) || C.domains || {})[d] || 'Other') + '</span><div class="bar grow"><i style="width:' + pc + '%;background:' + (pc > PASS ? 'var(--ok)' : pc >= 75 ? 'var(--lock)' : 'var(--bad)') + '"></i></div><span class="mono">' + pc + '%</span></div>'; }).join('') + '</div>';
      h += '<h3 style="margin-top:18px">Review</h3><div class="stack">';
      set.forEach(function (q, k) {
        var a = answers[k];
        var yours = a.timeout ? '(time ran out)' : q.input ? a.picked : (a.picked != null ? q.c[a.picked] : '');
        if (!a.ok && !q.gen) { var oi = s.qs.indexOf(q); }
        h += '<div class="panel tight"><div class="small muted">Q' + (k + 1) + ' · ' + (a.ok ? '<span style="color:var(--ok)">correct</span>' : '<span style="color:var(--bad)">missed</span>') + '</div><div class="q" style="font-size:.95rem">' + (q.html ? q.q : esc(q.q)) + '</div>' +
          (!a.ok ? '<div class="small">You: <code>' + esc(yours) + '</code></div>' : '') + explainHtml(q, a.ok) + '</div>';
      });
      h += '</div>';
      p.innerHTML = h;
      var cp = $('#cpy', p); if (cp) cp.onclick = function () { copy(s.code); };
      if (first) toast('🔓 ' + (next ? next.title + ' unlocked' : 'Path complete!'), 3000);
    }
    show();
  }

  // ---------- LABS ----------
  function pLabs(p, s) {
    p.innerHTML = '<div class="list">' + (s.labs || []).map(function (id) {
      var L = C.labs[id], ok = st(s.id).labs[id];
      return '<button class="li" data-go="#lab/' + id + '"><span class="chip ' + (ok ? 'ok' : '') + '">' + (ok ? '✓' : 'LAB') + '</span><span class="grow"><b>' + esc(L.title) + '</b><div class="s">' + esc(L.sum || '') + '</div></span><span class="muted">›</span></button>';
    }).join('') + '</div>';
  }
  function labStage(id) { return STAGES.filter(function (s) { return (s.labs || []).indexOf(id) >= 0; })[0]; }
  function vLabs(m) {
    var h = '<h1>Labs</h1><p class="muted">Every lab from steps you have unlocked. Labs stay open for practice after you pass.</p>';
    STAGES.forEach(function (s) {
      if (!(s.labs || []).length) return;
      var un = unlocked(s);
      h += '<div class="tier"><h3>' + esc(stepLabel(s)) + '. ' + esc(s.title) + '</h3>' + (un ? '' : '<span class="chip lock">🔒</span>') + '</div><div class="list">';
      s.labs.forEach(function (id) {
        var L = C.labs[id], ok = st(s.id).labs[id];
        h += '<button class="li" ' + (un ? 'data-go="#lab/' + id + '"' : 'disabled style="opacity:.5"') + '><span class="chip ' + (ok ? 'ok' : '') + '">' + (ok ? '✓' : 'LAB') + '</span><span class="grow"><b>' + esc(L.title) + '</b><div class="s">' + esc(L.sum || '') + '</div></span></button>';
      });
      h += '</div>';
    });
    m.innerHTML = h;
  }
  function vLab(m, args) {
    var id = args[0], L = C.labs[id], s = labStage(id);
    if (!L || !s || !unlocked(s)) { location.hash = '#labs'; return; }
    var kind = window.LAB_KINDS && window.LAB_KINDS[L.kind || 'net'];
    var api = {
      lite: S.device === 'phone',
      load: function () { return load(C.id + ':lab:' + id, null); },
      save: function (v) { save(C.id + ':lab:' + id, v); },
      clear: function () { try { localStorage.removeItem(C.id + ':lab:' + id); } catch (e) { } },
      complete: function () {
        if (!st(s.id).labs[id]) { st(s.id).labs[id] = true; persist(); toast('✓ Lab complete: ' + esc(L.title), 2600); }
      },
      done: function () { return !!st(s.id).labs[id]; },
      back: '#stage/' + s.id + '/labs',
      esc: esc, modal: modal, toast: toast,
      setCleanup: function (f) { cleanup = f; }
    };
    kind.render(m, L, api);
  }

  // ---------- CARDS (global) ----------
  function vCards(m) {
    var open = STAGES.filter(unlocked), all = [];
    open.forEach(function (s) { all = all.concat(s.cards); });
    var due = dueCards(all).length;
    m.innerHTML = '<h1>Flashcards</h1><p class="muted">Spaced repetition across every unlocked step. ' + due + ' due now of ' + all.length + '.</p>' +
      '<div class="row" style="margin-bottom:12px"><button class="btn pri" id="all">Review all due</button></div><div class="list">' +
      open.map(function (s) { return '<button class="li" data-st="' + s.id + '"><span class="grow"><b>' + esc(stepLabel(s)) + '. ' + esc(s.title) + '</b><div class="s">' + dueCards(s.cards).length + ' due · ' + s.cards.length + ' cards</div></span><span class="muted">›</span></button>'; }).join('') + '</div><div id="pane"></div>';
    $('#all', m).onclick = function () { var p = document.createElement('div'); m.innerHTML = ''; m.appendChild(p); cardSession(p, all, 'All decks'); };
    m.querySelectorAll('[data-st]').forEach(function (b) { b.onclick = function () { location.hash = '#stage/' + b.dataset.st + '/cards'; }; });
  }

  // ---------- TOOLS ----------
  function vTools(m) {
    m.innerHTML = '<h1>Tools & drills</h1><p class="muted">Endless, randomly generated practice. Use them any time — they never run out.</p><div class="list">' +
      (C.tools || []).map(function (t) { return '<button class="li" data-go="#tool/' + t.id + '"><span class="grow"><b>' + esc(t.title) + '</b><div class="s">' + esc(t.desc) + '</div></span><span class="muted">›</span></button>'; }).join('') + '</div>';
  }
  function vTool(m, args) {
    var t = (C.tools || []).filter(function (x) { return x.id === args[0]; })[0];
    if (!t) return vTools(m);
    m.innerHTML = '<div class="row" style="margin-bottom:8px"><button class="btn sm ghost" data-go="#tools">← Tools</button></div><h1>' + esc(t.title) + '</h1><div id="tool"></div>';
    t.render($('#tool', m), { esc: esc, shuffle: shuffle, toast: toast, gens: C.gens, renderQ: renderQ, wire: wire, prep: prep, setCleanup: function (f) { cleanup = f; } });
  }

  // ---------- SAVE / CODES ----------
  function normCode(c) { return String(c).toUpperCase().replace(/[^A-Z0-9]+/g, ''); }
  function restoreTo(s) {
    STAGES.forEach(function (o) {
      if (o.track === s.track && o.tidx <= s.tidx) { var x = st(o.id); x.lesson = true; (o.labs || []).forEach(function (l) { x.labs[l] = true; }); if (!x.passed) { x.passed = true; x.best = Math.max(x.best || 0, PASS + 1); x.restored = true; } }
    });
    persist();
  }
  function vCodes(m) {
    var earned = STAGES.filter(function (s) { return st(s.id).passed; });
    var hist = S.history.slice(-8).reverse();
    m.innerHTML = '<h1>Save & restore</h1>' +
      '<div class="panel"><h3>Restore from a checkpoint phrase</h3><p class="muted small">Lost your progress or switched devices? Type the phrase from the last step you passed. Every step up to it unlocks.</p>' +
      '<div class="row"><input class="answer-in grow" id="rc" placeholder="e.g. ' + esc(C.codeExample || 'PHRASE-HERE') + '" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false"><button class="btn pri" id="rb">Restore</button></div></div>' +
      '<div class="panel" style="margin-top:12px"><h3>Your checkpoint phrases</h3>' +
      (earned.length ? '<div class="list">' + earned.map(function (s) { return '<div class="li" style="cursor:default"><span class="chip ok">' + esc(stepLabel(s).replace('Step ', '')) + '</span><span class="grow"><b>' + esc(s.title) + '</b><div class="mono small" style="color:var(--acc);margin-top:2px">' + esc(s.code) + '</div></span><button class="btn sm" data-cp="' + esc(s.code) + '">Copy</button></div>'; }).join('') + '</div>' +
        '<p class="muted small" style="margin-top:10px">Only your latest phrase in each track matters — it restores everything before it in that track.</p>' : '<p class="muted">Pass your first gate test to earn a phrase.</p>') + '</div>' +
      '<div class="panel" style="margin-top:12px"><h3>Backup file</h3><p class="muted small">Exports everything — card schedules, missed questions, lab configs. Use it to move between iPhone and laptop with full detail.</p>' +
      '<div class="row"><button class="btn" id="ex">Export backup</button><label class="btn">Import backup<input type="file" id="im" accept=".json,application/json" hidden></label></div></div>' +
      '<div class="panel" style="margin-top:12px"><h3>Device mode</h3><p class="muted small">Currently: <b>' + (S.device === 'phone' ? 'Phone (lite)' : 'Laptop (full)') + '</b></p><button class="btn" id="dev">Switch device mode</button></div>' +
      (hist.length ? '<div class="panel" style="margin-top:12px"><h3>Recent tests</h3>' + hist.map(function (h) { var s = stageById(h.stage); return '<div class="row small" style="margin:4px 0"><span class="grow">' + esc(s ? s.title : h.stage) + '</span><span class="mono" style="color:' + (h.pct > PASS ? 'var(--ok)' : 'var(--bad)') + '">' + h.pct + '%</span><span class="dim">' + new Date(h.at).toLocaleDateString() + '</span></div>'; }).join('') + '</div>' : '') +
      '<div class="panel" style="margin-top:12px"><h3>Danger zone</h3><button class="btn warn" id="rs">Reset all progress</button></div>';
    $('#rb', m).onclick = function () {
      var v = normCode($('#rc', m).value);
      var s = STAGES.filter(function (x) { return normCode(x.code) === v; })[0];
      if (!s) { toast('That phrase does not match any step. Check spelling.'); return; }
      restoreTo(s); S.track = s.track; toast('✓ Restored through ' + esc(stepLabel(s)) + ': ' + esc(s.title), 3000); route();
    };
    m.querySelectorAll('[data-cp]').forEach(function (b) { b.onclick = function () { copy(b.dataset.cp); }; });
    $('#ex', m).onclick = function () {
      var labs = {}; try { for (var k = 0; k < localStorage.length; k++) { var key = localStorage.key(k); if (key.indexOf(C.id + ':lab:') === 0) labs[key] = localStorage.getItem(key); } } catch (e) { }
      var blob = new Blob([JSON.stringify({ course: C.id, at: Date.now(), state: S, labs: labs })], { type: 'application/json' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = C.id + '-backup-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    };
    $('#im', m).onchange = function (e) {
      var f = e.target.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        try {
          var d = JSON.parse(r.result);
          if (d.course !== C.id) { toast('That backup belongs to a different course (' + esc(d.course) + ')'); return; }
          var dev = S.device; S = d.state; S.device = dev; persist();
          Object.keys(d.labs || {}).forEach(function (k) { try { localStorage.setItem(k, d.labs[k]); } catch (e) { } });
          toast('✓ Backup imported'); route();
        } catch (err) { toast('Could not read that file'); }
      };
      r.readAsText(f);
    };
    $('#dev', m).onclick = function () { picker(true); };
    $('#rs', m).onclick = function () {
      if (prompt('Type RESET to wipe all progress on this device') === 'RESET') {
        try { Object.keys(localStorage).forEach(function (k) { if (k.indexOf(C.id + ':') === 0) localStorage.removeItem(k); }); } catch (e) { }
        var dev = S.device; S = { device: dev, stages: {}, cards: {}, missed: {}, history: [], created: Date.now() }; persist(); route();
      }
    };
  }

  // expose for lab plugins / debugging
  window.ENGINE_Q = { prep: prep, renderQ: renderQ, wire: wire };
  window.ENGINE = { state: function () { return S; }, persist: persist, stages: STAGES, st: st, route: route, esc: esc };

  // ---------- boot ----------
  shell();
  if (!S.device) picker(false); else route();
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { }); });
  }
})();

</script>
</body>
</html>
