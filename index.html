<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e13">
<meta name="description" content="AWS and Azure from zero to certified to senior: CLF-C02, SAA-C03, AZ-900, AZ-104 with locked paths, flashcards, explained questions and AWS/Azure CLI labs.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cloud Range">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Cloud Range</title>
<style>
:root{
  --bg:#0a0e13;--bg2:#0f141b;--panel:#131a23;--panel2:#18212c;--line:#223040;--line2:#2c3d50;
  --text:#dbe4ee;--muted:#8a9bb0;--dim:#5d6f84;
  --acc:#2dd4bf;--acc2:#0ea5a0;--accInk:#032a26;
  --lock:#f5b942;--ok:#3ddc84;--bad:#f2555a;--info:#6aa9ff;
  --r:12px;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,system-ui,sans-serif;
  --safeB:env(safe-area-inset-bottom,0px);--safeT:env(safe-area-inset-top,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
body{min-height:100dvh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
input,textarea,select{font-size:16px}
a{color:var(--acc)}
code,kbd,pre,.mono{font-family:var(--mono)}
code{background:#0c1219;border:1px solid var(--line);padding:1px 5px;border-radius:5px;font-size:.88em}
h1,h2,h3,h4{line-height:1.2;margin:0 0 .5em}
h1{font-size:1.5rem}h2{font-size:1.25rem}h3{font-size:1.05rem}
p{margin:.4em 0 .8em}
.muted{color:var(--muted)}.dim{color:var(--dim)}.small{font-size:.85rem}.center{text-align:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}
.stack>*+*{margin-top:12px}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}

/* shell */
#top{position:sticky;top:0;z-index:20;background:rgba(10,14,19,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:calc(var(--safeT) + 8px) 14px 8px;display:flex;align-items:center;gap:10px}
#top .brand{font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .brand .dot{width:10px;height:10px;border-radius:3px;background:var(--acc);box-shadow:0 0 10px var(--acc)}
#top .prog{margin-left:auto;font:600 12px var(--mono);color:var(--muted);display:flex;align-items:center;gap:8px}
.bar{height:6px;background:#0c1219;border:1px solid var(--line);border-radius:6px;overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc))}
#main{padding:16px 14px calc(84px + var(--safeB));max-width:1180px;margin:0 auto}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:rgba(15,20,27,.96);border-top:1px solid var(--line);
  padding:6px 4px calc(6px + var(--safeB))}
#nav button{flex:1;background:none;border:0;padding:6px 2px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;cursor:pointer}
#nav button svg{width:22px;height:22px}
#nav button.on{color:var(--acc)}

/* PC layout */
body.pc #nav{top:0;bottom:0;right:auto;width:84px;flex-direction:column;justify-content:flex-start;padding-top:70px;border-top:0;border-right:1px solid var(--line)}
body.pc #nav button{flex:0;padding:12px 4px}
body.pc #top{padding-left:98px}
body.pc #main{padding:24px 28px 40px 112px}

/* cards & panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel.tight{padding:12px}
.grid{display:grid;gap:12px}
body.pc .grid.two{grid-template-columns:1fr 1fr}
body.pc .grid.three{grid-template-columns:repeat(3,1fr)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--panel2);border-radius:10px;padding:10px 14px;cursor:pointer;min-height:42px;font-weight:600;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--acc2)}
.btn.pri{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.btn.warn{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:6px 10px;font-size:.88rem}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:3px 10px;font-size:.78rem;color:var(--muted);background:var(--bg2)}
.chip.ok{color:var(--ok);border-color:rgba(61,220,132,.4)}
.chip.lock{color:var(--lock);border-color:rgba(245,185,66,.4)}
.chip.acc{color:var(--acc);border-color:rgba(45,212,191,.4)}
.tag{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* device picker */
.picker{position:fixed;inset:0;z-index:100;background:radial-gradient(1200px 600px at 50% -10%,rgba(45,212,191,.18),transparent),var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.picker .box{max-width:560px;width:100%;text-align:center}
.picker .opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}
.picker .opt{background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:22px 12px;cursor:pointer;color:var(--text)}
.picker .opt:hover{border-color:var(--acc)}
.picker .opt svg{width:44px;height:44px;color:var(--acc)}
.picker .opt b{display:block;margin-top:8px;font-size:1.05rem}
.picker .opt span{display:block;color:var(--muted);font-size:.82rem;margin-top:4px}

/* path map */
.tier{margin:18px 0 8px;display:flex;align-items:baseline;gap:10px}
.tier h2{margin:0}
.path{position:relative;display:grid;gap:10px}
body.pc .path{grid-template-columns:repeat(2,1fr)}
.node{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left;width:100%;color:var(--text)}
.node .num{flex:0 0 40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font:700 14px var(--mono);background:var(--bg2);border:1px solid var(--line2)}
.node.done .num{background:rgba(61,220,132,.12);border-color:rgba(61,220,132,.5);color:var(--ok)}
.node.cur{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.node.cur .num{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.node.locked{opacity:.55;cursor:not-allowed}
.node.locked .num{color:var(--lock)}
.node .t{font-weight:650}
.node .s{font-size:.82rem;color:var(--muted)}

/* stage */
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:12px -2px;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:1px solid var(--line2);background:var(--bg2);color:var(--muted);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:.9rem}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.req{display:flex;gap:8px;flex-wrap:wrap}
.lesson h3{margin-top:1.2em;color:#fff}
.lesson table{border-collapse:collapse;width:100%;font-size:.88rem;margin:.6em 0;display:block;overflow-x:auto}
.lesson th,.lesson td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.lesson th{background:var(--bg2)}
.lesson pre{background:#070b10;border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-x:auto;font-size:.82rem;line-height:1.45}
.lesson ul,.lesson ol{padding-left:1.2em}
.lesson li{margin:.2em 0}
.callout{border-left:3px solid var(--info);background:rgba(106,169,255,.07);padding:10px 12px;border-radius:0 10px 10px 0;margin:12px 0}
.callout.trap{border-color:var(--bad);background:rgba(242,85,90,.07)}
.callout.pro{border-color:var(--lock);background:rgba(245,185,66,.07)}
.callout b.k{display:block;font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.callout.trap b.k{color:var(--bad)}.callout.pro b.k{color:var(--lock)}.callout b.k{color:var(--info)}

/* flashcards */
.flash{perspective:1200px;height:240px;cursor:pointer;margin:6px 0 12px}
body.pc .flash{height:280px}
.flash .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flash.flip .in{transform:rotateY(180deg)}
.flash .f,.flash .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;border:1px solid var(--line2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center;background:var(--panel);overflow:auto}
.flash .f b{font-size:1.4rem}
.flash .b{transform:rotateY(180deg);background:var(--panel2);font-size:1rem}
body.lite .flash .in{transition:none}
body.lite .flash .f,body.lite .flash .b{backface-visibility:visible;-webkit-backface-visibility:visible}
body.lite .flash .b{transform:none;display:none}
body.lite .flash.flip .in{transform:none}
body.lite .flash.flip .f{display:none}
body.lite .flash.flip .b{display:flex}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* quiz */
.q{font-size:1.05rem;font-weight:600;margin-bottom:12px;white-space:pre-wrap}
.choices{display:grid;gap:8px}
.choice{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:11px 12px;cursor:pointer;color:var(--text)}
.choice .l{font:700 12px var(--mono);color:var(--muted);flex:0 0 18px;padding-top:2px}
.choice.sel{border-color:var(--acc)}
.choice.right{border-color:var(--ok);background:rgba(61,220,132,.09)}
.choice.wrong{border-color:var(--bad);background:rgba(242,85,90,.09)}
.explain{margin-top:12px;padding:12px;border-radius:10px;background:#0c1219;border:1px solid var(--line)}
.explain b.v{display:block;margin-bottom:4px}
.answer-in{width:100%;background:#070b10;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font-family:var(--mono)}
.qmeta{display:flex;justify-content:space-between;color:var(--muted);font:600 12px var(--mono);margin-bottom:8px}
.timer{font:700 14px var(--mono);color:var(--lock)}

/* lab */
.lab{display:grid;gap:12px}
body.pc .lab{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);align-items:start}
body.pc .lab .termwrap{position:sticky;top:70px}
.topo{width:100%;height:auto;background:radial-gradient(circle at 50% 40%,#101823,#0b1017);border:1px solid var(--line);border-radius:var(--r);touch-action:manipulation}
.topo .dev{cursor:pointer}
.topo .dev text{fill:var(--text);font:600 11px var(--sans)}
.topo .dev.sel rect.hit,.topo .dev.sel circle.hit{stroke:var(--acc);stroke-width:2.5}
.topo .lk{stroke-width:2.5}
.topo .lk.up{stroke:var(--ok)}.topo .lk.down{stroke:var(--bad);stroke-dasharray:6 5}
.topo .pl{fill:var(--muted);font:500 9px var(--mono)}
.tasks{list-style:none;padding:0;margin:0}
.tasks li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.tasks li:last-child{border-bottom:0}
.tasks .ck{flex:0 0 20px;height:20px;border-radius:6px;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:13px}
.tasks li.ok .ck{background:var(--ok);border-color:var(--ok);color:#03210f}
.tasks li.ok span{color:var(--muted)}
.term{background:#05080c;border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden}
.term .bar2{display:flex;gap:6px;overflow-x:auto;padding:8px;border-bottom:1px solid var(--line);background:#0a0f15;scrollbar-width:none}
.term .bar2::-webkit-scrollbar{display:none}
.term .bar2 button{flex:0 0 auto;border:1px solid var(--line2);background:transparent;color:var(--muted);border-radius:8px;padding:4px 10px;font:600 12px var(--mono);cursor:pointer}
.term .bar2 button.on{color:var(--acc);border-color:var(--acc)}
.term .out{font:12.5px/1.45 var(--mono);white-space:pre-wrap;word-break:break-word;padding:10px 12px;height:340px;overflow-y:auto;color:#c9d6e3}
body.pc .term .out{height:440px}
.term .out .cmd{color:var(--acc)}
.term .out .hint{color:var(--lock)}
.term .inl{display:flex;align-items:center;border-top:1px solid var(--line);padding:6px 10px;gap:6px;background:#070b10}
.term .inl .pr{font:600 12.5px var(--mono);color:var(--acc);white-space:nowrap}
.term .inl input{flex:1;min-width:0;background:transparent;border:0;outline:0;font-family:var(--mono);color:#fff;padding:6px 0}
.keys{display:flex;gap:6px;overflow-x:auto;padding:6px 8px 8px;background:#070b10;scrollbar-width:none}
.keys::-webkit-scrollbar{display:none}
.keys button{flex:0 0 auto;border:1px solid var(--line2);background:var(--panel);color:var(--text);border-radius:8px;padding:6px 10px;font:600 12px var(--mono);cursor:pointer}
body.pc .keys{display:none}

/* code / checkpoint */
.code{font:700 1.25rem var(--mono);letter-spacing:.06em;color:var(--acc);background:#06100f;border:1px dashed var(--acc2);border-radius:12px;padding:14px;text-align:center;word-break:break-all;user-select:all;-webkit-user-select:all}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safeB));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--acc2);padding:10px 16px;border-radius:12px;z-index:200;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:90vw}
.modal{position:fixed;inset:0;z-index:150;background:rgba(4,7,10,.75);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .panel{max-width:520px;width:100%;max-height:88dvh;overflow:auto}
.big{font-size:2.6rem;font-weight:800;font-family:var(--mono)}
.list{display:grid;gap:8px}
.li{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;color:var(--text);text-align:left;width:100%}
.li .grow .s{font-size:.82rem;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select,.field textarea{background:#070b10;border:1px solid var(--line2);border-radius:10px;padding:10px 12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font:13px var(--mono)}
.kv b{color:var(--muted);font-weight:500}

/* lite (phone) mode: cut the expensive stuff */
body.lite #top,body.lite #nav{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg2)}
body.lite *{transition:none!important;animation:none!important}
body.lite .node.cur,body.lite .toast{box-shadow:none}
body.lite #top .brand .dot{box-shadow:none}
body.lite .picker{background:var(--bg)}
body.lite .topo{background:#0b1017}
@media (max-width:420px){.term .out{height:300px}h1{font-size:1.3rem}}
.lab>*,.stack,.termwrap,.term,#main{min-width:0}
html,body{overflow-x:hidden}
.tabs.trk button{font-size:.95rem;padding:9px 16px}
/* cloud resource map */
.rmap{max-height:none}
.rv{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;background:var(--bg2)}
.rs{border-left:2px solid var(--line2);margin:6px 0 2px 4px;padding-left:10px}
.rh{margin:2px 0;line-height:1.6}
.ri{margin:3px 0;line-height:1.6;word-break:break-word}
.rv code{font-size:.78em}
.rb{display:inline-block;font:600 10.5px var(--mono);padding:1px 7px;border-radius:999px;border:1px solid}
.rb.ok{color:var(--ok);border-color:rgba(61,220,132,.45);background:rgba(61,220,132,.08)}
.rb.no{color:var(--bad);border-color:rgba(242,85,90,.45);background:rgba(242,85,90,.08)}

:root{--acc:#60a5fa;--acc2:#3b82f6;--accInk:#04122b}

</style>
</head>

<script>
/* build a717f1a67f */
/* CloudSim — a small AWS CLI + Azure CLI simulator over a working cloud model.
   AWS: VPC, subnets, IGW, route tables, NAT, EIP, security groups, EC2, S3, IAM, SNS, CloudWatch.
   Azure: resource groups, locks, VNets, subnets, NSGs (priority rules), VMs, public IPs,
          storage accounts, Entra users, RBAC role assignments, action groups, metric alerts.
   Reachability is evaluated from the actual configuration (routes, SG/NSG rules, public IPs). */
(function (root) {
  'use strict';

  // ---------- IP helpers ----------
  function ip2n(s) { var p = String(s).split('.'); if (p.length !== 4) return null; var n = 0; for (var i = 0; i < 4; i++) { if (!/^\d{1,3}$/.test(p[i]) || +p[i] > 255) return null; n = n * 256 + (+p[i]); } return n >>> 0; }
  function n2ip(n) { return [n >>> 24, (n >>> 16) & 255, (n >>> 8) & 255, n & 255].join('.'); }
  function cidr(s) {
    var m = String(s || '').match(/^([\d.]+)\/(\d{1,2})$/); if (!m) return null;
    var ip = ip2n(m[1]), p = +m[2]; if (ip === null || p > 32) return null;
    var mask = p === 0 ? 0 : (0xFFFFFFFF << (32 - p)) >>> 0;
    return { net: (ip & mask) >>> 0, mask: mask, p: p, aligned: ((ip & mask) >>> 0) === ip, str: n2ip((ip & mask) >>> 0) + '/' + p };
  }
  function inCidr(ip, c) { c = typeof c === 'string' ? cidr(c) : c; return !!c && ((ip & c.mask) >>> 0) === c.net; }
  function within(inner, outer) { return inner.p >= outer.p && inCidr(inner.net, outer); }
  function overlap(a, b) { return inCidr(a.net, b) || inCidr(b.net, a); }
  var INTERNET_IP = ip2n('203.0.113.50');

  // ---------- argument parsing ----------
  function tokenize(line) {
    var out = [], cur = '', q = null, had = false;
    for (var i = 0; i < line.length; i++) {
      var ch = line[i];
      if (q) { if (ch === q) q = null; else cur += ch; continue; }
      if (ch === '"' || ch === "'") { q = ch; had = true; continue; }
      if (/\s/.test(ch)) { if (cur || had) { out.push(cur); cur = ''; had = false; } continue; }
      cur += ch;
    }
    if (cur || had) out.push(cur);
    return out;
  }
  var ALIAS = { '-g': '--resource-group', '-n': '--name', '-l': '--location', '-o': '--output', '-h': '--help' };
  function parseArgs(toks) {
    var pos = [], opts = {};
    for (var i = 0; i < toks.length; i++) {
      var t = toks[i];
      if (/^--?[a-zA-Z]/.test(t)) {
        var k = ALIAS[t] || t, eq = k.indexOf('=');
        if (eq > 0) { opts[k.slice(0, eq)] = [k.slice(eq + 1)]; continue; }
        var vals = [];
        while (i + 1 < toks.length && !/^--?[a-zA-Z]/.test(toks[i + 1])) vals.push(toks[++i]);
        opts[k] = vals;
      } else pos.push(t);
    }
    return { pos: pos, opts: opts };
  }
  function J(o) { return JSON.stringify(o, null, 2); }
  function table(rows, cols) {
    if (!rows.length) return '';
    var w = cols.map(function (c) { return Math.max(c.length, Math.max.apply(null, rows.map(function (r) { return String(r[c] == null ? '' : r[c]).length; }))); });
    var line = function (vals) { return vals.map(function (v, i) { v = String(v == null ? '' : v); while (v.length < w[i]) v += ' '; return v; }).join('  '); };
    return [line(cols), w.map(function (n) { return new Array(n + 1).join('-'); }).join('  ')].concat(rows.map(function (r) { return line(cols.map(function (c) { return r[c]; })); })).join('\n');
  }

  // ---------- the world ----------
  function Cloud(opts) {
    opts = opts || {};
    this.account = '123456789012'; this.region = 'us-east-1'; this.sub = '9f2c1e5a-0000-4a6b-9c1d-12ab34cd56ef';
    this.n = 0;
    this.aws = { vpcs: {}, subnets: {}, igws: {}, rts: {}, sgs: {}, nats: {}, eips: {}, instances: {}, buckets: {}, users: {}, groups: {}, topics: {}, alarms: {} };
    this.az = { rgs: {}, vnets: {}, nsgs: {}, vms: {}, pips: {}, storage: {}, users: {}, roles: [], ags: {}, alerts: {} };
    this.history = [];
    this.globalBuckets = { 'my-bucket': 1, 'test': 1, 'backup': 1, 'data': 1, 'logs': 1 };
    this.globalStorage = { 'storage': 1, 'mystorage': 1, 'data': 1, 'test': 1 };
  }

(function () {
  var S = COURSE.stages, Q = window.Q, T = window.TYPE;

  S.push({
    id: 'a01', track: 'aws', tier: 'a-f', title: 'Cloud concepts & AWS global infrastructure', code: 'AWS01-FIRST-REGION',
    goal: 'What the cloud is, why companies use it, service and deployment models, Regions/AZs/edge, and the Well-Architected pillars.',
    lesson: [
      { h: 'What "cloud" actually means', html: '<p>Cloud computing is <b>on-demand delivery of IT resources over the internet with pay-as-you-go pricing</b>. Instead of buying servers and waiting weeks, you rent compute, storage, databases and services in minutes and pay only for what you use.</p><p>NIST\'s five characteristics: <b>on-demand self-service</b>, <b>broad network access</b>, <b>resource pooling</b> (multi-tenancy), <b>rapid elasticity</b>, <b>measured service</b>.</p>' },
      { h: 'The six advantages of cloud (AWS wording — memorize)', html: '<ol><li><b>Trade fixed expense (CapEx) for variable expense (OpEx)</b>.</li><li><b>Benefit from massive economies of scale</b> — AWS buys in bulk; you get lower prices.</li><li><b>Stop guessing capacity</b> — scale up and down with demand.</li><li><b>Increase speed and agility</b> — resources in minutes.</li><li><b>Stop spending money running and maintaining data centers</b>.</li><li><b>Go global in minutes</b>.</li></ol>' },
      { h: 'Service models', html: '<table><tr><th>Model</th><th>You manage</th><th>Provider manages</th><th>AWS example</th></tr><tr><td><b>IaaS</b></td><td>OS, runtime, apps, data</td><td>Hardware, virtualization, facility</td><td>EC2</td></tr><tr><td><b>PaaS</b></td><td>Apps and data</td><td>Everything below the app</td><td>Elastic Beanstalk, RDS</td></tr><tr><td><b>SaaS</b></td><td>Just use it (and your data/users)</td><td>Everything</td><td>Amazon WorkMail, Chime</td></tr></table>' },
      { h: 'Deployment models', html: '<ul><li><b>Cloud (public)</b> — everything in AWS.</li><li><b>On-premises (private cloud)</b> — virtualization in your own data center.</li><li><b>Hybrid</b> — connect on-prem to cloud (Direct Connect, VPN, Outposts, Storage Gateway).</li></ul>' },
      { h: 'Global infrastructure', html: '<ul><li><b>Region</b> — a geographic area (us-east-1 N. Virginia, us-east-2 Ohio, us-west-2 Oregon…). Each region is isolated. Choose by: <b>compliance/data residency</b>, <b>latency to users</b>, <b>service availability</b>, <b>price</b>.</li><li><b>Availability Zone (AZ)</b> — one or more discrete data centers with redundant power and networking, physically separated (miles apart) but connected with low-latency links. Most regions have 3+ AZs. <b>Deploy across multiple AZs for high availability.</b></li><li><b>Edge locations / points of presence</b> — hundreds of sites used by CloudFront (CDN), Route 53 and Global Accelerator to serve users with low latency.</li><li><b>Local Zones</b> — AWS compute close to big metro areas for single-digit ms latency. <b>Wavelength</b> — AWS inside 5G carrier networks. <b>Outposts</b> — AWS racks in your data center.</li></ul>' +
        '<div class="callout trap"><b class="k">Exam trap</b>High availability = multiple <b>AZs</b>. Disaster recovery against a whole-region outage = multiple <b>Regions</b>. Low latency for global users = <b>edge locations</b> (CloudFront).</div>' },
      { h: 'Ways to access AWS', html: '<p><b>AWS Management Console</b> (web), <b>AWS CLI</b> (command line — what the labs use), <b>SDKs</b> (code), and <b>infrastructure as code</b> (CloudFormation, CDK). <b>AWS CloudShell</b> is a browser terminal with the CLI preinstalled.</p>' },
      { h: 'The Well-Architected Framework — six pillars', html: '<table><tr><th>Pillar</th><th>One-line meaning</th></tr><tr><td>Operational Excellence</td><td>Run and monitor systems; automate; small reversible changes; learn from failures</td></tr><tr><td>Security</td><td>Protect data and systems; least privilege; traceability; encrypt</td></tr><tr><td>Reliability</td><td>Recover from failure; scale; test recovery; multi-AZ</td></tr><tr><td>Performance Efficiency</td><td>Use the right resources efficiently; go serverless; experiment</td></tr><tr><td>Cost Optimization</td><td>Avoid unnecessary cost; pay for what you use; measure</td></tr><tr><td>Sustainability</td><td>Minimize environmental impact; maximize utilization</td></tr></table>' },
      { h: 'Cloud design principles', html: '<ul><li><b>Design for failure</b> — everything fails eventually; assume it.</li><li><b>Decouple components</b> (queues, events) so one failure does not cascade.</li><li><b>Elasticity</b>: scale out automatically; <b>scalability</b>: the system can grow.</li><li><b>Think parallel</b>, use <b>managed services</b>, automate.</li><li><b>High availability</b> (stays up) vs <b>fault tolerance</b> (no interruption at all) vs <b>disaster recovery</b> (come back after a disaster).</li></ul>' },
      { h: 'Migration: the 7 Rs and CAF', html: '<p>Migration strategies: <b>Retire, Retain, Rehost</b> (lift and shift), <b>Relocate</b> (e.g., VMware Cloud on AWS), <b>Repurchase</b> (move to SaaS), <b>Replatform</b> (lift, tinker and shift — e.g., to RDS), <b>Refactor/re-architect</b> (cloud-native). The <b>AWS Cloud Adoption Framework (CAF)</b> has six perspectives: <b>Business, People, Governance</b> (business capabilities) and <b>Platform, Security, Operations</b> (technical capabilities).</p>' }
    ],
    cards: [

      ['AWS CAF perspectives', 'Business, People, Governance, Platform, Security, Operations.'], ['Choosing a Region', 'Compliance/data residency, latency to users, service availability, pricing.']
    ],
    qs: [
      Q('A startup wants to avoid buying servers up front and pay only for what it uses. Which cloud advantage is this?', 'Trade fixed expense for variable expense', ['Go global in minutes', 'Benefit from economies of scale', 'Increase speed and agility'], 'Turning CapEx (buying hardware) into OpEx (pay-as-you-go).', 'c1'),

  S.push({
    id: 'a02', track: 'aws', tier: 'a-f', title: 'Core AWS services tour', code: 'AWS02-BUCKETS-AND-BOXES',
    goal: 'Compute, storage, databases, networking and the "which service" questions that make up a third of CLF-C02.',
    lesson: [
      { h: 'Compute', html: '<ul><li><b>EC2</b> — virtual servers. Instance families: <b>General purpose</b> (t, m), <b>Compute optimized</b> (c), <b>Memory optimized</b> (r, x), <b>Storage optimized</b> (i, d), <b>Accelerated</b> (p, g, inf, trn). An <b>AMI</b> is the image you launch from.</li><li><b>Auto Scaling</b> — adds/removes EC2 instances automatically. <b>Elastic Load Balancing</b> — spreads traffic (ALB layer 7, NLB layer 4).</li><li><b>Lambda</b> — run code with no servers; billed per request and ms; max 15 minutes per invocation.</li><li><b>Containers</b>: ECS (AWS orchestrator), EKS (Kubernetes), <b>Fargate</b> (serverless compute for containers), ECR (image registry).</li><li><b>Elastic Beanstalk</b> (PaaS), <b>Lightsail</b> (simple VPS), <b>Batch</b>.</li></ul>' },
      { h: 'Storage', html: '<table><tr><th>Service</th><th>Type</th><th>Key facts</th></tr><tr><td><b>S3</b></td><td>Object</td><td>Buckets + objects (up to 5 TB each). 99.999999999% (11 nines) durability. Unlimited capacity. Storage classes from Standard to Glacier Deep Archive.</td></tr><tr><td><b>EBS</b></td><td>Block</td><td>Disk for ONE EC2 instance, in ONE AZ. Snapshots go to S3.</td></tr><tr><td><b>Instance store</b></td><td>Block</td><td>Physically attached, very fast, <b>ephemeral</b> — lost on stop.</td></tr><tr><td><b>EFS</b></td><td>File (NFS)</td><td>Shared by many Linux instances across AZs, grows automatically.</td></tr><tr><td><b>FSx</b></td><td>File</td><td>Windows File Server (SMB), Lustre (HPC), NetApp ONTAP, OpenZFS.</td></tr><tr><td><b>Storage Gateway</b></td><td>Hybrid</td><td>On-prem apps use cloud storage.</td></tr><tr><td><b>Snow Family</b></td><td>Offline transfer</td><td>Physical devices for TB–PB migrations.</td></tr></table>' },
      { h: 'Databases', html: '<ul><li><b>RDS</b> — managed relational DBs (patching, backups, Multi-AZ failover, read replicas). <b>Aurora</b> — AWS\'s high-performance MySQL/PostgreSQL-compatible engine.</li><li><b>DynamoDB</b> — serverless NoSQL key-value, millisecond latency at any scale.</li><li><b>ElastiCache</b> — in-memory cache. <b>Redshift</b> — data warehouse (analytics, OLAP). <b>Neptune</b> — graph. <b>DocumentDB</b> — MongoDB-compatible.</li><li><b>DMS</b> + Schema Conversion Tool — migrate databases.</li></ul><p>Self-managing a DB on EC2 = you patch, back up and scale it. RDS = AWS does those tasks.</p>' },
      { h: 'Networking & content delivery', html: '<ul><li><b>VPC</b> — your private network: subnets, route tables, internet gateway, NAT gateway, security groups.</li><li><b>Route 53</b> — DNS + health checks + routing policies.</li><li><b>CloudFront</b> — CDN. <b>Global Accelerator</b> — static anycast IPs over the AWS backbone.</li><li><b>Direct Connect</b> — private line to AWS. <b>Site-to-Site VPN</b> — encrypted over the internet.</li><li><b>API Gateway</b> — front door for APIs.</li></ul>' },
      { h: 'Messaging, analytics and AI (know the names)', html: '<p><b>SQS</b> queues, <b>SNS</b> pub/sub, <b>EventBridge</b> events, <b>Step Functions</b> workflows. <b>Athena</b> (SQL on S3), <b>Glue</b> (ETL), <b>Kinesis</b> (streaming), <b>QuickSight</b> (BI), <b>EMR</b> (Spark/Hadoop). AI: <b>SageMaker AI</b>, <b>Bedrock</b> (generative AI), <b>Rekognition</b> (images), <b>Comprehend</b> (text), <b>Polly</b> (text→speech), <b>Transcribe</b> (speech→text), <b>Translate</b>, <b>Lex</b> (chatbots), <b>Textract</b> (documents).</p>' },

  S.push({
    id: 'a03', track: 'aws', tier: 'a-f', title: 'Security, IAM & compliance', code: 'AWS03-SHARED-SHIELD',
    goal: 'Shared responsibility, IAM done right, MFA, encryption, the security services, and compliance — 30% of CLF-C02.',
    lesson: [
      { h: 'Shared Responsibility Model (the #1 exam topic)', html: '<p><b>AWS = security OF the cloud</b>: physical data centers, hardware, network infrastructure, the virtualization layer, and the managed parts of managed services. <b>You = security IN the cloud</b>: your data, IAM users and permissions, OS patching on EC2, security group and network ACL configuration, application code, client-side and server-side encryption choices.</p>' +
        '<table><tr><th>Item</th><th>EC2 (IaaS)</th><th>RDS (managed)</th><th>Lambda / S3</th></tr><tr><td>Guest OS patching</td><td>Customer</td><td>AWS</td><td>AWS</td></tr><tr><td>Database engine patching</td><td>Customer (if self-installed)</td><td>AWS</td><td>—</td></tr><tr><td>Firewall / SG rules</td><td>Customer</td><td>Customer</td><td>—</td></tr><tr><td>Data encryption choice & IAM</td><td>Customer</td><td>Customer</td><td>Customer</td></tr><tr><td>Physical security</td><td>AWS</td><td>AWS</td><td>AWS</td></tr></table>' +
        '<div class="callout trap"><b class="k">Exam trap</b>"Patching the guest OS on EC2" = customer. "Patching the host / hypervisor" = AWS. Shared controls: patch management, configuration management, awareness & training (each side does its own part).</div>' },
      { h: 'IAM fundamentals', html: '<ul><li><b>Root user</b> — the email that created the account. Unrestricted. Enable <b>MFA</b>, delete its access keys, and use it only for the few root-only tasks (change support plan, close account, change account settings).</li><li><b>Users</b> (people or apps with long-term credentials), <b>groups</b> (attach permissions to job functions), <b>roles</b> (temporary credentials assumed by services, other accounts, or federated users), <b>policies</b> (JSON documents: Effect, Action, Resource, Condition).</li><li><b>Least privilege</b>: grant only what is needed. Attach policies to <b>groups</b>, not individual users.</li><li><b>Explicit deny always wins</b>; anything not explicitly allowed is implicitly denied.</li><li>EC2 instances get permissions through an <b>IAM role</b> (instance profile) — never store access keys on a server.</li><li><b>IAM Identity Center</b> (SSO) for workforce access to many accounts.</li></ul><pre>{\n  "Version": "2012-10-17",\n  "Statement": [{\n    "Effect": "Allow",\n    "Action": ["s3:GetObject"],\n    "Resource": "arn:aws:s3:::phil-notes/*"\n  }]\n}</pre>' },
      { h: 'Security services', html: '<ul><li><b>GuardDuty</b> — threat detection (ML on CloudTrail, VPC Flow Logs, DNS logs).</li><li><b>Inspector</b> — vulnerability scanning (EC2, containers, Lambda).</li><li><b>Macie</b> — finds PII in S3. <b>Detective</b> — investigate findings. <b>Security Hub</b> — aggregates findings + posture checks.</li><li><b>Shield</b> — DDoS (Standard free/automatic; Advanced paid with DDoS Response Team and cost protection). <b>WAF</b> — layer-7 rules on CloudFront/ALB/API Gateway. <b>Firewall Manager</b> — central rules across accounts.</li><li><b>KMS</b> (managed keys), <b>CloudHSM</b> (dedicated HSMs), <b>Secrets Manager</b> (rotation), <b>Systems Manager Parameter Store</b>, <b>ACM</b> (free public TLS certificates).</li><li><b>CloudTrail</b> — who did what (API audit). <b>Config</b> — what changed and is it compliant. <b>CloudWatch</b> — metrics/logs/alarms.</li></ul>' },
      { h: 'Compliance', html: '<p><b>AWS Artifact</b> — download AWS compliance reports (SOC 1/2/3, PCI DSS, ISO) and accept agreements (like a HIPAA BAA). AWS is certified for many programs, but <b>your workload\'s compliance is still your responsibility</b>. <b>AWS Audit Manager</b> continuously collects evidence. Security groups are stateful; network ACLs are stateless.</p>' },
      { h: 'Lab: least-privilege IAM', html: '<p>Build a developer group with read-only access, put two users in it, and make sure nobody has policies attached directly.</p>' }
    ],
    cards: window.CLOUD_SVC.aws.filter(function (s) { return s[2] === 'security'; }).map(function (s) { return [s[0], s[1]]; }).concat([
      ['Shared responsibility: AWS', 'Security OF the cloud — facilities, hardware, network, virtualization, managed service internals.'], ['Shared responsibility: customer', 'Security IN the cloud — data, IAM, guest OS patching, SG/NACL config, encryption choices, app code.'],
      ['Root user best practice', 'Enable MFA, no access keys, use only for root-only tasks.'], ['IAM role', 'Identity with temporary credentials assumed by services, users or other accounts.'], ['IAM group', 'Collection of users; attach policies here.'], ['Least privilege', 'Grant only the permissions required.'],
      ['Explicit deny', 'Always overrides any allow.'], ['IAM policy elements', 'Effect, Action, Resource, (Condition, Principal for resource policies).'], ['Instance profile', 'Container that passes an IAM role to an EC2 instance.'], ['Shield Standard vs Advanced', 'Free automatic L3/L4 DDoS protection vs paid with DRT, cost protection, L7 visibility.'], ['Security group vs NACL', 'Stateful instance-level allow-only vs stateless subnet-level allow/deny, numbered rules.']
    ]),

      { h: 'EC2 purchase options', html: '<table><tr><th>Option</th><th>Discount</th><th>Use when</th></tr><tr><td><b>On-Demand</b></td><td>None</td><td>Short-term, unpredictable, can\'t be interrupted</td></tr><tr><td><b>Savings Plans</b> (Compute / EC2 Instance)</td><td>Up to ~72%</td><td>Commit to $/hour for 1 or 3 years; Compute SP is flexible across family, region, Fargate, Lambda</td></tr><tr><td><b>Reserved Instances</b></td><td>Up to ~72%</td><td>Steady-state, 1 or 3 years; Standard vs Convertible</td></tr><tr><td><b>Spot Instances</b></td><td>Up to ~90%</td><td>Fault-tolerant, flexible jobs; AWS can reclaim with 2-minute warning</td></tr><tr><td><b>Dedicated Hosts</b></td><td>—</td><td>Server-bound licenses (BYOL), compliance requiring a physical server</td></tr><tr><td><b>Dedicated Instances</b></td><td>—</td><td>Hardware not shared with other customers</td></tr><tr><td><b>Capacity Reservations</b></td><td>—</td><td>Guarantee capacity in an AZ</td></tr></table>' },

/* AWS track — Solutions Architect Associate (SAA-C03) */
(function () {
  var S = COURSE.stages, Q = window.Q, T = window.TYPE;
  var SAA = { s1: '1. Design Secure Architectures', s2: '2. Design Resilient Architectures', s3: '3. Design High-Performing Architectures', s4: '4. Design Cost-Optimized Architectures' };

  S.push({
    id: 'a06', track: 'aws', tier: 'a-c', title: 'Secure architectures: identity, accounts & encryption', code: 'AWS06-LEAST-PRIVILEGE',
    goal: 'IAM policy evaluation, roles and STS, cross-account access, Organizations/SCPs, KMS and encryption patterns.',
    lesson: [
      { h: 'Policy types and evaluation', html: '<ul><li><b>Identity-based</b> policies (attached to users/groups/roles) and <b>resource-based</b> policies (S3 bucket policy, KMS key policy, SQS queue policy — have a <code>Principal</code>).</li><li><b>Permissions boundaries</b> cap what an identity policy can grant. <b>SCPs</b> cap what an account can do. <b>Session policies</b> cap an assumed-role session.</li><li>Evaluation: explicit Deny anywhere → denied. Otherwise the action must be allowed by every applicable guardrail (SCP, boundary) <b>and</b> by an identity or resource policy.</li><li>Cross-account: the resource policy in account B must trust account A <b>and</b> A\'s identity must be allowed the action — or A assumes a role in B.</li></ul>' },
      { h: 'Roles and STS', html: '<p>Roles provide <b>temporary credentials</b> via AWS STS (<code>AssumeRole</code>). A role has a <b>trust policy</b> (who may assume it) and <b>permission policies</b> (what it can do). Use roles for EC2/Lambda/ECS tasks, cross-account access, and federation (SAML/OIDC, IAM Identity Center). <b>Web identity / Cognito</b> for mobile apps.</p>' },
      { h: 'Multi-account strategy', html: '<p><b>AWS Organizations</b> + <b>Control Tower</b>: separate accounts for prod/dev/security/logging; SCPs like "deny leaving the org", "deny regions outside us-east-1/us-west-2", "deny disabling CloudTrail". Centralize logs in a log-archive account. <b>AWS RAM</b> shares resources (subnets, Transit Gateways) across accounts.</p>' },
      { h: 'Encryption', html: '<ul><li><b>At rest</b>: KMS keys — <b>AWS owned</b>, <b>AWS managed</b> (aws/s3, aws/ebs), <b>customer managed</b> (you control key policy, rotation, can disable). <b>CloudHSM</b> for FIPS 140-3 Level 3 single-tenant control.</li><li><b>Envelope encryption</b>: KMS encrypts a data key; the data key encrypts the data.</li><li>S3: SSE-S3 (default since 2023), SSE-KMS (audit trail in CloudTrail, key policy control), DSSE-KMS, SSE-C (customer-provided key), client-side.</li><li><b>In transit</b>: TLS via ACM certificates on ALB/CloudFront; enforce with bucket policy condition <code>aws:SecureTransport</code>.</li><li>EBS encryption by default per region; snapshots of encrypted volumes are encrypted; to encrypt an unencrypted volume, copy a snapshot with encryption.</li></ul>' },
      { h: 'Protecting the edge', html: '<p>WAF on CloudFront/ALB/API Gateway, Shield Advanced for DDoS, CloudFront with <b>Origin Access Control</b> so the S3 bucket is private and only CloudFront can read it. Secrets in <b>Secrets Manager</b> (rotation) or Parameter Store. <b>Cognito</b> user pools for app sign-in.</p>' }
    ],
    cards: [
      ['Identity-based vs resource-based policy', 'Attached to a principal vs attached to a resource (has a Principal element).'], ['Permissions boundary', 'Maximum permissions an identity-based policy can grant to a user/role.'], ['SCP', 'Organization guardrail limiting what accounts can do; grants nothing.'], ['Trust policy', 'Role policy stating who can assume the role.'], ['STS AssumeRole', 'Returns temporary credentials for a role.'],
      ['Cross-account access', 'Assume a role in the other account, or use a resource policy trusting the other account.'], ['AWS RAM', 'Resource Access Manager — share resources like subnets across accounts.'], ['Customer managed KMS key', 'You control key policy, rotation, enable/disable, deletion schedule.'], ['Envelope encryption', 'Data encrypted with a data key, data key encrypted with a KMS key.'],
      ['SSE-S3 / SSE-KMS / SSE-C', 'S3-managed keys / KMS keys with audit & control / customer-supplied keys.'], ['aws:SecureTransport', 'Policy condition to require HTTPS.'], ['Origin Access Control', 'Lets only CloudFront read a private S3 origin.'], ['CloudHSM', 'Dedicated single-tenant HSM; you manage keys entirely.'], ['Cognito user pool', 'User directory and sign-in for apps; identity pool gives AWS credentials.']
    ],
    qs: [
      Q('An S3 bucket policy allows account B, but account B\'s IAM user has no S3 permissions. Can the user read objects?', 'No — cross-account access needs both the resource policy and the user\'s identity policy', ['Yes — the bucket policy is enough', 'Only if MFA is used', 'Only through CloudFront'], 'Both sides must allow for cross-account.', 's1'),
      Q('Developers can create IAM roles, but you must ensure those roles never exceed a defined set of permissions. Use:', 'Permissions boundaries', ['SCPs on the developers only', 'Security groups', 'Trust policies'], 'Boundaries cap delegated role creation.', 's1'),
      Q('Prevent every account in the organization from launching resources outside two approved Regions.', 'An SCP denying actions when aws:RequestedRegion is not in the approved list', ['An IAM policy in each account', 'AWS Config only', 'A security group'], 'SCP guardrail.', 's1'),
      Q('A Lambda function needs to write to DynamoDB. Most secure approach?', 'Execution role with least-privilege DynamoDB permissions', ['Access keys in environment variables', 'Make the table public', 'Use the root account'], 'Roles everywhere.', 's1'),
      Q('Auditors require that every use of the encryption key on S3 objects is logged and that the company controls the key policy. Which encryption?', 'SSE-KMS with a customer managed key', ['SSE-S3', 'SSE-C', 'No encryption, just bucket policies'], 'KMS usage appears in CloudTrail; customer managed = your policy.', 's1'),
      Q('How do you encrypt an existing unencrypted EBS volume?', 'Snapshot it, copy the snapshot with encryption enabled, create a volume from it', ['Toggle encryption on the live volume', 'Enable S3 default encryption', 'Attach it to a new instance'], 'Copy-with-encryption.', 's1'),
      Q('Force all access to a bucket to use HTTPS. What do you add?', 'A bucket policy denying requests where aws:SecureTransport is false', ['A security group', 'S3 versioning', 'An SCP denying S3'], 'SecureTransport condition.', 's1'),
      Q('A private S3 bucket should only be readable through CloudFront. Configure:', 'Origin Access Control and a bucket policy allowing only the CloudFront distribution', ['Make the bucket public', 'S3 Transfer Acceleration', 'A NAT gateway'], 'OAC (successor to OAI).', 's1'),
      Q('A mobile app needs users to sign up/sign in and then upload to S3 with temporary credentials. Use:', 'Amazon Cognito (user pool + identity pool)', ['IAM users for each customer', 'AWS IAM Identity Center', 'Root credentials in the app'], 'Cognito.', 's1'),
      Q('Which service shares a VPC subnet from a networking account to application accounts?', 'AWS Resource Access Manager', ['AWS Organizations SCP', 'VPC peering', 'AWS Control Tower'], 'RAM.', 's1'),
      Q('Database credentials must rotate every 30 days automatically. Use:', 'AWS Secrets Manager with rotation', ['Parameter Store standard tier', 'An encrypted S3 object', 'KMS key rotation'], 'Secrets Manager rotates via Lambda.', 's1'),
      Q('Which statement about SCPs is correct?', 'They never grant permissions; they only limit what IAM policies can allow', ['They grant admin rights to accounts', 'They apply to the management account the same way', 'They replace IAM policies'], 'Guardrails only.', 's1'),
      Q('A company requires single-tenant hardware key storage under its exclusive control. Use:', 'AWS CloudHSM', ['AWS KMS AWS-managed keys', 'SSE-S3', 'ACM'], 'CloudHSM.', 's1'),
      Q('Protect an ALB-backed site from SQL injection and set a rate limit per IP. Use:', 'AWS WAF with managed rules and a rate-based rule', ['Shield Standard', 'Security groups', 'Network ACL'], 'WAF.', 's1'),
      T('Type the STS API action used to obtain temporary credentials for a role.', ['AssumeRole', 'sts:AssumeRole'], 'sts:AssumeRole', 's1')
    ],
    labs: []
  });

  S.push({
    id: 'a07', track: 'aws', tier: 'a-c', title: 'VPC networking in depth', code: 'AWS07-PUBLIC-PRIVATE',
    goal: 'Subnets, route tables, IGW, NAT, SGs vs NACLs, endpoints, peering, Transit Gateway, Route 53 and CloudFront — and build them from the CLI.',
    lesson: [
      { h: 'What makes a subnet public', html: '<p>A subnet is <b>public</b> only because its route table has <code>0.0.0.0/0 → igw-xxxx</code> (an internet gateway attached to the VPC). Instances also need a <b>public IPv4</b> (auto-assign or Elastic IP). A <b>private</b> subnet has no IGW route; it reaches the internet outbound through a <b>NAT gateway</b> that lives in a public subnet.</p><pre>Public RT : 10.0.0.0/16 → local, 0.0.0.0/0 → igw-…\nPrivate RT: 10.0.0.0/16 → local, 0.0.0.0/0 → nat-…   (NAT GW sits in the public subnet)</pre><p>AWS reserves <b>5 IPs</b> in every subnet (network, VPC router, DNS, future, broadcast). A subnet lives in exactly <b>one AZ</b>. VPC CIDR: /16 to /28.</p>' },
      { h: 'Security groups vs network ACLs', html: '<table><tr><th></th><th>Security group</th><th>Network ACL</th></tr><tr><td>Level</td><td>ENI / instance</td><td>Subnet</td></tr><tr><td>State</td><td><b>Stateful</b> — return traffic allowed automatically</td><td><b>Stateless</b> — must allow return (ephemeral ports 1024–65535)</td></tr><tr><td>Rules</td><td>Allow only</td><td>Allow and deny, numbered, lowest first</td></tr><tr><td>Sources</td><td>CIDR or <b>another security group</b></td><td>CIDR only</td></tr></table><p>Referencing a security group as the source ("allow 3306 from sg-app") is the clean way to build tiers.</p>' },
      { h: 'Connectivity options', html: '<ul><li><b>VPC endpoints</b>: <b>Gateway endpoints</b> (S3, DynamoDB — free, a route table entry) and <b>interface endpoints</b> (PrivateLink ENIs, hourly cost) keep traffic off the internet and avoid NAT charges.</li><li><b>VPC peering</b>: 1:1, non-transitive, no overlapping CIDRs.</li><li><b>Transit Gateway</b>: hub-and-spoke for many VPCs + VPN + Direct Connect; transitive routing.</li><li><b>Site-to-Site VPN</b> (virtual private gateway or TGW + customer gateway) and <b>Direct Connect</b> (dedicated, not encrypted by default — add MACsec or VPN over DX).</li><li><b>NAT gateway</b> is AZ-scoped: one per AZ for resilience.</li><li><b>VPC Flow Logs</b> capture accepted/rejected traffic metadata.</li></ul>' },
      { h: 'DNS, load balancing and edge', html: '<ul><li><b>Route 53</b> routing policies: simple, weighted (canary), latency, failover (health checks), geolocation, geoproximity, multivalue, IP-based. <b>Alias</b> records point to AWS resources at the zone apex.</li><li><b>ALB</b> (layer 7: path/host routing, HTTPS, WebSockets), <b>NLB</b> (layer 4, static IP per AZ, extreme performance), <b>GWLB</b> (inline appliances).</li><li><b>CloudFront</b> caches at the edge; <b>Global Accelerator</b> gives static anycast IPs and fast failover for TCP/UDP.</li></ul>' },
      { h: 'Labs', html: '<p>Lab 1: build a public web tier from an empty account with the AWS CLI. Lab 2: add private app and database tiers with a NAT gateway and SG-to-SG rules. The live map shows public/private subnets and whether each instance is reachable.</p>' }
    ],
    cards: [
      ['Public subnet', 'Route table has 0.0.0.0/0 → internet gateway.'], ['Private subnet', 'No IGW route; uses a NAT gateway for outbound.'], ['Internet gateway', 'Horizontally scaled VPC component for internet access; one per VPC.'], ['NAT gateway', 'Managed outbound-only internet for private subnets; lives in a public subnet; AZ-scoped.'],
      ['Elastic IP', 'Static public IPv4 you allocate and associate.'], ['Reserved IPs per AWS subnet', '5 (network, router, DNS, future use, broadcast).'], ['VPC CIDR size', '/16 (65,536) to /28 (16).'], ['Security group', 'Stateful, allow-only, instance-level; can reference other SGs.'], ['Network ACL', 'Stateless, numbered allow/deny rules at the subnet.'],
      ['Gateway endpoint', 'Free route-table target for S3 and DynamoDB.'], ['Interface endpoint', 'PrivateLink ENI with private IP for many services.'], ['VPC peering', 'Private 1:1 link between VPCs; not transitive; no overlapping CIDRs.'], ['Transit Gateway', 'Regional hub routing between many VPCs and on-prem; transitive.'],
      ['Route 53 failover routing', 'Active-passive using health checks.'], ['Route 53 weighted routing', 'Split traffic by percentage (canary).'], ['Route 53 latency routing', 'Send users to the Region with lowest latency.'], ['Alias record', 'Route 53 record pointing to AWS resources, works at the zone apex, free queries.'],
      ['ALB', 'Layer 7 load balancer: host/path routing, HTTP/HTTPS.'], ['NLB', 'Layer 4 TCP/UDP, static IPs, ultra-low latency.'], ['VPC Flow Logs', 'Metadata records of IP traffic for ENIs/subnets/VPCs.']
    ],
    qs: [
      { gen: 'cloudSubnet', d: 's3' }, { gen: 'sizing', d: 's3' },
      Q('What makes a subnet "public" in AWS?', 'Its route table has a 0.0.0.0/0 route to an internet gateway', ['It has a public CIDR block', 'Its instances have security groups', 'It has a NAT gateway inside it'], 'The route is what matters.', 's1'),
      Q('Instances in private subnets need to download patches from the internet but must not be reachable from it. Solution?', 'NAT gateway in a public subnet and a 0.0.0.0/0 route to it from the private route table', ['Internet gateway route in the private route table', 'Elastic IPs on each instance', 'VPC peering'], 'NAT = outbound only.', 's1'),
      Q('For resilience, how should NAT gateways be deployed in a 3-AZ VPC?', 'One NAT gateway per AZ, with each AZ\'s private route table pointing to its local NAT', ['One NAT gateway for the whole VPC', 'NAT gateways in private subnets', 'No NAT, use IGW'], 'NAT GWs are AZ-scoped.', 's2'),
      Q('The database tier must accept MySQL only from the application servers, whose IPs change with Auto Scaling. Best rule?', 'Inbound 3306 with the app tier security group as the source', ['Inbound 3306 from 0.0.0.0/0', 'A NACL allowing the app subnet', 'Inbound 3306 from each instance IP'], 'SG references follow the instances.', 's1'),
      Q('A NACL allows inbound 443 but clients never receive responses. Why?', 'NACLs are stateless — outbound ephemeral ports (1024–65535) must also be allowed', ['Security groups block it', 'NACLs cannot allow 443', 'The IGW is missing'], 'Stateless needs both directions.', 's1'),
      Q('EC2 instances in a private subnet upload large volumes to S3 and the NAT bill is high. Cheapest fix?', 'Add an S3 gateway VPC endpoint', ['Add a second NAT gateway', 'Use Direct Connect', 'Move the bucket to another Region'], 'Gateway endpoints are free.', 's4'),
      Q('Ten VPCs and two on-prem sites must all route to each other. Which service simplifies this?', 'AWS Transit Gateway', ['VPC peering mesh', 'Internet gateway', 'NAT gateway'], 'Transitive hub.', 's3'),
      Q('VPC A peers with B, and B peers with C. Can A reach C through B?', 'No — peering is not transitive', ['Yes, automatically', 'Only with NAT', 'Only for IPv6'], 'Non-transitive.', 's3'),
      Q('Route 10% of traffic to a new version of the app for testing. Which Route 53 policy?', 'Weighted', ['Failover', 'Latency', 'Geolocation'], 'Weighted canary.', 's2'),
      Q('Serve users from whichever Region gives them the lowest latency. Which Route 53 policy?', 'Latency-based', ['Simple', 'Geolocation', 'Multivalue'], 'Latency routing.', 's3'),
      Q('An app needs path-based routing (/api to one target group, /images to another). Which load balancer?', 'Application Load Balancer', ['Network Load Balancer', 'Gateway Load Balancer', 'Classic Load Balancer'], 'ALB is layer 7.', 's3'),
      Q('A gaming app needs static IP addresses per AZ and millions of TCP/UDP connections per second. Which load balancer?', 'Network Load Balancer', ['Application Load Balancer', 'Gateway Load Balancer', 'CloudFront'], 'NLB.', 's3'),
      Q('Which component do you need so instances in a VPC can be reached from the internet?', 'Internet gateway attached to the VPC + route + public IP + SG rule', ['NAT gateway only', 'VPC endpoint', 'Transit Gateway'], 'All four must line up.', 's1'),
      Q('Which tool would show that traffic from a specific IP was REJECTED at an ENI?', 'VPC Flow Logs', ['CloudTrail', 'AWS Config', 'Trusted Advisor'], 'Flow Logs record ACCEPT/REJECT.', 's1'),
      Q('Point the apex domain example.com at an ALB. Which Route 53 record?', 'Alias A record', ['CNAME at the apex', 'MX record', 'PTR record'], 'CNAME is not allowed at the apex; alias is.', 's3'),
      T('Type the AWS CLI command (with options) that attaches internet gateway igw-1 to vpc-1.', ['aws ec2 attach-internet-gateway --internet-gateway-id igw-1 --vpc-id vpc-1', 'aws ec2 attach-internet-gateway --vpc-id vpc-1 --internet-gateway-id igw-1'], 'aws ec2 attach-internet-gateway --internet-gateway-id igw-1 --vpc-id vpc-1', 's1', 'aws ec2 ...')
    ],
    labs: ['c-aws-vpc', 'c-aws-3tier']
  });

  S.push({
    id: 'a08', track: 'aws', tier: 'a-c', title: 'Compute, scaling & serverless', code: 'AWS08-SCALE-OUT',
    goal: 'EC2 at scale, Auto Scaling policies, load balancing, containers, Lambda and API patterns.',
    lesson: [
      { h: 'EC2 Auto Scaling', html: '<ul><li><b>Launch template</b> (AMI, type, SG, user data) + <b>Auto Scaling group</b> (min/desired/max, subnets across AZs).</li><li>Scaling policies: <b>target tracking</b> (keep CPU at 50%), <b>step/simple</b> (react to alarms), <b>scheduled</b> (known patterns), <b>predictive</b> (ML forecasts).</li><li>Health checks: EC2 status or <b>ELB health checks</b>; unhealthy instances are replaced automatically.</li><li>Warm pools and lifecycle hooks for slow-booting apps.</li></ul>' },
      { h: 'Placement & instance choices', html: '<p>Placement groups: <b>cluster</b> (low latency, one AZ — HPC), <b>spread</b> (max 7 per AZ, different hardware — critical small sets), <b>partition</b> (Hadoop/Kafka racks). <b>Graviton</b> (ARM) instances often give better price-performance. Hibernation keeps RAM to disk for fast resume.</p>' },
      { h: 'Containers', html: '<p><b>ECS</b> (AWS-native) or <b>EKS</b> (Kubernetes) as orchestrator; <b>EC2 launch type</b> (you manage instances) or <b>Fargate</b> (serverless). Images in <b>ECR</b>. Task roles give containers IAM permissions. <b>App Runner</b> runs a web container from source/image with minimal config.</p>' },
      { h: 'Serverless', html: '<ul><li><b>Lambda</b>: event-driven, up to 15 min, memory 128 MB–10 GB (CPU scales with memory), concurrency limits, provisioned concurrency to avoid cold starts, can run in a VPC.</li><li><b>API Gateway</b> (REST/HTTP/WebSocket) + Lambda = serverless API; throttling, caching, usage plans.</li><li><b>Step Functions</b> orchestrate multi-step workflows with retries.</li><li>Long-running or very heavy jobs → ECS/Fargate or Batch instead of Lambda.</li></ul>' },
      { h: 'Picking compute (exam heuristics)', html: '<table><tr><th>Need</th><th>Pick</th></tr><tr><td>Unpredictable spiky events, short tasks</td><td>Lambda</td></tr><tr><td>Containers without servers</td><td>Fargate</td></tr><tr><td>Lift-and-shift legacy app</td><td>EC2 + ASG</td></tr><tr><td>Batch jobs, can be interrupted</td><td>Spot (Batch or ASG with mixed instances)</td></tr><tr><td>Least operational overhead</td><td>Managed/serverless option</td></tr></table>' }
    ],
    cards: [
      ['Launch template', 'Versioned EC2 launch configuration used by Auto Scaling groups.'], ['Target tracking policy', 'Keeps a metric (e.g., CPU 50%) at a target value.'], ['Scheduled scaling', 'Scales at known times.'], ['Predictive scaling', 'ML forecast-based scaling ahead of demand.'], ['ELB health check in ASG', 'Replaces instances the load balancer marks unhealthy.'],
      ['Cluster placement group', 'Instances packed close in one AZ for low latency HPC.'], ['Spread placement group', 'Instances on distinct hardware; max 7 per AZ.'], ['Partition placement group', 'Groups of instances on separate racks for distributed systems.'], ['Graviton', 'AWS ARM-based processors with strong price-performance.'],
      ['ECS task role', 'IAM role for a container task.'], ['Fargate', 'Serverless compute for ECS/EKS.'], ['Lambda limits', '15 min timeout, up to 10 GB memory, concurrency quotas.'], ['Provisioned concurrency', 'Pre-initialized Lambda environments to remove cold starts.'], ['API Gateway', 'Managed API front door with throttling, auth, caching.'], ['Step Functions', 'Serverless workflow orchestration with retries and state.']
    ],
    qs: [
      Q('An ASG should keep average CPU near 50% automatically. Which policy?', 'Target tracking scaling', ['Scheduled scaling', 'Simple scaling with manual alarms only', 'Predictive scaling only'], 'Target tracking is the simplest correct answer.', 's3'),
      Q('Traffic spikes every weekday at 8:00 AM. Instances take 5 minutes to boot. Best approach?', 'Scheduled (or predictive) scaling before 8:00 AM', ['Target tracking only', 'Larger instance type', 'Manual scaling'], 'Scale ahead of known demand.', 's3'),
      Q('The ASG keeps healthy-looking instances whose web app has crashed. What should you enable?', 'ELB health checks on the Auto Scaling group', ['Detailed monitoring', 'A larger instance', 'Spread placement group'], 'EC2 status checks don\'t see app failures.', 's2'),
      Q('An application must survive the loss of an AZ with no capacity drop. Design?', 'ASG across 3 AZs sized so 2 AZs can carry full load, behind an ALB', ['One large instance', 'ASG in one AZ', 'Spot only in one AZ'], 'N+1 across AZs.', 's2'),
      Q('HPC nodes need the lowest possible network latency between them. Placement?', 'Cluster placement group', ['Spread placement group', 'Partition placement group', 'Different Regions'], 'Cluster.', 's3'),
      Q('A small set of critical instances must never share underlying hardware. Placement?', 'Spread placement group', ['Cluster placement group', 'Partition placement group', 'Dedicated Host'], 'Spread.', 's2'),
      Q('Run containers with the least operational overhead (no instances to patch). Use:', 'ECS or EKS with Fargate', ['ECS on EC2', 'Self-managed Kubernetes on EC2', 'Lightsail'], 'Fargate.', 's3'),
      Q('A job runs for 40 minutes per invocation. Can it run on Lambda?', 'No — Lambda max is 15 minutes; use Fargate, Batch or Step Functions to split it', ['Yes, by raising memory', 'Yes, with provisioned concurrency', 'Only in a VPC'], '15-minute limit.', 's3'),
      Q('Lambda functions behind an API show slow first requests after idle periods. Fix?', 'Provisioned concurrency', ['Increase timeout', 'Move to a larger Region', 'Use SQS'], 'Cold starts.', 's3'),
      Q('Build a serverless REST API with throttling and request validation. Use:', 'Amazon API Gateway + AWS Lambda', ['ALB + EC2', 'CloudFront + S3 only', 'Route 53 + EC2'], 'Serverless API.', 's3'),
      Q('Orchestrate order processing: validate → charge → ship, with retries and error branches. Use:', 'AWS Step Functions', ['Amazon SQS only', 'Amazon SNS', 'CloudWatch Events alone'], 'Workflow orchestration.', 's2'),
      Q('Cut compute cost for a stateless web tier with variable load while keeping baseline capacity reliable.', 'ASG with a mix of On-Demand (baseline, Savings Plan) and Spot instances', ['All Spot', 'All On-Demand', 'Dedicated Hosts'], 'Mixed instances policy.', 's4'),
      Q('Which EC2 processor family often gives the best price-performance for Linux workloads?', 'AWS Graviton (ARM)', ['x86 older generation', 'Mac instances', 'GPU instances'], 'Graviton.', 's4'),
      Q('Containers in ECS need to read from S3. Where do you grant permissions?', 'An ECS task role', ['The EC2 instance root user', 'Access keys baked into the image', 'An S3 public policy'], 'Task roles.', 's1')
    ],
    labs: []
  });

  S.push({
    id: 'a09', track: 'aws', tier: 'a-c', title: 'Storage design', code: 'AWS09-ELEVEN-NINES',
    goal: 'S3 classes, lifecycle, replication, performance and security; EBS volume types; EFS/FSx; hybrid and transfer services.',
    lesson: [
      { h: 'S3 storage classes', html: '<table><tr><th>Class</th><th>Use</th></tr><tr><td>Standard</td><td>Hot data</td></tr><tr><td>Intelligent-Tiering</td><td>Unknown/changing access; auto-moves objects; small monitoring fee</td></tr><tr><td>Standard-IA</td><td>Infrequent, ms retrieval, min 30 days, retrieval fee</td></tr><tr><td>One Zone-IA</td><td>Infrequent, re-creatable, single AZ</td></tr><tr><td>Glacier Instant Retrieval</td><td>Quarterly access, ms retrieval</td></tr><tr><td>Glacier Flexible Retrieval</td><td>Minutes–hours retrieval</td></tr><tr><td>Glacier Deep Archive</td><td>Cheapest; 12–48 h retrieval; compliance archives</td></tr></table><p><b>Lifecycle rules</b> transition objects between classes and expire them. <b>Versioning</b> protects against overwrites/deletes; <b>MFA Delete</b> and <b>Object Lock</b> (WORM; governance/compliance modes) protect against tampering. <b>Replication</b>: CRR (cross-region) / SRR (same-region), requires versioning.</p>' },
      { h: 'S3 performance & access', html: '<ul><li>Multipart upload (recommended &gt;100 MB, required &gt;5 GB). <b>Transfer Acceleration</b> uses edge locations for long-distance uploads. Byte-range fetches for parallel downloads.</li><li><b>Block Public Access</b> on by default; bucket policies; presigned URLs for temporary access; access points for large shared buckets.</li><li>Event notifications to Lambda/SQS/SNS/EventBridge.</li><li>Static website hosting (usually fronted by CloudFront).</li></ul>' },
      { h: 'Block storage — EBS', html: '<table><tr><th>Type</th><th>Use</th></tr><tr><td>gp3</td><td>General SSD; baseline 3,000 IOPS, IOPS/throughput set independently of size</td></tr><tr><td>io2 Block Express</td><td>Mission-critical DBs; up to 256,000 IOPS; Multi-Attach</td></tr><tr><td>st1</td><td>Throughput-optimized HDD (big sequential: logs, data warehouse)</td></tr><tr><td>sc1</td><td>Cold HDD, cheapest</td></tr></table><p>Snapshots are incremental and stored in S3; copy across Regions for DR; <b>Data Lifecycle Manager</b> automates them; Fast Snapshot Restore removes warm-up.</p>' },
      { h: 'File & hybrid', html: '<ul><li><b>EFS</b> — Linux NFS, multi-AZ, auto-grows; storage classes Standard/IA/Archive with lifecycle.</li><li><b>FSx for Windows</b> (SMB + AD), <b>FSx for Lustre</b> (HPC, links to S3), <b>FSx for NetApp ONTAP</b>, <b>FSx for OpenZFS</b>.</li><li><b>Storage Gateway</b>: S3 File Gateway, FSx File Gateway, Volume Gateway, Tape Gateway (replace tape backups).</li><li><b>DataSync</b> (online transfer/sync), <b>Transfer Family</b> (SFTP/FTPS into S3), <b>Snow Family</b> (offline).</li></ul>' }
    ],
    cards: [
      ['S3 Lifecycle rule', 'Automatically transitions objects between storage classes or expires them.'], ['S3 Versioning', 'Keeps every version; protects against accidental delete/overwrite.'], ['S3 Object Lock', 'WORM protection — governance or compliance mode.'], ['MFA Delete', 'Requires MFA to permanently delete versions or change versioning.'], ['S3 CRR', 'Cross-Region Replication; requires versioning on both buckets.'],
      ['Presigned URL', 'Time-limited URL granting temporary access to an object.'], ['S3 Transfer Acceleration', 'Speeds long-distance uploads via edge locations.'], ['Multipart upload', 'Upload large objects in parallel parts; required above 5 GB.'], ['gp3', 'General-purpose SSD EBS; 3,000 IOPS baseline, configurable.'], ['io2 Block Express', 'Highest-performance EBS SSD; supports Multi-Attach.'], ['st1 / sc1', 'Throughput HDD / cold HDD EBS volumes.'],
      ['EBS snapshot', 'Incremental point-in-time backup stored in S3.'], ['Data Lifecycle Manager', 'Automates EBS snapshot creation/retention.'], ['FSx for Lustre', 'High-performance parallel file system for HPC/ML, integrates with S3.'], ['Tape Gateway', 'Virtual tape library backed by S3/Glacier.'], ['AWS DataSync', 'Online data transfer service between on-prem and AWS storage.'], ['AWS Transfer Family', 'Managed SFTP/FTPS/FTP into S3 or EFS.']
    ],
    qs: [
      { gen: 's3class', d: 's4' }, { gen: 's3class', d: 's4' },
      Q('Logs are read often for 30 days, rarely for a year, then must be kept 7 years for compliance at the lowest cost. Design?', 'Lifecycle: Standard → Standard-IA at 30 days → Glacier Deep Archive at 365 days, expire at 7 years', ['Keep everything in Standard', 'Use One Zone-IA forever', 'Delete after 30 days'], 'Lifecycle transitions.', 's4'),
      Q('Prevent anyone, including root, from deleting audit objects for 5 years.', 'S3 Object Lock in compliance mode', ['Versioning only', 'Governance mode', 'Bucket policy denying delete'], 'Compliance mode cannot be overridden.', 's1'),
      Q('A user accidentally overwrote an important S3 object. What would have allowed recovery?', 'S3 Versioning', ['Transfer Acceleration', 'Intelligent-Tiering', 'Static website hosting'], 'Versioning keeps prior versions.', 's2'),
      Q('Give a partner 15-minute download access to one private object without creating IAM users.', 'Presigned URL', ['Make the bucket public', 'Bucket ACL to Everyone', 'Cross-account role'], 'Presigned URLs.', 's1'),
      Q('Users worldwide upload large files to a bucket in us-east-1 slowly. Improve upload speed.', 'S3 Transfer Acceleration (plus multipart upload)', ['Glacier', 'Smaller objects', 'NAT gateway'], 'Edge-accelerated uploads.', 's3'),
      Q('A database needs 80,000 IOPS on EBS. Which volume type?', 'io2 Block Express', ['gp3 at default settings', 'st1', 'sc1'], 'Provisioned IOPS SSD.', 's3'),
      Q('A general workload needs 6,000 IOPS on a 200 GB volume at low cost. Best choice?', 'gp3 with provisioned IOPS set to 6,000', ['io2', 'st1', 'Instance store'], 'gp3 decouples IOPS from size.', 's4'),
      Q('Windows servers need a shared SMB file system integrated with Active Directory. Use:', 'Amazon FSx for Windows File Server', ['Amazon EFS', 'Amazon S3', 'FSx for Lustre'], 'FSx for Windows.', 's3'),
      Q('An ML training cluster needs a high-throughput file system that loads data from S3. Use:', 'Amazon FSx for Lustre', ['Amazon EFS One Zone', 'EBS gp3', 'S3 Glacier'], 'Lustre + S3 integration.', 's3'),
      Q('Replace physical tape backups with cloud storage without changing backup software.', 'Storage Gateway Tape Gateway', ['S3 File Gateway', 'DataSync', 'Snowcone'], 'Virtual tape library.', 's4'),
      Q('Data must automatically be copied to a second Region for DR. Configure:', 'S3 Cross-Region Replication (with versioning enabled)', ['Lifecycle rule', 'Transfer Acceleration', 'Same-Region Replication'], 'CRR.', 's2'),
      Q('Copy 50 TB from an on-prem NAS to S3 over the network on a schedule, with integrity checks. Use:', 'AWS DataSync', ['AWS Snowmobile', 'Manual aws s3 cp', 'Storage Gateway Tape'], 'DataSync.', 's3'),
      Q('Unknown and changing access patterns, want to save money without operational effort.', 'S3 Intelligent-Tiering', ['S3 Standard', 'Glacier Deep Archive', 'One Zone-IA'], 'Automatic tiering.', 's4'),
      T('Type the S3 versioning configuration value that turns versioning on (Status=...).', ['Status=Enabled', 'Enabled'], 'Status=Enabled', 's2')
    ],
    labs: []
  });

  S.push({
    id: 'a10', track: 'aws', tier: 'a-c', title: 'Databases & caching', code: 'AWS10-READ-REPLICA',
    goal: 'RDS Multi-AZ vs read replicas, Aurora, DynamoDB design, caching, and choosing the right database.',
    lesson: [
      { h: 'RDS high availability vs scaling', html: '<table><tr><th></th><th>Multi-AZ</th><th>Read replica</th></tr><tr><td>Purpose</td><td><b>High availability</b> / failover</td><td><b>Read scaling</b> (and cross-region DR)</td></tr><tr><td>Replication</td><td>Synchronous</td><td>Asynchronous</td></tr><tr><td>Readable?</td><td>Standby not readable (classic); Multi-AZ DB cluster has 2 readable standbys</td><td>Yes</td></tr><tr><td>Failover</td><td>Automatic, same endpoint</td><td>Manual promotion</td></tr></table><p>Automated backups (point-in-time restore up to 35 days) + manual snapshots. <b>RDS Proxy</b> pools connections (great for Lambda). Encryption must be chosen at creation (or snapshot-copy-encrypt-restore).</p>' },
      { h: 'Aurora', html: '<p>MySQL/PostgreSQL compatible, storage auto-grows to 128 TB, <b>6 copies across 3 AZs</b>, up to 15 low-lag replicas, fast failover. <b>Aurora Serverless v2</b> scales capacity automatically. <b>Aurora Global Database</b>: cross-region replication &lt;1 s, region failover for DR.</p>' },
      { h: 'DynamoDB', html: '<ul><li>Key-value/document, single-digit ms, serverless. Partition key (+ optional sort key). GSIs/LSIs for other access patterns.</li><li>Capacity: <b>on-demand</b> (spiky/unknown) or <b>provisioned</b> with auto scaling (steady, cheaper).</li><li><b>DAX</b> in-memory cache (microseconds). <b>Global tables</b> = multi-region active-active. <b>Streams</b> trigger Lambda. TTL expires items. PITR backups.</li></ul>' },
      { h: 'Caching & other engines', html: '<ul><li><b>ElastiCache</b> (Redis/Valkey: persistence, replication, sorted sets for leaderboards; Memcached: simple multithreaded cache). Patterns: lazy loading, write-through, TTLs. Session store for stateless web tiers.</li><li><b>Redshift</b> (warehouse), <b>Neptune</b> (graph), <b>DocumentDB</b>, <b>Keyspaces</b> (Cassandra), <b>Timestream</b> (time series), <b>QLDB</b>-style ledger use cases, <b>OpenSearch</b> (search/log analytics).</li></ul>' }

    id: 'a15', track: 'awsai', tier: 'a-ai', title: 'AI, ML & generative AI foundations', code: 'AWSAI01-MODEL-LEARNS',
    goal: 'The vocabulary the exam is built on: AI vs ML vs deep learning, learning types, the ML lifecycle, and what a foundation model/LLM actually is.',
    lesson: [
      { h: 'AI vs ML vs deep learning vs generative AI', html: '<ul><li><b>Artificial intelligence (AI)</b> — the broad field of machines doing tasks that seem to need human intelligence.</li><li><b>Machine learning (ML)</b> — a subset of AI where a model <b>learns patterns from data</b> instead of being explicitly programmed.</li><li><b>Deep learning</b> — ML using multi-layer <b>neural networks</b>; powers vision, speech and language.</li><li><b>Generative AI</b> — deep-learning models that <b>create new content</b> (text, images, code) from a prompt, built on <b>foundation models</b>.</li></ul>' },
      { h: 'The three learning types', html: '<table><tr><th>Type</th><th>Data</th><th>Use</th></tr><tr><td><b>Supervised</b></td><td>Labeled (input → known answer)</td><td>Classification (spam/not), regression (predict a price)</td></tr><tr><td><b>Unsupervised</b></td><td>Unlabeled</td><td>Clustering, anomaly detection, grouping customers</td></tr><tr><td><b>Reinforcement</b></td><td>Reward signal from an environment</td><td>Robotics, game-playing, RLHF for tuning LLMs</td></tr></table><p><b>Classification</b> predicts a category; <b>regression</b> predicts a number. Know which a scenario needs.</p>' },
      { h: 'The ML lifecycle', html: '<p>A repeatable loop: <b>business problem → collect & prepare data → feature engineering → train → evaluate → deploy → monitor</b>, then iterate. Most real effort is <b>data</b>. Key splits: <b>training</b> set (learn), <b>validation</b> set (tune), <b>test</b> set (final unbiased score). <b>Overfitting</b> = memorized the training data, fails on new data (high variance). <b>Underfitting</b> = too simple to capture the pattern (high bias).</p>' },
      { h: 'Foundation models, LLMs, tokens & embeddings', html: '<ul><li>A <b>foundation model (FM)</b> is a large model pre-trained on huge, broad data that can be adapted to many tasks. A <b>large language model (LLM)</b> is an FM for text.</li><li>Text is split into <b>tokens</b> (word pieces); models predict the next token. Pricing and context limits are measured in tokens.</li><li>An <b>embedding</b> is a vector (list of numbers) representing meaning, so similar things sit close together — the basis of semantic search and RAG.</li><li>A <b>prompt</b> is your input; <b>inference</b> is the model generating an answer. <b>Temperature</b> raises/lowers randomness; low = focused, high = creative.</li></ul>' },
      { h: 'When NOT to use ML', html: '<div class="callout trap"><b class="k">Exam favorite</b>ML is the wrong tool when you need <b>deterministic, exact, fully explainable</b> results, when <b>simple rules</b> already solve it, or when you <b>lack enough quality data</b>. Don\'t use a probabilistic model where a plain calculation or if/else is correct and auditable.</div>' }

    lesson: [
      { h: 'The AWS AI/ML service map', html: '<ul><li><b>Amazon Bedrock</b> — fully managed access to foundation models (Anthropic Claude, Amazon Titan/Nova, Meta Llama, etc.) via one API; build generative AI apps, agents, knowledge bases, guardrails. <b>Serverless.</b></li><li><b>Amazon SageMaker</b> — build, train and deploy your <b>own</b> ML models end to end (the data-scientist platform). <b>Amazon Q</b> — generative AI assistant (Q Developer for coding, Q Business for your company data).</li><li><b>Pre-trained AI services</b> (no ML skills needed, just an API): <b>Rekognition</b> (images/video), <b>Textract</b> (document text/forms), <b>Comprehend</b> (text/NLP + sentiment), <b>Transcribe</b> (speech→text), <b>Polly</b> (text→speech), <b>Translate</b>, <b>Lex</b> (chatbots), <b>Kendra</b> (intelligent search), <b>Personalize</b> (recommendations), <b>Forecast</b> (time-series).</li></ul><div class="callout"><b class="k">Pick-the-service pattern</b>Custom model from your data → <b>SageMaker</b>. Generative app on an existing FM → <b>Bedrock</b>. Ready-made task (OCR, sentiment, captions) → the matching managed service.</div>' },
      { h: 'Adapting a foundation model — cheapest first', html: '<ol><li><b>Prompt engineering</b> — write better prompts (clear instruction, context, examples = <b>few-shot</b>; <b>zero-shot</b> = none). Cheapest, no training.</li><li><b>RAG (Retrieval-Augmented Generation)</b> — retrieve your own documents (via embeddings in a vector store / Bedrock Knowledge Bases) and feed them into the prompt so the model answers from <b>current, private</b> data without retraining. The standard fix for "the model doesn\'t know our data."</li><li><b>Fine-tuning</b> — further-train the FM on your labeled examples to change its style/behavior. More cost and data.</li><li><b>Train from scratch</b> — rarely needed; most expensive.</li></ol>' },
      { h: 'Responsible AI', html: '<ul><li>Core concerns: <b>bias & fairness</b>, <b>transparency & explainability</b>, <b>robustness</b>, <b>privacy</b>, <b>safety</b>, and <b>human oversight</b>.</li><li><b>Hallucination</b> — a model stating something false with confidence; mitigate with RAG, grounding, and human review.</li><li><b>Amazon Bedrock Guardrails</b> — block harmful content and topics and redact PII. <b>SageMaker Clarify</b> — detect bias and explain feature importance. <b>SageMaker Model Monitor</b> — watch for drift in production. <b>AWS AI Service Cards</b> — document intended use and limitations.</li></ul>' },

  S.push({
    id: 'a18', track: 'awsai', tier: 'a-mle', title: 'Data preparation & model development', code: 'AWSML01-FEATURE-STORE',
    goal: 'Get data ML-ready (clean, split, engineer features, fix imbalance) and train/tune a model with SageMaker — Domains 1 and 2 of MLA-C02.',
    lesson: [
      { h: 'Data formats & where it lives', html: '<ul><li>Training data usually sits in <b>Amazon S3</b>. For large-scale training, columnar <b>Parquet</b> or <b>RecordIO-protobuf</b> are efficient; CSV/JSON are fine for small jobs.</li><li><b>SageMaker Processing</b> runs scalable data-processing/validation jobs; <b>AWS Glue</b> does serverless ETL; <b>Athena</b> queries S3 with SQL.</li><li>Ingest streams with <b>Kinesis</b>; store features for reuse in <b>SageMaker Feature Store</b> (online for low-latency inference, offline for training).</li></ul>' },
      { h: 'Cleaning & feature engineering', html: '<ul><li><b>Missing values</b>: drop, or <b>impute</b> (mean/median/mode, or a model). <b>Outliers</b>: cap or remove when they are errors.</li><li><b>Scaling</b>: <b>normalization</b> (min-max to 0–1) and <b>standardization</b> (zero mean, unit variance) so features are comparable — needed by distance/gradient methods.</li><li><b>Categorical encoding</b>: <b>one-hot</b> for unordered categories, <b>label/ordinal</b> for ordered. <b>Binning</b> groups continuous values.</li><li><b>SageMaker Data Wrangler</b> gives a visual pipeline for all of this; <b>Ground Truth</b> labels data (with humans/automation).</li></ul>' },
      { h: 'Splitting & imbalance', html: '<ul><li>Split into <b>train / validation / test</b>; use <b>k-fold cross-validation</b> for small datasets. Never let test data leak into training (<b>data leakage</b> inflates scores).</li><li><b>Class imbalance</b> (99% "not fraud"): use <b>resampling</b> (oversample minority / undersample majority, e.g. <b>SMOTE</b>), class weights, and judge with <b>precision/recall/F1</b>, not plain accuracy.</li></ul>' },
      { h: 'Training & algorithm choice', html: '<ul><li><b>SageMaker built-in algorithms</b> (XGBoost, Linear Learner, k-means, etc.), <b>script mode</b> (your own TensorFlow/PyTorch/sklearn), or <b>bring your own container</b>.</li><li>Use <b>Managed Spot Training</b> to cut training cost up to ~90%; <b>distributed training</b> for big models/data.</li><li><b>Automatic Model Tuning (AMT)</b> searches hyperparameters (Bayesian/random) to optimize a chosen metric.</li></ul>' },
      { h: 'Evaluating a model', html: '<table><tr><th>Problem</th><th>Watch these metrics</th></tr><tr><td>Classification</td><td>Accuracy, <b>precision, recall, F1</b>, <b>AUC/ROC</b>, confusion matrix</td></tr><tr><td>Regression</td><td><b>RMSE</b>, MAE, R²</td></tr></table><p><b>Bias/variance</b>: high bias = underfit (add features/complexity); high variance = overfit (more data, regularization, simpler model). <b>SageMaker Clarify</b> measures data/model bias and feature importance.</p>' }
    ],
    cards: [
      ['S3 for training data', 'Primary store; Parquet/RecordIO are efficient at scale.'],
      ['SageMaker Processing', 'Scalable data processing/validation jobs.'],
      ['Feature Store', 'Reusable features; online (low-latency) + offline (training).'],
