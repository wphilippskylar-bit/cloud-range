    cards: [['Consumption-based model', 'Pay only for resources used; no upfront costs.'], ['CapEx', 'Up-front spending on physical infrastructure.'], ['OpEx', 'Spending on services as you consume them.'], ['Serverless', 'Provider manages servers; event-driven, billed per execution (Azure Functions).'],
      ['Customer always responsible', 'Information and data, devices, accounts and identities.'], ['Provider always responsible', 'Physical hosts, physical network, physical datacenter.'], ['Public cloud', 'Provider-owned, shared infrastructure, no CapEx.'], ['Private cloud', 'Dedicated to one organization; you own/control it.'], ['Hybrid cloud', 'Public and private clouds connected.'], ['Multi-cloud', 'Using multiple public cloud providers.'], ['Azure Arc', 'Manage hybrid/multi-cloud servers, Kubernetes and data from Azure.'],
      ['SLA', 'Service Level Agreement: guaranteed uptime %, with credits if missed.'], ['Vertical scaling', 'Scale up/down: change VM size.'], ['Horizontal scaling', 'Scale out/in: add/remove instances.'], ['Elasticity', 'Automatically adjust resources to demand.'], ['Composite SLA', 'Multiply SLAs of dependent services; result is lower than each.'], ['99.99% monthly downtime', '≈ 4.4 minutes.'], ['99.9% monthly downtime', '≈ 43.8 minutes.']],

      { h: 'Management hierarchy', html: '<pre>Management groups  (up to 6 levels)\n  └─ Subscriptions  (billing + access boundary)\n       └─ Resource groups  (lifecycle container)\n            └─ Resources  (VM, VNet, storage account…)</pre><ul><li>Every resource is in exactly <b>one</b> resource group. RGs can hold resources from different regions. Deleting an RG deletes everything in it. RGs cannot be nested.</li><li>Policies and RBAC <b>inherit downward</b>.</li><li>Multiple subscriptions for separate billing, environments, or limits.</li></ul>' },
      { h: 'Compute', html: '<p><b>Virtual Machines</b> (IaaS), <b>VM Scale Sets</b> (autoscale identical VMs), <b>Availability sets</b> (fault domains + update domains within a datacenter), <b>Azure Virtual Desktop</b>, <b>Containers</b> (ACI, AKS, Container Apps), <b>Azure Functions</b> (serverless), <b>App Service</b> (PaaS web apps, API apps, WebJobs).</p>' },
      { h: 'Networking', html: '<p><b>VNets</b> + subnets, <b>peering</b> (private, across regions too), <b>NSGs</b>, <b>VPN Gateway</b> (site-to-site, point-to-site, VNet-to-VNet over the internet, encrypted), <b>ExpressRoute</b> (private connection, does not traverse the internet), <b>Azure DNS</b> (host zones; public and private). Public endpoints vs <b>private endpoints</b>.</p>' },
      { h: 'Storage', html: '<ul><li>Storage account (globally unique name, 3–24 lowercase/numbers). Services: <b>Blob</b> (objects), <b>Files</b> (SMB/NFS shares), <b>Queues</b>, <b>Tables</b>, plus managed <b>Disks</b>.</li><li>Blob access tiers: <b>Hot</b>, <b>Cool</b> (30-day min), <b>Cold</b> (90-day), <b>Archive</b> (180-day, offline, rehydrate hours).</li><li>Redundancy: LRS, ZRS, GRS, GZRS, RA-GRS, RA-GZRS.</li><li>Migration: <b>Azure Migrate</b>, <b>Data Box</b>; file movement: <b>AzCopy</b>, <b>Storage Explorer</b>, <b>Azure File Sync</b>.</li></ul>' },

  S.push({
    id: 'z05', track: 'az', tier: 'z-c', title: 'Identities & governance', code: 'AZ05-ROLE-AT-SCOPE',

    lesson: [
      { h: 'Microsoft Entra ID administration', html: '<ul><li>Users (cloud-only or synced from on-prem AD via <b>Entra Connect</b> / Cloud Sync), <b>guest users</b> (B2B), bulk create via CSV.</li><li>Groups: <b>Security</b> vs <b>Microsoft 365</b>; membership <b>assigned</b> or <b>dynamic</b> (rules like <code>user.department -eq "Sales"</code>, requires Entra ID P1).</li><li><b>Self-service password reset</b> (SSPR), licenses assigned to users or groups, <b>administrative units</b> to delegate admin of a subset of users.</li><li>Device join: Entra joined vs registered vs hybrid joined.</li></ul>' },
      { h: 'Azure RBAC', html: '<p>A role assignment = <b>security principal</b> (user, group, service principal, managed identity) + <b>role definition</b> + <b>scope</b> (management group, subscription, resource group, resource). Inherited downward; additive; explicit <b>deny assignments</b> exist but are rare.</p><table><tr><th>Role</th><th>Can</th></tr><tr><td>Owner</td><td>Everything, including assigning roles</td></tr><tr><td>Contributor</td><td>Create/manage everything but <b>cannot grant access</b></td></tr><tr><td>Reader</td><td>View only</td></tr><tr><td>User Access Administrator</td><td>Manage access only</td></tr></table><pre>az role assignment create --assignee dev1@contoso.com \\\n  --role Reader --resource-group rg-app</pre><p><b>Entra roles</b> (Global Administrator, User Administrator) manage the directory; <b>Azure roles</b> manage resources — different systems. Custom roles use JSON with Actions/NotActions/DataActions/AssignableScopes.</p>' },
      { h: 'Governance tools', html: '<ul><li><b>Azure Policy</b>: effects Deny, Audit, Append/Modify (e.g., add a tag), DeployIfNotExists, AuditIfNotExists; assign at a scope with exclusions; remediation tasks for existing resources.</li><li><b>Locks</b>: CanNotDelete / ReadOnly (ReadOnly can break things — e.g., listing storage keys is a POST).</li><li><b>Tags</b> with Policy to inherit from the resource group.</li><li>Moving resources between RGs/subscriptions (both RGs locked during move; resource IDs change).</li><li><b>Cost</b>: budgets, Cost analysis, Advisor cost recommendations, reservations.</li></ul>' },

      { h: 'Azure Files', html: '<p>SMB/NFS shares, snapshots, soft delete, <b>Azure File Sync</b> (cache on Windows Server with cloud tiering), identity-based access with AD DS / Entra Kerberos.</p>' },

  S.push({
    id: 'z07', track: 'az', tier: 'z-c', title: 'Compute: VMs, scale, containers, App Service', code: 'AZ07-SCALE-SET',
    goal: 'Deploy and manage VMs, availability options, scale sets, IaC templates, containers and App Service.',
    lesson: [
      { h: 'Virtual machines', html: '<ul><li>Sizes: B (burstable), D (general), E (memory), F (compute), L (storage), N (GPU). Resize may require a stop/deallocate if the size isn\'t on the current cluster.</li><li>Disks: OS, data, temporary (lost on redeploy). Types: Standard HDD, Standard SSD, Premium SSD (v2), Ultra. <b>Azure Disk Encryption</b> / encryption at host.</li><li><b>Availability</b>: availability set (fault + update domains, 99.95%), availability zones (99.99%), scale sets.</li><li>Connect: RDP/SSH, <b>Bastion</b>, <b>just-in-time</b> access (Defender for Cloud).</li><li>Stopped (OS shutdown — still billed for compute) vs <b>Stopped (deallocated)</b> — compute billing stops.</li></ul><pre>az vm create -g rg-web -n web1 --image Ubuntu2204 \\\n  --vnet-name vnet1 --subnet web --admin-username phil --generate-ssh-keys</pre>' },
      { h: 'VM Scale Sets', html: '<p>Identical VMs with autoscale rules (CPU &gt; 70% → +1 instance), orchestration modes Uniform/Flexible, spread across zones, upgrade policy (manual/automatic/rolling).</p>' },
      { h: 'Templates', html: '<p><b>ARM templates</b> (JSON: parameters, variables, resources, outputs) and <b>Bicep</b>. Export a template from an existing RG, deploy with <code>az deployment group create</code>. Deployment modes: <b>incremental</b> (default — leaves other resources) vs <b>complete</b> (deletes resources not in the template).</p>' },

      ['VMSS autoscale', 'Rules adding/removing instances by metric or schedule.'], ['ARM incremental mode', 'Default; adds/updates, leaves other resources alone.'], ['ARM complete mode', 'Deletes resources in the RG not in the template.'], ['az deployment group create', 'Deploy an ARM/Bicep template to a resource group.'], ['Deployment slots', 'Staging environments for App Service with swap; Standard tier+.'], ['App Service plan', 'Compute that hosts App Service apps; tier sets features/scale.'], ['Container Apps', 'Serverless containers with scale-to-zero and revisions.'], ['Just-in-time VM access', 'Opens management ports only on request for a limited time.']],

  S.push({
    id: 'z08', track: 'az', tier: 'z-c', title: 'Virtual networking', code: 'AZ08-NSG-PRIORITY',
    goal: 'VNets, subnets, peering, NSGs and ASGs, routing, DNS, load balancers, VPN and ExpressRoute.',
    lesson: [
      { h: 'VNets and subnets', html: '<p>A VNet has one or more address spaces; subnets carve it up. Azure reserves <b>5 IPs per subnet</b> (.0 network, .1 gateway, .2 and .3 Azure DNS, last = broadcast). Special subnets: <code>GatewaySubnet</code>, <code>AzureBastionSubnet</code> (/26+), <code>AzureFirewallSubnet</code>. Public IPs: Standard SKU (zone-redundant, secure by default) vs Basic (retired).</p>' },
      { h: 'NSGs — how evaluation really works', html: '<ul><li>Rules have <b>priority 100–4096</b>; <b>lowest number is evaluated first</b>; first match wins and processing stops.</li><li>Default inbound rules (cannot delete, can override with lower numbers): <b>65000 AllowVnetInBound</b>, <b>65001 AllowAzureLoadBalancerInBound</b>, <b>65500 DenyAllInBound</b>.</li><li>NSGs can be associated with a <b>subnet</b> and/or a <b>NIC</b>. Inbound traffic must be allowed by <b>both</b> (subnet NSG first, then NIC NSG). Outbound: NIC then subnet.</li><li><b>Application security groups</b> group VMs by role ("web", "db") so rules reference roles, not IPs.</li><li>Service tags: Internet, VirtualNetwork, AzureLoadBalancer, Storage, Sql…</li><li><b>Effective security rules</b> and <b>IP flow verify</b> (Network Watcher) show exactly which rule allows/denies.</li></ul>' },
      { h: 'Routing & connectivity', html: '<ul><li>System routes + <b>user-defined routes (UDR)</b> in route tables (e.g., 0.0.0.0/0 → Azure Firewall private IP, next hop type Virtual appliance).</li><li><b>VNet peering</b> (regional/global), non-transitive; "use remote gateway" for gateway transit.</li><li><b>VPN Gateway</b> (route-based, SKUs), <b>ExpressRoute</b> (private, SLA), <b>Virtual WAN</b>.</li><li><b>Azure DNS</b> public zones, <b>private DNS zones</b> linked to VNets (auto-registration).</li><li>Load balancing: <b>Load Balancer</b> (L4, public/internal, health probes), <b>Application Gateway</b> (L7, path routing, WAF), <b>Front Door</b> (global L7), <b>Traffic Manager</b> (DNS).</li></ul>' },
      { h: 'Lab', html: '<p>Ticket: the web VM is unreachable even though "we allowed port 80". Find out which NSG rule is winning, fix it without deleting the deny-internet rule, and keep SSH closed.</p>' }
    ],
    cards: [['NSG priority range', '100–4096; lower number = evaluated first; first match wins.'], ['Default NSG inbound rules', '65000 AllowVnetInBound, 65001 AllowAzureLoadBalancerInBound, 65500 DenyAllInBound.'], ['Subnet + NIC NSG (inbound)', 'Traffic must be allowed by both; subnet evaluated first.'], ['Application security group', 'Logical group of NICs used as source/destination in NSG rules.'], ['Service tag', 'Named group of Azure IP prefixes (Internet, VirtualNetwork, Storage...).'],
      ['Azure reserved IPs', '5 per subnet: network, gateway, 2 DNS, broadcast.'], ['GatewaySubnet', 'Required name for VPN/ExpressRoute gateway subnet.'], ['AzureBastionSubnet', 'Required subnet name for Bastion (/26 or larger).'], ['UDR', 'User-defined route overriding system routes (e.g., to a firewall).'], ['VNet peering transitivity', 'Not transitive; use hub with gateway transit or Virtual WAN.'],
      ['Private DNS zone', 'Name resolution within linked VNets; supports auto-registration.'], ['IP flow verify', 'Network Watcher tool that tells which NSG rule allows/denies a flow.'], ['Effective security rules', 'Combined NSG rules applied to a NIC.'], ['Azure Load Balancer', 'Layer 4 TCP/UDP with health probes.'], ['Application Gateway', 'Layer 7 regional LB with WAF option.']],
    qs: [
      { gen: 'cloudSubnet', d: 'y4' },
      Q('An NSG has "Deny Internet any" at priority 200 and "Allow 80 from Internet" at priority 300. Is HTTP allowed?', 'No — priority 200 is evaluated first and denies', ['Yes — allow beats deny', 'Yes — the highest number wins', 'Only for HTTPS'], 'Lowest number first, first match wins.', 'y4'),
      Q('Subnet NSG allows port 80 but the NIC NSG has only an SSH rule. Is HTTP from the internet allowed?', 'No — the NIC NSG\'s DenyAllInBound blocks it; both must allow', ['Yes — subnet NSG wins', 'Yes — NIC NSGs only filter outbound', 'Only if the VM has two NICs'], 'Both NSGs evaluate inbound.', 'y4'),
      Q('Which default rule allows VMs in the same VNet to talk to each other?', 'AllowVnetInBound (65000)', ['DenyAllInBound (65500)', 'AllowInternetOutBound', 'AllowAzureLoadBalancerInBound'], 'Default VNet rule.', 'y4'),
      Q('Write NSG rules by application role instead of IP addresses.', 'Application security groups', ['Service tags', 'UDRs', 'Private DNS'], 'ASGs.', 'y4'),
      Q('Determine exactly which NSG rule is blocking traffic to a VM.', 'Network Watcher IP flow verify (or effective security rules)', ['Azure Advisor', 'Activity log', 'Cost analysis'], 'IP flow verify.', 'y4'),
      Q('Force all outbound internet traffic from a subnet through Azure Firewall.', 'Route table with 0.0.0.0/0 next hop Virtual appliance (firewall private IP) associated to the subnet', ['NSG deny rule', 'VNet peering', 'Service endpoint'], 'UDR.', 'y4'),
      Q('VNet A peers with hub, hub peers with VNet B. Can A reach B by default?', 'No — peering is not transitive', ['Yes, automatically', 'Only for DNS', 'Only with public IPs'], 'Non-transitive.', 'y4'),
      Q('Which subnet name is required for a VPN gateway?', 'GatewaySubnet', ['VPNSubnet', 'AzureGatewaySubnet', 'default'], 'Exact name required.', 'y4'),
      Q('VMs should resolve each other by name inside two VNets without a custom DNS server.', 'Azure Private DNS zone linked to both VNets with auto-registration', ['Public DNS zone', 'Hosts file', 'Traffic Manager'], 'Private DNS.', 'y4'),
      Q('Route /images/* and /api/* to different backend pools with WAF protection.', 'Application Gateway', ['Azure Load Balancer', 'Traffic Manager', 'VPN Gateway'], 'L7 path routing.', 'y4'),
      Q('Internal TCP load balancing for SQL VMs on port 1433 with health probes.', 'Internal Azure Load Balancer (Standard)', ['Front Door', 'Application Gateway public', 'Traffic Manager'], 'Internal LB.', 'y4'),
      Q('Valid NSG priority values range from:', '100 to 4096', ['1 to 65500', '0 to 1000', '1000 to 65000'], 'Custom rules.', 'y4'),
      T('Type the az command used to change an existing NSG rule (four words after az).', ['az network nsg rule update'], 'az network nsg rule update -g ... --nsg-name ... -n ... --priority ...', 'y4', 'az network ...')
    ],
    labs: ['c-az-nsg']
  });

  S.push({

    goal: 'Azure Monitor metrics/logs/alerts, action groups, KQL basics, Network Watcher, Backup and Site Recovery.',

      { h: 'Azure Monitor', html: '<ul><li><b>Metrics</b> (numeric, near real-time, 93-day retention) vs <b>logs</b> (Log Analytics workspace, KQL).</li><li><b>Alert rule</b> = scope + condition (signal + logic) + <b>action group</b> (email/SMS/push/voice, webhook, Logic App, Function, ITSM, runbook). <b>Alert processing rules</b> suppress alerts during maintenance.</li><li><b>VM Insights</b>, <b>Container Insights</b>, <b>Application Insights</b>; Data collection rules + Azure Monitor Agent.</li><li><b>Activity log</b> — control-plane events (who stopped the VM).</li></ul><pre>Heartbeat\n| where TimeGenerated > ago(15m)\n| summarize LastBeat = max(TimeGenerated) by Computer</pre><pre>az monitor metrics alert create -n cpu-high -g rg-web \\\n  --scopes &lt;vm-id&gt; --condition "avg Percentage CPU > 80" \\\n  --action ops-ag</pre>' },
      { h: 'Network Watcher', html: '<p>IP flow verify, next hop, connection troubleshoot, NSG/VNet flow logs, packet capture, topology.</p>' },
      { h: 'Backup & DR', html: '<ul><li><b>Recovery Services vault</b> / <b>Backup vault</b>; backup policies (schedule, retention), soft delete, cross-region restore.</li><li>Back up VMs (application-consistent), Azure Files, SQL in VMs, blobs (operational/vaulted).</li><li><b>Azure Site Recovery</b> replicates VMs to another region; recovery plans; test failover without impact. RPO/RTO concepts.</li></ul>' },

      ['Azure Monitor Agent', 'Collects guest OS logs/metrics via data collection rules.'], ['Recovery Services vault', 'Stores backups and Site Recovery data.'], ['Azure Site Recovery', 'Replicates VMs to a secondary region for DR.'], ['Test failover', 'Validates DR in an isolated network without affecting production.'], ['Network Watcher next hop', 'Shows where traffic from a VM will be routed.'], ['VM Insights', 'Performance and dependency monitoring for VMs.']],
    qs: [
      Q('Email the on-call team and call a webhook when an alert fires. Configure:', 'An action group', ['A diagnostic setting', 'A budget', 'A resource lock'], 'Action groups.', 'y5'),
      Q('Who deallocated the production VM at 2 AM?', 'Activity log', ['VM metrics', 'Log Analytics heartbeat only', 'Azure Advisor'], 'Control-plane events.', 'y5'),
      Q('Suppress alert notifications during a Saturday maintenance window.', 'Alert processing rule', ['Delete the alert', 'Disable the VM', 'Resource lock'], 'Alert processing rules.', 'y5'),
      Q('Query which VMs stopped sending heartbeats in the last 15 minutes.', 'KQL query on the Heartbeat table in Log Analytics', ['Activity log filter', 'Cost analysis', 'Azure Policy'], 'Logs + KQL.', 'y5'),
      Q('Collect guest OS performance counters and event logs from VMs.', 'Azure Monitor Agent with a data collection rule', ['Activity log', 'NSG flow logs', 'Advisor'], 'AMA + DCR.', 'y5'),
      Q('Determine where traffic from a VM to 10.20.1.5 is routed.', 'Network Watcher next hop', ['IP flow verify', 'Topology only', 'Service Health'], 'Next hop.', 'y5'),
      Q('Back up Azure VMs daily and keep them for 30 days.', 'Recovery Services vault with a backup policy', ['Snapshots by hand', 'Site Recovery', 'Lifecycle management'], 'Azure Backup.', 'y5'),
      Q('Replicate VMs to another region and fail over during a disaster.', 'Azure Site Recovery', ['Azure Backup', 'GRS storage', 'Availability set'], 'ASR.', 'y5'),
      Q('Validate DR without affecting production.', 'Run a test failover into an isolated VNet', ['Shut down production', 'Delete the vault', 'Disable replication'], 'Test failover.', 'y5'),
      Q('A backup was deleted by an attacker yesterday. What feature lets you recover it?', 'Soft delete for backups', ['Lifecycle rules', 'NSG', 'ReadOnly lock'], 'Soft delete.', 'y5'),

/* Google Cloud depth pack: Cloud Digital Leader, Generative AI Leader, Associate Cloud Engineer, Professional ML Engineer */
(function () {
  var Q = window.Q, X = window.X, L = COURSE.labs;

  // ======================= Cloud Digital Leader =======================
  X.add('gc1', { gateN: 20,
    lesson: [
      { h: 'Deep dive: the resource hierarchy and why it matters', html: '<p>Everything in Google Cloud sits in a tree: <b>Organization</b> (your company, tied to a Cloud Identity or Workspace domain) → <b>Folders</b> (departments, environments) → <b>Projects</b> (the unit of billing, quotas and API enablement) → <b>resources</b> (VMs, buckets, datasets).</p><ul><li><b>Policies inherit downward.</b> An IAM role granted on a folder applies to every project under it. An organization policy (for example "resources may only be created in EU regions") set at the top constrains everything below.</li><li><b>Projects are isolation boundaries</b>: separate projects for prod and dev keep permissions, budgets and quotas separate.</li><li><b>Billing accounts</b> pay for projects; one billing account can pay for many projects.</li><li><b>Labels</b> (key:value tags) on resources let finance break costs down by team or app.</li></ul><div class="callout trap"><b class="k">Exam trap</b>"Least effort way to apply a policy to 40 projects" → set it once on the parent folder or organization, not 40 times.</div>' },
      { h: 'Deep dive: choosing compute by how much you want to manage', html: '<table><tr><th>You manage…</th><th>Service</th><th>Good fit</th></tr><tr><td>OS, runtime, app</td><td><b>Compute Engine</b></td><td>Lift-and-shift, custom OS, licensed software, GPUs</td></tr><tr><td>Containers + cluster config</td><td><b>GKE Standard</b></td><td>Many microservices, portability, fine control</td></tr><tr><td>Just containers (Google runs nodes)</td><td><b>GKE Autopilot</b></td><td>Kubernetes without node management</td></tr><tr><td>One container image</td><td><b>Cloud Run</b></td><td>Stateless HTTP APIs, jobs, scale to zero, pay per use</td></tr><tr><td>Just code</td><td><b>App Engine</b> / <b>Cloud Run functions</b></td><td>Web apps / event-driven snippets</td></tr></table><p>The further right/down you go, the less operational work, the faster you ship — and the less control you have. Digital Leader questions are almost always "which option reduces operational overhead while meeting the need?"</p>' },
      { h: 'Deep dive: storage and database decision guide', html: '<ul><li><b>Cloud Storage</b> (objects): images, backups, data lakes. Classes by access frequency with <b>minimum storage durations</b>: Standard (none), <b>Nearline 30 days</b>, <b>Coldline 90 days</b>, <b>Archive 365 days</b>. Colder = cheaper to store, pricier to read.</li><li><b>Relational, regional</b>: <b>Cloud SQL</b> (MySQL, PostgreSQL, SQL Server). High-performance PostgreSQL-compatible: <b>AlloyDB</b>.</li><li><b>Relational, global scale, strong consistency</b>: <b>Spanner</b> (up to 99.999% availability multi-region).</li><li><b>NoSQL</b>: <b>Firestore</b> (documents, mobile/web apps), <b>Bigtable</b> (wide-column, massive throughput: IoT, time series, ad tech).</li><li><b>Analytics</b>: <b>BigQuery</b> — a serverless warehouse, not a transactional database.</li><li><b>Cache</b>: <b>Memorystore</b> (Redis/Memcached).</li></ul><p>Migration language: <b>rehost</b> (lift and shift), <b>replatform</b> (lift and optimize, e.g. move the DB to Cloud SQL), <b>refactor</b> (re-architect to containers/serverless), <b>retire</b>, <b>retain</b>.</p>' }
    ],
    qs: [
      Q('A company wants one IAM policy to apply automatically to all 30 projects in its Finance department. Where should it be set?', 'On the Finance folder', ['On each project individually', 'On every VM', 'In the billing account'], 'Policies inherit down the hierarchy; a folder covers every project beneath it.', 'd1'),
      Q('What is the main unit for billing, quotas and enabling APIs in Google Cloud?', 'The project', ['The organization', 'The zone', 'The VPC'], 'Projects hold resources and are linked to a billing account.', 'd1'),
      Q('Finance wants cloud costs broken down by application team. The simplest built-in mechanism is:', 'Labels on resources', ['Separate organizations per team', 'Firewall rules', 'Service accounts'], 'Labels appear in billing exports and reports.', 'd5'),
      Q('A retailer must move 200 VMs quickly with minimal changes. Which migration approach fits?', 'Rehost (lift and shift) to Compute Engine', ['Refactor everything into microservices first', 'Rebuild on App Engine', 'Retire the workloads'], 'Rehosting is the fastest, least-change path.', 'd2'),
      Q('A team wants Kubernetes but does not want to manage nodes at all. Which option?', 'GKE Autopilot', ['GKE Standard', 'Compute Engine', 'Bare Metal Solution'], 'Autopilot runs and scales nodes for you.', 'd2'),
      Q('Which option gives the most control over the operating system?', 'Compute Engine', ['Cloud Run', 'App Engine', 'Cloud Run functions'], 'IaaS VMs: you manage the OS.', 'd2'),
      Q('Data must be kept for 7 years for compliance and is almost never read. Cheapest Cloud Storage class?', 'Archive', ['Standard', 'Nearline', 'Coldline'], 'Archive is cheapest to store, with a 365-day minimum.', 'd2'),
      Q('Backups read about once a month. Which storage class is designed for that pattern?', 'Nearline', ['Archive', 'Standard', 'Coldline'], 'Nearline targets roughly monthly access (30-day minimum).', 'd2'),
      Q('A mobile app needs a flexible, document-based database that syncs to clients. Choose:', 'Firestore', ['Bigtable', 'Cloud SQL', 'BigQuery'], 'Firestore is a document NoSQL database built for app development.', 'd2'),
      Q('An application needs a PostgreSQL-compatible database with very high transactional and analytical performance. Choose:', 'AlloyDB for PostgreSQL', ['Bigtable', 'Firestore', 'Cloud Storage'], 'AlloyDB is Google\'s high-performance PostgreSQL-compatible service.', 'd2'),
      Q('Which service is a data warehouse, not a transactional database?', 'BigQuery', ['Cloud SQL', 'Spanner', 'Firestore'], 'BigQuery is for analytics.', 'd3'),
      Q('Moving from on-premises CapEx to cloud mostly shifts spending to:', 'OpEx — pay for what you use', ['Larger up-front hardware purchases', 'Fixed 10-year contracts', 'No cost at all'], 'Cloud converts capital expense into operating expense.', 'd1'),
      Q('Why might a company choose a multicloud strategy?', 'To avoid lock-in and use the best services from each provider', ['Because one cloud cannot run Linux', 'To remove the need for security', 'Because it is always cheaper'], 'Flexibility and avoiding dependence on one vendor.', 'd1'),
      Q('Which service caches frequently read data in memory to speed up applications?', 'Memorystore', ['Archive storage', 'Cloud DNS', 'Dataproc'], 'Managed Redis/Memcached.', 'd2'),
      Q('Which service runs VMware workloads natively in Google Cloud for a fast data-center exit?', 'Google Cloud VMware Engine', ['Cloud Run', 'App Engine', 'Firestore'], 'VMware Engine runs existing VMware environments unchanged.', 'd2'),
      Q('Refactoring an application usually means:', 'Re-architecting it, e.g. into containers or serverless, to use cloud-native features', ['Copying VMs unchanged', 'Turning it off', 'Keeping it on-premises'], 'Refactor = change the architecture.', 'd2'),
      Q('A company wants an API gateway to secure, publish and monetize its APIs. Choose:', 'Apigee', ['Cloud NAT', 'Cloud Storage', 'Bigtable'], 'Apigee is Google\'s API management platform.', 'd2'),
      Q('Which statement about Cloud Run is true?', 'It runs stateless containers and can scale to zero when there are no requests', ['It requires managing Kubernetes nodes', 'It only runs Windows VMs', 'It is a data warehouse'], 'Serverless containers, pay per use.', 'd2')
    ],
    labs: ['gx-cdl-pick'] });

  X.add('gc2', { gateN: 20,
    lesson: [
      { h: 'Deep dive: the data-to-AI pipeline', html: '<p>Most Digital Leader data questions follow one flow:</p><ol><li><b>Ingest</b> — <b>Pub/Sub</b> for streaming events; <b>Storage Transfer Service</b> / <b>Transfer Appliance</b> for bulk data; <b>Datastream</b> for change data capture from databases.</li><li><b>Process</b> — <b>Dataflow</b> (serverless Apache Beam, batch + streaming), <b>Dataproc</b> (managed Spark/Hadoop for existing jobs).</li><li><b>Store & analyze</b> — <b>BigQuery</b> (serverless SQL warehouse; BigQuery ML trains models with SQL).</li><li><b>Visualize</b> — <b>Looker</b> (governed BI, semantic model) or <b>Looker Studio</b> (free dashboards).</li><li><b>AI</b> — pre-trained APIs → BigQuery ML / AutoML → custom models on <b>Vertex AI</b>; Gemini for generative use cases.</li></ol><p><b>Structured</b> data has a fixed schema (tables); <b>unstructured</b> data (images, audio, documents) feeds AI APIs and Cloud Storage data lakes.</p>' },
      { h: 'Deep dive: trust, security and shared fate', html: '<ul><li><b>Shared responsibility</b>: Google secures the infrastructure; you secure your data, identities, configurations. Google adds <b>"shared fate"</b> — secure-by-default blueprints and tools to help you do your part.</li><li><b>Defense in depth</b>: IAM (who), <b>VPC firewall rules</b> and <b>VPC Service Controls</b> (perimeters that stop data leaving managed services), <b>Cloud Armor</b> (WAF + DDoS at the edge), <b>Identity-Aware Proxy (IAP)</b> (zero-trust access to apps without a VPN — the BeyondCorp model).</li><li><b>Encryption</b> at rest and in transit by default; key options: Google-managed, <b>customer-managed keys (CMEK)</b> in Cloud KMS, or customer-supplied keys.</li><li><b>Security Command Center</b> — posture and threat findings across the org. <b>Assured Workloads</b> and data residency controls help with regulated workloads. <b>Cloud Audit Logs</b> record who did what.</li></ul>' },
      { h: 'Deep dive: operations, reliability and cost', html: '<ul><li><b>SRE</b> ideas Google cares about: <b>SLI</b> (what you measure, e.g. latency), <b>SLO</b> (your target, e.g. 99.9% of requests under 300 ms), <b>SLA</b> (the contract with consequences), and the <b>error budget</b> (how much unreliability the SLO allows — spend it on shipping features).</li><li><b>Observability</b>: Cloud Monitoring, Cloud Logging, Cloud Trace, Error Reporting.</li><li><b>Cost</b>: on-demand, <b>sustained use discounts</b> (automatic on eligible VMs), <b>committed use discounts</b> (1 or 3 years), <b>Spot VMs</b> (deep discount, can be reclaimed), budgets and alerts, the <b>Pricing Calculator</b>, and billing export to BigQuery for analysis. <b>Quotas</b> cap usage to prevent runaway spend or abuse.</li><li><b>Sustainability</b>: Google publishes carbon data per region (Carbon Footprint) — choosing low-carbon regions is a valid answer to "reduce environmental impact".</li></ul>' }
    ],
    qs: [
      Q('A company wants to analyze its cloud spending with SQL and build custom cost dashboards. Best approach?', 'Export billing data to BigQuery', ['Read invoices manually', 'Use Cloud NAT', 'Enable Spot VMs'], 'Billing export to BigQuery enables custom analysis.', 'd5'),
      Q('An existing set of Apache Spark jobs must move to Google Cloud with minimal rewriting. Choose:', 'Dataproc', ['Dataflow', 'Firestore', 'Looker'], 'Dataproc runs Spark/Hadoop as a managed service.', 'd3'),
      Q('Analysts want governed, consistent business metrics in dashboards across the company. Choose:', 'Looker', ['Pub/Sub', 'Cloud Storage', 'Memorystore'], 'Looker\'s semantic model defines metrics once for everyone.', 'd3'),
      Q('A team wants to train a simple forecasting model using SQL where the data already lives. Choose:', 'BigQuery ML', ['Custom training on GPUs', 'Cloud Armor', 'Dataproc'], 'BigQuery ML trains models with SQL statements.', 'd3'),
      Q('Which describes unstructured data?', 'Images, audio, PDFs and free text', ['A relational table with a fixed schema', 'A spreadsheet of numbers only', 'A CSV with typed columns'], 'Unstructured data has no fixed schema.', 'd3'),
      Q('Employees need secure access to an internal web app from anywhere without a VPN, based on identity and device. Choose:', 'Identity-Aware Proxy (IAP)', ['Cloud NAT', 'Archive storage', 'Cloud CDN'], 'IAP implements BeyondCorp-style zero-trust access.', 'd4'),
      Q('A regulated company must control and rotate its own encryption keys for data in Google Cloud. Use:', 'Customer-managed encryption keys (CMEK) in Cloud KMS', ['Default encryption only', 'Firewall rules', 'Labels'], 'CMEK puts key control with the customer.', 'd4'),
      Q('To prevent data from being copied out of BigQuery and Cloud Storage to unauthorized projects, use:', 'VPC Service Controls', ['Cloud CDN', 'Sustained use discounts', 'Cloud Trace'], 'Service perimeters reduce data-exfiltration risk.', 'd4'),

  X.add('gl1', { gateN: 20,
    lesson: [
      { h: 'Deep dive: how a model generates text', html: '<ol><li>Your prompt is split into <b>tokens</b> (word pieces). Models have a <b>context window</b> — the maximum tokens of prompt + response they can consider at once.</li><li>The model predicts a probability for every possible next token and <b>samples</b> one, repeating until done.</li><li><b>Sampling settings</b> shape that choice: <b>temperature</b> (low = focused and repeatable, high = varied and creative), <b>top-k</b> (only consider the k most likely tokens), <b>top-p</b> (consider the smallest set whose probabilities add to p), and <b>max output tokens</b> (length cap).</li></ol><p><b>Embeddings</b> are numeric vectors capturing meaning; similar meanings land close together, which powers semantic search and RAG. <b>Multimodal</b> models accept and/or produce several types: text, images, audio, video, code.</p>' },
      { h: 'Deep dive: the Google Cloud gen AI landscape', html: '<table><tr><th>Layer</th><th>What it is</th></tr><tr><td>Infrastructure</td><td>TPUs and GPUs that train and serve models</td></tr><tr><td>Models</td><td><b>Gemini</b> (multimodal), <b>Imagen</b> (images), <b>Veo</b> (video), <b>Gemma</b> (open models) — plus third-party and open models in <b>Model Garden</b></td></tr><tr><td>Platform</td><td><b>Vertex AI</b>: Vertex AI Studio (try prompts), tuning, evaluation, grounding, deployment, <b>Vertex AI Agent Builder</b> / Vertex AI Search for agents and enterprise search</td></tr><tr><td>Applications</td><td><b>Gemini for Google Workspace</b>, <b>Gemini Code Assist</b>, <b>Gemini Cloud Assist</b>, and enterprise agent/search products (Google Agentspace, now offered as part of Gemini Enterprise)</td></tr></table><p>Choose the layer by the business need: buy an application if it already does the job, build on the platform when you need customization with your data, and only go to custom models when nothing else fits.</p>' },
      { h: 'Deep dive: machine learning vocabulary leaders must know', html: '<ul><li><b>AI</b> ⊃ <b>machine learning</b> (learns from data) ⊃ <b>deep learning</b> (neural networks) ⊃ generative AI / foundation models.</li><li><b>Supervised</b> learning uses labeled examples (spam/not spam); <b>unsupervised</b> finds structure in unlabeled data (clustering); <b>reinforcement learning</b> learns by reward.</li><li><b>Training</b> builds the model; <b>inference</b> uses it. <b>Fine-tuning</b> adapts a pretrained model with your examples.</li><li>Data quality decides model quality: accuracy, completeness, consistency, relevance, and freedom from harmful bias.</li></ul>' }

  X.add('gl2', { gateN: 20,

      { h: 'Deep dive: the improvement ladder (cheapest first)', html: '<ol><li><b>Prompt engineering</b> — role, task, context, format, examples (few-shot), and asking for step-by-step reasoning. Minutes, almost free.</li><li><b>Grounding</b> — connect to trusted data at answer time: <b>grounding with Google Search</b> for public/fresh facts, or <b>your own data</b> through Vertex AI Search/RAG for private facts, with citations.</li><li><b>Tuning</b> — supervised tuning with your labeled examples to teach style, format or a specialized task; <b>distillation</b> transfers a big model\'s skill into a smaller, cheaper one.</li><li><b>Training from scratch</b> — rare, very expensive, only for unique needs.</li></ol><div class="callout trap"><b class="k">Exam trap</b>Need <b>current or private facts</b> → grounding/RAG, not tuning. Need a <b>consistent style or narrow skill</b> → tuning. Tuning does not reliably add fresh facts.</div>' },
      { h: 'Deep dive: agents and how they act', html: '<p>An <b>agent</b> combines a model (reasoning) with <b>tools</b> (APIs, search, databases via function calling), <b>memory</b> and an orchestration loop: think → choose a tool → observe the result → repeat until the goal is met.</p><ul><li>Types you will see: conversational agents (customer service), workflow agents (multi-step business processes), and agents that coordinate other agents.</li><li>Guardrails: least-privilege tool access, human approval for consequential actions (refunds, payments, deletions), logging, and evaluation before launch.</li></ul>' },

  X.add('ge1', { gateN: 20,

      { h: 'Deep dive: gcloud you should be able to type from memory', html: '<pre>gcloud init                                   # sign in, pick project/region\ngcloud config set project my-proj\ngcloud config set compute/zone us-central1-a\ngcloud config configurations create dev       # named configs for many projects\ngcloud services enable compute.googleapis.com # enable an API\n\ngcloud compute instances create web1 --zone=us-central1-a \\\n  --machine-type=e2-medium --image-family=debian-12 --image-project=debian-cloud \\\n  --tags=web --service-account=web-sa@my-proj.iam.gserviceaccount.com --scopes=cloud-platform\n\ngcloud storage buckets create gs://my-proj-logs --location=us-central1\ngcloud storage cp report.csv gs://my-proj-logs/\n\ngcloud projects add-iam-policy-binding my-proj \\\n  --member=user:dana@example.com --role=roles/storage.objectViewer\ngcloud iam service-accounts create web-sa --display-name="web app"</pre>' },
      { h: 'Deep dive: IAM details the exam tests', html: '<ul><li><b>Principals</b>: Google accounts, groups (grant to groups, not people), service accounts, domains.</li><li><b>Predefined roles</b> to know: <code>roles/storage.objectViewer</code> (read objects), <code>roles/storage.objectAdmin</code>, <code>roles/compute.instanceAdmin.v1</code>, <code>roles/compute.networkAdmin</code>, <code>roles/iam.serviceAccountUser</code> (lets a user <i>run as</i> / attach a service account), <code>roles/bigquery.dataViewer</code> + <code>roles/bigquery.jobUser</code> (query data), <code>roles/logging.viewer</code>, <code>roles/run.invoker</code>.</li><li><b>Service account keys</b> are a risk; prefer attached service accounts, <b>Workload Identity</b> (GKE) or <b>Workload Identity Federation</b> (external workloads) — no long-lived keys.</li><li><b>Org policies</b> constrain <i>what</i> can be configured (allowed regions, no external IPs); IAM controls <i>who</i> can do it.</li><li><b>Cloud Audit Logs</b>: Admin Activity logs are always on; <b>Data Access</b> logs must be enabled for most services.</li></ul>' },
      { h: 'Deep dive: compute and storage operations', html: '<ul><li><b>Instance templates</b> define a VM; <b>managed instance groups</b> use them for <b>autoscaling</b>, <b>autohealing</b> (health check recreates failed VMs) and rolling updates. <b>Regional MIGs</b> spread across zones for availability.</li><li>Disks: <b>Persistent Disk / Hyperdisk</b> (network block storage, survives VM deletion if configured), <b>Local SSD</b> (fastest, data lost when the VM stops). <b>Snapshots</b> are incremental backups; schedule them with snapshot schedules.</li><li><b>Cloud Storage</b>: Object Lifecycle Management (change class or delete by age), <b>object versioning</b> (recover overwritten files), <b>uniform bucket-level access</b> (IAM only, no ACLs), <b>signed URLs</b> (time-limited access without an account), retention policies and locks.</li><li><b>GKE</b>: <code>gcloud container clusters create-auto</code> (Autopilot) or <code>create</code> (Standard); then <code>gcloud container clusters get-credentials</code> and <code>kubectl</code>.</li></ul>' }

  X.add('ge2', { gateN: 20,
    lesson: [
      { h: 'Deep dive: VPC firewall rules', html: '<ul><li>VPC firewall rules are <b>stateful</b> (return traffic is allowed automatically) and apply to VMs by <b>network tags</b>, <b>service accounts</b>, or all instances.</li><li>Each rule has a <b>direction</b> (ingress/egress), <b>action</b> (allow/deny), <b>priority</b> 0–65535 (<b>lower number wins</b>; default 1000), targets, sources/destinations and protocols/ports.</li><li><b>Implied rules</b> at priority 65535: deny all ingress, allow all egress. The <code>default</code> network also ships with allow rules for internal traffic, SSH, RDP and ICMP — remove what you don\'t need.</li><li>Allow SSH only through <b>IAP TCP forwarding</b> by allowing source range <code>35.235.240.0/20</code> instead of 0.0.0.0/0.</li></ul><pre>gcloud compute firewall-rules create allow-web --network=prod \\\n  --direction=INGRESS --action=ALLOW --rules=tcp:80,tcp:443 \\\n  --source-ranges=0.0.0.0/0 --target-tags=web --priority=1000</pre>' },
      { h: 'Deep dive: network design patterns', html: '<ul><li><b>Shared VPC</b>: a <b>host project</b> owns the network; <b>service projects</b> attach and deploy into its subnets — central network control, distributed app teams.</li><li><b>VPC Network Peering</b>: private connectivity between two VPCs (non-transitive).</li><li><b>Private Google Access</b>: VMs without external IPs reach Google APIs (Cloud Storage, BigQuery). <b>Cloud NAT</b>: outbound internet for private VMs.</li><li><b>Load balancers</b>: global external <b>Application Load Balancer</b> (HTTP/S, layer 7, one anycast IP, Cloud CDN + Cloud Armor), <b>passthrough Network Load Balancer</b> (layer 4, preserves client IP), internal load balancers for private services.</li><li>Hybrid: <b>Cloud VPN</b> (HA VPN, encrypted over the internet), <b>Dedicated/Partner Interconnect</b> (private, high bandwidth), <b>Cloud Router</b> exchanges routes with BGP.</li></ul>' },
      { h: 'Deep dive: deploying and operating', html: '<pre>gcloud run deploy api --image=us-docker.pkg.dev/my-proj/repo/api:1.2 --region=us-central1 --allow-unauthenticated\ngcloud app deploy app.yaml\nkubectl apply -f deployment.yaml ; kubectl get pods ; kubectl rollout undo deployment/api\ngcloud builds submit --tag us-docker.pkg.dev/my-proj/repo/api:1.3   # Cloud Build → Artifact Registry</pre><ul><li><b>Cloud Run</b>: revisions, traffic splitting between revisions, min instances to avoid cold starts, concurrency per instance.</li><li><b>Monitoring</b>: alerting policies, uptime checks, dashboards; the <b>Ops Agent</b> collects VM logs and metrics. <b>Logging</b>: Logs Explorer, log-based metrics, <b>log sinks</b> to export logs to BigQuery, Cloud Storage or Pub/Sub; log buckets with retention.</li><li><b>Budgets and alerts</b> don\'t stop spending by themselves — they notify (you can trigger automation via Pub/Sub).</li></ul>' }
    ],
    qs: [
      Q('Two firewall rules match the same traffic: allow at priority 1000 and deny at priority 900. What happens?', 'It is denied — the lower number (900) has higher priority', ['It is allowed — allow always wins', 'Both apply randomly', 'The newest rule wins'], 'Lower priority number takes precedence.', 'k2'),
      Q('With no custom rules on a new custom VPC, inbound traffic from the internet is:', 'Denied by the implied deny-ingress rule', ['Allowed on all ports', 'Allowed only on port 80', 'Allowed for SSH only'], 'Implied rules: deny ingress, allow egress.', 'k2'),
      Q('To allow SSH to private VMs only through Identity-Aware Proxy, the firewall source range should be:', '35.235.240.0/20', ['0.0.0.0/0', '10.0.0.0/8 only', '127.0.0.1/32'], 'That range is used by IAP TCP forwarding.', 'k5'),
      Q('A firewall rule should apply only to web servers. The usual way to target them is:', 'Network tags (or a target service account)', ['Their machine type', 'Their disk size', 'The project number'], 'Targets select which VMs a rule covers.', 'k2'),
      Q('A central network team must control subnets while app teams deploy in their own projects. Use:', 'Shared VPC (host and service projects)', ['A separate VPC per VM', 'VPC peering for every VM', 'Cloud NAT only'], 'Shared VPC centralizes network administration.', 'k1'),
      Q('VPC A peers with B, and B peers with C. Can A reach C through B?', 'No — VPC peering is not transitive', ['Yes, always', 'Only with Cloud CDN', 'Only on port 443'], 'Each pair must peer directly.', 'k2'),
      Q('Private VMs without external IPs need to read from Cloud Storage. Enable:', 'Private Google Access on the subnet', ['An external IP on every VM', 'Cloud CDN', 'A signed URL for each VM'], 'Private Google Access reaches Google APIs privately.', 'k2'),
      Q('A layer-4 load balancer that preserves the client source IP for a TCP game server is a:', 'Passthrough Network Load Balancer', ['Global external Application Load Balancer', 'Cloud CDN', 'Cloud DNS'], 'Passthrough NLBs don\'t proxy connections.', 'k3'),

  X.add('gp1', { gateN: 20,
    lesson: [
      { h: 'Deep dive: metrics you must calculate', html: '<p>From a confusion matrix (TP, FP, FN, TN):</p><ul><li><b>Precision</b> = TP / (TP + FP) — of what we flagged, how much was right. Optimize when false positives are costly (spam filter hiding real mail).</li><li><b>Recall</b> = TP / (TP + FN) — of the real positives, how many we caught. Optimize when misses are costly (fraud, disease).</li><li><b>F1</b> = 2 × P × R / (P + R) — balance of both.</li><li><b>Accuracy</b> = (TP + TN) / total — misleading on imbalanced data (99% "not fraud" is 99% accurate and useless).</li><li><b>AUC-ROC</b> threshold-independent ranking quality; <b>AUC-PR</b> better for heavy imbalance.</li><li>Regression: <b>MAE</b> (average absolute error, robust to outliers), <b>RMSE</b> (penalizes big errors).</li></ul>' },
      { h: 'Deep dive: data pitfalls that sink models', html: '<ul><li><b>Data leakage</b>: features that contain information unavailable at prediction time (e.g. "refund issued" when predicting fraud) → great offline scores, failure in production.</li><li><b>Training-serving skew</b>: preprocessing done differently in training and serving. Fix by sharing transformation code (TensorFlow Transform, the same Dataflow/BigQuery logic) and a <b>Feature Store</b>.</li><li><b>Class imbalance</b>: resample (up/down), class weights, choose PR-based metrics.</li><li><b>Splits</b>: random split for i.i.d. data, but <b>time-based split</b> for time series (never train on the future).</li><li><b>Feature engineering</b>: normalization/standardization, one-hot or embeddings for categories, bucketizing, feature crosses.</li></ul>' },
      { h: 'Deep dive: picking the right level of tooling', html: '<table><tr><th>Need</th><th>Choose</th></tr><tr><td>Common task (OCR, translation, labels)</td><td>Pre-trained API (Vision, Translation, Document AI, Speech)</td></tr><tr><td>Tabular data in BigQuery, SQL skills</td><td>BigQuery ML</td></tr><tr><td>Custom labels, little ML expertise</td><td>AutoML on Vertex AI</td></tr><tr><td>Generative task</td><td>Gemini via Vertex AI (prompting → grounding → tuning)</td></tr><tr><td>Unique architecture/full control</td><td>Custom training on Vertex AI</td></tr></table>' }

    lesson: [{ h: 'Deep dive: decoupling patterns and DR numbers', html: '<ul><li><b>SQS Standard</b>: nearly unlimited throughput, at-least-once delivery, best-effort ordering. <b>SQS FIFO</b>: ordered, exactly-once processing (lower throughput). <b>Visibility timeout</b> hides a message while it is processed; a <b>dead-letter queue</b> catches messages that keep failing; <b>long polling</b> reduces empty responses and cost.</li><li><b>SNS + SQS fan-out</b>: one event to many independent queues. <b>EventBridge</b>: event bus with content-based rules, SaaS and scheduled events. <b>Kinesis Data Streams</b>: ordered real-time streams with replay; <b>Amazon Data Firehose</b>: load streams into S3/Redshift/OpenSearch with no code.</li><li><b>Step Functions</b>: orchestrate multi-step workflows with retries and branching.</li></ul><table><tr><th>DR strategy</th><th>RPO/RTO</th><th>Cost</th></tr><tr><td>Backup & restore</td><td>Hours</td><td>Lowest</td></tr><tr><td>Pilot light (core data replicated, minimal services off)</td><td>Tens of minutes</td><td>Low</td></tr><tr><td>Warm standby (scaled-down full copy running)</td><td>Minutes</td><td>Medium</td></tr><tr><td>Multi-site active/active</td><td>Near zero</td><td>Highest</td></tr></table><p><b>AWS Backup</b> centralizes backup policies across services and accounts; <b>Elastic Disaster Recovery</b> replicates servers for fast recovery.</p>' }],

  X.add('z08', { gateN: 20,
    lesson: [{ h: 'Deep dive: NSG rules, routing and load balancing', html: '<ul><li><b>NSG rules</b>: priority 100–4096, <b>lower number evaluated first</b>, first match wins. Default rules (65000+) allow VNet-to-VNet traffic and Azure Load Balancer probes, deny all other inbound; allow outbound to internet. NSGs can attach to subnets and NICs — inbound traffic must pass the subnet NSG <b>and</b> the NIC NSG.</li><li><b>Application security groups (ASGs)</b> let rules target "WebServers" instead of IPs. <b>Service tags</b> (Internet, VirtualNetwork, AzureLoadBalancer, Storage) replace IP lists.</li><li><b>User-defined routes</b> send traffic to a next hop (e.g. a firewall appliance — "virtual appliance"). Peering is <b>non-transitive</b>; <b>gateway transit</b> lets spokes use the hub\'s VPN gateway.</li><li>Load balancing: <b>Azure Load Balancer</b> (L4, regional), <b>Application Gateway</b> (L7, path routing, WAF, regional), <b>Front Door</b> (global L7 with CDN and WAF), <b>Traffic Manager</b> (DNS-based global routing).</li><li><b>Azure Bastion</b>: RDP/SSH from the portal over TLS with no public IPs on VMs. <b>Azure DNS private zones</b> for name resolution inside VNets.</li></ul>' }],

      Q('An NSG has "Allow 443 priority 200" and "Deny all priority 100" for the same traffic. Result?', 'Denied — priority 100 is evaluated first', ['Allowed — allow beats deny', 'Both apply', 'Depends on the source port'], 'Lowest number wins.', 'y4'),
      Q('Traffic is allowed by the subnet NSG but denied by the NIC NSG. Result?', 'Denied — inbound must be allowed by both', ['Allowed — subnet wins', 'Allowed — NIC is ignored', 'Random'], 'Both layers must allow.', 'y4'),

  X.add('va1', { lesson: [{ h: 'Worked example: from business question to model', html: '<p><b>Request:</b> "Reduce customer churn."</p><ol><li><b>Frame it</b>: predict which customers will cancel in the next 30 days → <b>binary classification</b>. Success metric: recall on churners at an acceptable precision, tied to the retention team\'s capacity (they can call 500 people a week).</li><li><b>Data</b>: 2 years of account history. Label = "cancelled within 30 days of the snapshot date". Features: tenure, plan, support tickets, usage trend. Exclude anything recorded <i>after</i> the snapshot (leakage).</li><li><b>Prepare</b>: impute missing usage with the median, one-hot the plan type, standardize numeric features, split by <b>time</b> (train on year 1, validate on early year 2, test on latest months).</li><li><b>Baseline</b>: a simple rule ("tickets &gt; 3 → churn") gives something to beat. Then try logistic regression and gradient boosting.</li><li><b>Evaluate</b>: confusion matrix at the threshold that yields ~500 flagged customers a week; check performance across customer segments for fairness.</li><li><b>Deploy and monitor</b>: weekly batch scoring, track drift and the business KPI (churn rate among contacted customers vs a control group).</li></ol>' }] });
  X.add('va2', { lesson: [{ h: 'Worked example: rolling out an AI assistant responsibly', html: '<ol><li><b>Use case</b>: draft replies for support agents (human sends the final message) — high value, contained risk.</li><li><b>Risk assessment</b> (NIST Map): harms include wrong refund promises, leaking another customer\'s data, biased tone. Classify the system (under the EU AI Act this is limited-risk with transparency duties).</li><li><b>Design controls</b>: ground answers in the knowledge base (RAG), restrict retrieval to the current customer\'s records, content filters, agent review before sending, logging.</li><li><b>Measure</b>: evaluation set of 200 real tickets scored for accuracy, groundedness and tone; red-team prompts for leakage.</li><li><b>Govern</b>: acceptable-use policy, named owner, model card, training for agents (avoid automation bias), incident process.</li><li><b>Operate</b>: monitor edit rate (how much agents change drafts), complaint rate and cost per ticket; review monthly.</li></ol>' }] });

  // ---------- flashcards (Leitner) ----------
  var BOX_DAYS = [0, 1, 2, 4, 8, 16, 30];
  function cardState(c) { return S.cards[c.id] || { box: 0, due: 0 }; }
  function dueCards(list) { var now = Date.now(); return list.filter(function (c) { return cardState(c).due <= now; }); }
  function cardSession(p, list, label) {
    var mode = 'term', deck = shuffle(dueCards(list)), extra = false;
    if (!deck.length) { deck = shuffle(list); extra = true; }
    var i = 0, flipped = false, done = 0;
    function draw() {
      if (i >= deck.length) {
        p.innerHTML = '<div class="panel center"><div class="big">✓</div><h2>Deck cleared</h2><p class="muted">' + done + ' cards reviewed. Cards you marked "Again" come back first next time.</p><button class="btn pri" id="again">Run it again</button></div>';
        $('#again', p).onclick = function () { cardSession(p, list, label); }; return;
      }
      var c = deck[i], cs = cardState(c);

      var back = mode === 'term' ? '<div>' + c.d + '</div>' : '<b>' + esc(c.t) + '</b>';
      p.innerHTML = '<div class="row small muted"><span>' + esc(label) + ' · ' + (i + 1) + '/' + deck.length + (extra ? ' (extra practice — nothing due)' : '') + '</span><span class="grow"></span>' +
        '<button class="btn sm ghost" id="swap">' + (mode === 'term' ? 'Term → Def' : 'Def → Term') + '</button></div>' +
        '<div class="flash' + (flipped ? ' flip' : '') + '" id="fc"><div class="in"><div class="f">' + front + '<div class="dim small" style="margin-top:12px">tap to flip · box ' + cs.box + '</div></div><div class="b">' + back + '</div></div></div>' +
        '<div class="grade"><button class="btn warn" data-g="0">Again</button><button class="btn" data-g="1">Hard</button><button class="btn pri" data-g="2">Got it</button></div>' +
        '<p class="dim small center" style="margin-top:10px">Laptop: Space flips · 1/2/3 grade</p>';
      $('#fc', p).onclick = function () { flipped = !flipped; this.classList.toggle('flip', flipped); };
      $('#swap', p).onclick = function () { mode = mode === 'term' ? 'def' : 'term'; flipped = false; draw(); };
      p.querySelectorAll('[data-g]').forEach(function (b) { b.onclick = function () { grade(+b.dataset.g); }; });
    }
    function grade(g) {
      var c = deck[i], cs = cardState(c);
      cs.box = g === 0 ? 0 : g === 1 ? Math.max(1, cs.box) : Math.min(6, cs.box + 1);
      cs.due = g === 0 ? Date.now() : Date.now() + BOX_DAYS[cs.box] * 864e5;
      S.cards[c.id] = cs; persist();
      if (g === 0) deck.push(c);

    }
    function key(e) {
      if (!p.isConnected) { document.removeEventListener('keydown', key); return; }
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.code === 'Space') { e.preventDefault(); var f = $('#fc', p); if (f) f.click(); }
      if (e.key === '1' || e.key === '2' || e.key === '3') grade(+e.key - 1);

    cleanup = function () { document.removeEventListener('keydown', key); };

  }
  function pCards(p, s) { cardSession(p, s.cards, s.title); }

  // ---------- questions ----------
  function letter(i) { return 'ABCDEFG'.charAt(i); }
  function normAns(s) { return String(s).trim().toLowerCase().replace(/\s+/g, ' ').replace(/;$/, ''); }
  function checkInput(q, val) {
    var v = normAns(val);
    return (q.accept || []).some(function (a) {
      if (a instanceof RegExp) return a.test(val.trim());
      return normAns(a) === v;
    });
  }
  function renderQ(q, opts) { // returns html
    var h = '<div class="q">' + (q.html ? q.q : esc(q.q)) + '</div>';
    if (q.input) h += '<input class="answer-in" id="ain" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="' + esc(q.ph || 'Type your answer') + '" enterkeyhint="done">' +
      '<div class="row" style="margin-top:8px"><button class="btn pri" id="asub">Submit</button></div>';
    else h += '<div class="choices">' + q.order.map(function (ci, k) { return '<button class="choice" data-c="' + ci + '"><span class="l">' + letter(k) + '</span><span>' + esc(q.c[ci]) + '</span></button>'; }).join('') + '</div>';
    return h;

  function prep(q) { q = realize(q); var o = { order: q.c ? shuffle(q.c.map(function (_, i) { return i; })) : null }; for (var k in q) o[k] = q[k]; if (q.keep) o.order = q.c.map(function (_, i) { return i; }); return o; }

  function pPractice(p, s) {
    var pool = s.qs, missedOnly = false;
    var right = 0, total = 0;
    function next() {
      var src = missedOnly ? pool.filter(function (q, i) { return S.missed[s.id + ':' + i]; }) : pool;
      if (!src.length) { p.innerHTML = '<div class="panel">No missed questions here. Nice.</div>'; return; }
      var qi = Math.floor(Math.random() * src.length), raw = src[qi], idx = pool.indexOf(raw), q = prep(raw);
      p.innerHTML = '<div class="row small" style="margin-bottom:8px"><span class="muted">Practice · instant explanations · ' + right + '/' + total + '</span><span class="grow"></span>' +
        '<button class="btn sm ' + (missedOnly ? 'pri' : 'ghost') + '" id="mo">Missed only</button></div><div class="panel" id="qp">' + renderQ(q) + '</div>';
      $('#mo', p).onclick = function () { missedOnly = !missedOnly; next(); };
      wire($('#qp', p), q, function (ok) {
        total++; if (ok) right++;
        if (!q.gen) { if (ok) delete S.missed[s.id + ':' + idx]; else S.missed[s.id + ':' + idx] = 1; persist(); }
        var b = document.createElement('div'); b.className = 'row'; b.style.marginTop = '10px';
        b.innerHTML = '<button class="btn pri" id="nx">Next question</button>'; $('#qp', p).appendChild(b);
        $('#nx', p).onclick = next; $('#nx', p).focus();
      }, true);
    }
    next();
  }
  // wire answering for a rendered question. instant=true shows explanation.
  function wire(box, q, done, instant) {
    var answered = false;
    function finish(ok, picked) {
      if (answered) return; answered = true;
      if (!q.input && instant) box.querySelectorAll('.choice').forEach(function (b) {
        var ci = +b.dataset.c; if (ci === q.a) b.classList.add('right'); else if (ci === picked) b.classList.add('wrong'); b.disabled = true;

      inp.onkeydown = function (e) { if (e.key === 'Enter') sub.click(); };
      if (document.body.classList.contains('pc')) inp.focus();
    } else box.querySelectorAll('.choice').forEach(function (b) { b.onclick = function () { finish(+b.dataset.c === q.a, +b.dataset.c); }; });
  }

  // ---------- gate test ----------
  function pGate(p, s) {
    var x = st(s.id);
    if (!gateReady(s)) {
      p.innerHTML = '<div class="panel"><h2>🔒 Gate locked</h2><p>Before you can test out of this step:</p><ul>' +
        '<li>' + (x.lesson ? '✓' : '○') + ' Read the lesson and mark it complete</li>' +
        ((s.labs || []).length ? '<li>' + (labsDone(s) === s.labs.length ? '✓' : '○') + ' Complete every lab (' + labsDone(s) + '/' + s.labs.length + ')</li>' : '') +
        '</ul><p class="muted">Then score <b>over ' + PASS + '%</b> to unlock the next step and earn your checkpoint phrase.</p></div>';
      return;
    }
    var cap = s.capstone, n = cap ? cap.n : Math.min(s.gateN || 15, s.qs.length);
    p.innerHTML = '<div class="panel"><h2>' + (cap ? 'Capstone exam' : 'Gate test') + '</h2>' +
      '<p>' + n + ' questions' + (cap ? ', weighted to the official domain percentages, ' + cap.minutes + '-minute timer' : '') + '. No hints or explanations until the end. You need <b>over ' + PASS + '%</b> (' + Math.floor(n * PASS / 100 + 1) + '/' + n + ' or better).</p>' +
      (x.passed ? '<p class="chip ok">Already passed — best ' + x.best + '%. Retakes keep your best.</p>' : '') +
      '<p class="muted small">Attempts: ' + x.attempts + (x.best ? ' · best ' + x.best + '%' : '') + '</p>' +
      '<button class="btn pri" id="go">Start ' + (cap ? 'exam' : 'gate test') + '</button></div>' +
      (x.passed ? '<div class="panel" style="margin-top:12px"><div class="tag">Checkpoint phrase for this step</div><div class="code" style="margin-top:8px">' + esc(s.code) + '</div></div>' : '');
    $('#go', p).onclick = function () { runTest(p, s, buildSet(s, n), cap); };
  }
  function buildSet(s, n) {
    if (s.capstone) {
      var pool = [];
      STAGES.forEach(function (o) {
        var inPool = s.capstone.pool ? s.capstone.pool.indexOf(o.id) >= 0 : (o.idx <= s.idx && o.tier !== 'pro' && o.track === s.track);
        if (inPool) o.qs.forEach(function (q) { if (q.d) pool.push(q); });
      });
      var W = s.capstone.weights || C.weights, out = [];
      var counts = {}, tot = 0;
      Object.keys(W).forEach(function (d) { counts[d] = Math.round(n * W[d] / 100); tot += counts[d]; });
      var dk = Object.keys(W).sort(function (a, b) { return W[b] - W[a]; }), k = 0;
      while (tot !== n) { counts[dk[k % dk.length]] += tot < n ? 1 : -1; tot += tot < n ? 1 : -1; k++; }
      Object.keys(counts).forEach(function (d) {
        var dp = shuffle(pool.filter(function (q) { return String(q.d) === d; }));
        out = out.concat(dp.slice(0, counts[d]));
      });
      if (out.length < n) out = out.concat(shuffle(pool.filter(function (q) { return out.indexOf(q) < 0; })).slice(0, n - out.length));
      return shuffle(out).map(prep);
    }
    return shuffle(s.qs).slice(0, n).map(prep);
  }
  function runTest(p, s, set, cap) {
    var i = 0, answers = [], t0 = Date.now(), timerId = null, limit = cap ? cap.minutes * 60 : 0;
    function tick() {
      var el = $('#tm', p); if (!el) return;
      var left = limit - Math.floor((Date.now() - t0) / 1000);
      if (left <= 0) { finish(); return; }
      el.textContent = Math.floor(left / 60) + ':' + ('0' + left % 60).slice(-2);
    }
    if (cap) { timerId = setInterval(tick, 1000); cleanup = function () { clearInterval(timerId); }; }
    function show() {
      if (i >= set.length) return finish();
      var q = set[i];
      p.innerHTML = '<div class="qmeta"><span>' + (cap ? 'CAPSTONE' : 'GATE') + ' · Q' + (i + 1) + '/' + set.length + (q.d && (cap && cap.domains || C.domains) ? ' · D' + q.d : '') + '</span>' + (cap ? '<span class="timer" id="tm"></span>' : '') + '</div>' +
        '<div class="bar" style="margin-bottom:12px"><i style="width:' + (100 * i / set.length) + '%"></i></div><div class="panel" id="qp">' + renderQ(q) + '</div>' +
        '<div class="row" style="margin-top:10px"><button class="btn sm ghost" id="quit">Abandon test</button></div>';
      if (cap) tick();
      $('#quit', p).onclick = function () { if (confirm('Abandon this attempt? It counts as an attempt but not a score.')) { st(s.id).attempts++; persist(); if (timerId) clearInterval(timerId); route(); } };
      wire($('#qp', p), q, function (ok, picked) {
        answers.push({ ok: ok, picked: picked });
        if (!q.input) { var b = $('#qp', p).querySelector('[data-c="' + picked + '"]'); if (b) b.classList.add('sel'); }
        setTimeout(function () { i++; show(); }, q.input ? 150 : 220);
      }, false);
    }
    function finish() {
      if (timerId) clearInterval(timerId);
      while (answers.length < set.length) answers.push({ ok: false, picked: null, timeout: true });
      var right = answers.filter(function (a) { return a.ok; }).length, pct = Math.round(1000 * right / set.length) / 10;
      var x = st(s.id), passed = pct > PASS, first = passed && !x.passed;
      x.attempts++; x.best = Math.max(x.best || 0, pct);
      if (passed) x.passed = true;
      S.history.push({ stage: s.id, pct: pct, at: Date.now() });
      if (cap) {
        var byD = {}; set.forEach(function (q, k) { var d = q.d || 0; byD[d] = byD[d] || [0, 0]; byD[d][1]++; if (answers[k].ok) byD[d][0]++; });
      }
      persist(); topbar();
      var next = STAGES.filter(function (o) { return o.prev === s; })[0];
      var h = '<div class="panel center"><div class="tag">' + (passed ? 'PASSED' : 'NOT YET') + '</div><div class="big" style="color:' + (passed ? 'var(--ok)' : 'var(--bad)') + '">' + pct + '%</div>' +
        '<p>' + right + '/' + set.length + ' correct · needed over ' + PASS + '%</p>';
      if (passed) h += '<p class="muted">Write down your checkpoint phrase. Typing it into <b>Save → Restore</b> on any device puts you right back here.</p><div class="code" id="cp">' + esc(s.code) + '</div>' +
        '<div class="row" style="justify-content:center;margin-top:10px"><button class="btn" id="cpy">Copy phrase</button>' + (next ? '<button class="btn pri" data-go="#stage/' + next.id + '">Unlocked: ' + esc(next.title) + ' →</button>' : '') + '</div>';
      else h += '<p class="muted">Review every miss below, drill the cards, and use Practice → Missed only. Then retake — the questions reshuffle.</p>';
      h += '</div>';
      if (cap && byD) h += '<div class="panel" style="margin-top:12px"><h3>By domain</h3>' + Object.keys(byD).map(function (d) { var v = byD[d], pc = Math.round(100 * v[0] / v[1]); return '<div class="row small" style="margin:6px 0"><span style="flex:0 0 52%">' + esc(((cap && cap.domains) || C.domains || {})[d] || 'Other') + '</span><div class="bar grow"><i style="width:' + pc + '%;background:' + (pc > PASS ? 'var(--ok)' : pc >= 75 ? 'var(--lock)' : 'var(--bad)') + '"></i></div><span class="mono">' + pc + '%</span></div>'; }).join('') + '</div>';
      h += '<h3 style="margin-top:18px">Review</h3><div class="stack">';
      set.forEach(function (q, k) {
        var a = answers[k];
        var yours = a.timeout ? '(time ran out)' : q.input ? a.picked : (a.picked != null ? q.c[a.picked] : '');
        if (!a.ok && !q.gen) { var oi = s.qs.indexOf(q); }
        h += '<div class="panel tight"><div class="small muted">Q' + (k + 1) + ' · ' + (a.ok ? '<span style="color:var(--ok)">correct</span>' : '<span style="color:var(--bad)">missed</span>') + '</div><div class="q" style="font-size:.95rem">' + (q.html ? q.q : esc(q.q)) + '</div>' +
          (!a.ok ? '<div class="small">You: <code>' + esc(yours) + '</code></div>' : '') + explainHtml(q, a.ok) + '</div>';
      });
      h += '</div>';
      p.innerHTML = h;
      var cp = $('#cpy', p); if (cp) cp.onclick = function () { copy(s.code); };
      if (first) toast('🔓 ' + (next ? next.title + ' unlocked' : 'Path complete!'), 3000);
    }
    show();
  }

  // ---------- LABS ----------
  function pLabs(p, s) {
    p.innerHTML = '<div class="list">' + (s.labs || []).map(function (id) {
      var L = C.labs[id], ok = st(s.id).labs[id];
      return '<button class="li" data-go="#lab/' + id + '"><span class="chip ' + (ok ? 'ok' : '') + '">' + (ok ? '✓' : 'LAB') + '</span><span class="grow"><b>' + esc(L.title) + '</b><div class="s">' + esc(L.sum || '') + '</div></span><span class="muted">›</span></button>';
    }).join('') + '</div>';
  }
  function labStage(id) { return STAGES.filter(function (s) { return (s.labs || []).indexOf(id) >= 0; })[0]; }
  function vLabs(m) {
    var h = '<h1>Labs</h1><p class="muted">Every lab from steps you have unlocked. Labs stay open for practice after you pass.</p>';
    STAGES.forEach(function (s) {
      if (!(s.labs || []).length) return;
      var un = unlocked(s);
      h += '<div class="tier"><h3>' + esc(stepLabel(s)) + '. ' + esc(s.title) + '</h3>' + (un ? '' : '<span class="chip lock">🔒</span>') + '</div><div class="list">';
      s.labs.forEach(function (id) {
        var L = C.labs[id], ok = st(s.id).labs[id];
        h += '<button class="li" ' + (un ? 'data-go="#lab/' + id + '"' : 'disabled style="opacity:.5"') + '><span class="chip ' + (ok ? 'ok' : '') + '">' + (ok ? '✓' : 'LAB') + '</span><span class="grow"><b>' + esc(L.title) + '</b><div class="s">' + esc(L.sum || '') + '</div></span></button>';
      });
      h += '</div>';
    });
    m.innerHTML = h;
  }
  function vLab(m, args) {
    var id = args[0], L = C.labs[id], s = labStage(id);
    if (!L || !s || !unlocked(s)) { location.hash = '#labs'; return; }
    var kind = window.LAB_KINDS && window.LAB_KINDS[L.kind || 'net'];
    var api = {
      lite: S.device === 'phone',
      load: function () { return load(C.id + ':lab:' + id, null); },
      save: function (v) { save(C.id + ':lab:' + id, v); },
      clear: function () { try { localStorage.removeItem(C.id + ':lab:' + id); } catch (e) { } },
      complete: function () {
        if (!st(s.id).labs[id]) { st(s.id).labs[id] = true; persist(); toast('✓ Lab complete: ' + esc(L.title), 2600); }
      },
      done: function () { return !!st(s.id).labs[id]; },
      back: '#stage/' + s.id + '/labs',
      esc: esc, modal: modal, toast: toast,
      setCleanup: function (f) { cleanup = f; }
    };
    kind.render(m, L, api);
  }

  // ---------- CARDS (global) ----------
  function vCards(m) {
    var open = STAGES.filter(unlocked), all = [];
    open.forEach(function (s) { all = all.concat(s.cards); });
    var due = dueCards(all).length;
    m.innerHTML = '<h1>Flashcards</h1><p class="muted">Spaced repetition across every unlocked step. ' + due + ' due now of ' + all.length + '.</p>' +
      '<div class="row" style="margin-bottom:12px"><button class="btn pri" id="all">Review all due</button></div><div class="list">' +
      open.map(function (s) { return '<button class="li" data-st="' + s.id + '"><span class="grow"><b>' + esc(stepLabel(s)) + '. ' + esc(s.title) + '</b><div class="s">' + dueCards(s.cards).length + ' due · ' + s.cards.length + ' cards</div></span><span class="muted">›</span></button>'; }).join('') + '</div><div id="pane"></div>';
    $('#all', m).onclick = function () { var p = document.createElement('div'); m.innerHTML = ''; m.appendChild(p); cardSession(p, all, 'All decks'); };
    m.querySelectorAll('[data-st]').forEach(function (b) { b.onclick = function () { location.hash = '#stage/' + b.dataset.st + '/cards'; }; });
  }

  // ---------- TOOLS ----------
  function vTools(m) {
    m.innerHTML = '<h1>Tools & drills</h1><p class="muted">Endless, randomly generated practice. Use them any time — they never run out.</p><div class="list">' +
      (C.tools || []).map(function (t) { return '<button class="li" data-go="#tool/' + t.id + '"><span class="grow"><b>' + esc(t.title) + '</b><div class="s">' + esc(t.desc) + '</div></span><span class="muted">›</span></button>'; }).join('') + '</div>';
  }
  function vTool(m, args) {
    var t = (C.tools || []).filter(function (x) { return x.id === args[0]; })[0];
    if (!t) return vTools(m);
    m.innerHTML = '<div class="row" style="margin-bottom:8px"><button class="btn sm ghost" data-go="#tools">← Tools</button></div><h1>' + esc(t.title) + '</h1><div id="tool"></div>';
    t.render($('#tool', m), { esc: esc, shuffle: shuffle, toast: toast, gens: C.gens, renderQ: renderQ, wire: wire, prep: prep, setCleanup: function (f) { cleanup = f; } });
  }

  // ---------- SAVE / CODES ----------
  function normCode(c) { return String(c).toUpperCase().replace(/[^A-Z0-9]+/g, ''); }
  function restoreTo(s) {
    STAGES.forEach(function (o) {
      if (o.track === s.track && o.tidx <= s.tidx) { var x = st(o.id); x.lesson = true; (o.labs || []).forEach(function (l) { x.labs[l] = true; }); if (!x.passed) { x.passed = true; x.best = Math.max(x.best || 0, PASS + 1); x.restored = true; } }
    });
    persist();
  }
  function vCodes(m) {
    var earned = STAGES.filter(function (s) { return st(s.id).passed; });
    var hist = S.history.slice(-8).reverse();
    m.innerHTML = '<h1>Save & restore</h1>' +
      '<div class="panel"><h3>Restore from a checkpoint phrase</h3><p class="muted small">Lost your progress or switched devices? Type the phrase from the last step you passed. Every step up to it unlocks.</p>' +
      '<div class="row"><input class="answer-in grow" id="rc" placeholder="e.g. ' + esc(C.codeExample || 'PHRASE-HERE') + '" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false"><button class="btn pri" id="rb">Restore</button></div></div>' +
      '<div class="panel" style="margin-top:12px"><h3>Your checkpoint phrases</h3>' +
      (earned.length ? '<div class="list">' + earned.map(function (s) { return '<div class="li" style="cursor:default"><span class="chip ok">' + esc(stepLabel(s).replace('Step ', '')) + '</span><span class="grow"><b>' + esc(s.title) + '</b><div class="mono small" style="color:var(--acc);margin-top:2px">' + esc(s.code) + '</div></span><button class="btn sm" data-cp="' + esc(s.code) + '">Copy</button></div>'; }).join('') + '</div>' +
        '<p class="muted small" style="margin-top:10px">Only your latest phrase in each track matters — it restores everything before it in that track.</p>' : '<p class="muted">Pass your first gate test to earn a phrase.</p>') + '</div>' +
      '<div class="panel" style="margin-top:12px"><h3>Backup file</h3><p class="muted small">Exports everything — card schedules, missed questions, lab configs. Use it to move between iPhone and laptop with full detail.</p>' +
      '<div class="row"><button class="btn" id="ex">Export backup</button><label class="btn">Import backup<input type="file" id="im" accept=".json,application/json" hidden></label></div></div>' +
      '<div class="panel" style="margin-top:12px"><h3>Device mode</h3><p class="muted small">Currently: <b>' + (S.device === 'phone' ? 'Phone (lite)' : 'Laptop (full)') + '</b></p><button class="btn" id="dev">Switch device mode</button></div>' +
      (hist.length ? '<div class="panel" style="margin-top:12px"><h3>Recent tests</h3>' + hist.map(function (h) { var s = stageById(h.stage); return '<div class="row small" style="margin:4px 0"><span class="grow">' + esc(s ? s.title : h.stage) + '</span><span class="mono" style="color:' + (h.pct > PASS ? 'var(--ok)' : 'var(--bad)') + '">' + h.pct + '%</span><span class="dim">' + new Date(h.at).toLocaleDateString() + '</span></div>'; }).join('') + '</div>' : '') +
      '<div class="panel" style="margin-top:12px"><h3>Danger zone</h3><button class="btn warn" id="rs">Reset all progress</button></div>';
    $('#rb', m).onclick = function () {
      var v = normCode($('#rc', m).value);
      var s = STAGES.filter(function (x) { return normCode(x.code) === v; })[0];
      if (!s) { toast('That phrase does not match any step. Check spelling.'); return; }
      restoreTo(s); S.track = s.track; toast('✓ Restored through ' + esc(stepLabel(s)) + ': ' + esc(s.title), 3000); route();
    };
    m.querySelectorAll('[data-cp]').forEach(function (b) { b.onclick = function () { copy(b.dataset.cp); }; });
    $('#ex', m).onclick = function () {
      var labs = {}; try { for (var k = 0; k < localStorage.length; k++) { var key = localStorage.key(k); if (key.indexOf(C.id + ':lab:') === 0) labs[key] = localStorage.getItem(key); } } catch (e) { }
      var blob = new Blob([JSON.stringify({ course: C.id, at: Date.now(), state: S, labs: labs })], { type: 'application/json' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = C.id + '-backup-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    };
    $('#im', m).onchange = function (e) {
      var f = e.target.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        try {
          var d = JSON.parse(r.result);
          if (d.course !== C.id) { toast('That backup belongs to a different course (' + esc(d.course) + ')'); return; }
          var dev = S.device; S = d.state; S.device = dev; persist();
          Object.keys(d.labs || {}).forEach(function (k) { try { localStorage.setItem(k, d.labs[k]); } catch (e) { } });
          toast('✓ Backup imported'); route();
        } catch (err) { toast('Could not read that file'); }
      };
      r.readAsText(f);
    };
    $('#dev', m).onclick = function () { picker(true); };
    $('#rs', m).onclick = function () {
      if (prompt('Type RESET to wipe all progress on this device') === 'RESET') {
        try { Object.keys(localStorage).forEach(function (k) { if (k.indexOf(C.id + ':') === 0) localStorage.removeItem(k); }); } catch (e) { }
        var dev = S.device; S = { device: dev, stages: {}, cards: {}, missed: {}, history: [], created: Date.now() }; persist(); route();
      }
    };
  }

  // expose for lab plugins / debugging
  window.ENGINE_Q = { prep: prep, renderQ: renderQ, wire: wire };
  window.ENGINE = { state: function () { return S; }, persist: persist, stages: STAGES, st: st, route: route, esc: esc };

  // ---------- boot ----------
  shell();
  if (!S.device) picker(false); else route();
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { }); });
  }
})();

</script>
</body>
</html>
